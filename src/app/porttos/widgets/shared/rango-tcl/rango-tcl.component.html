<div class="rango-tcl" role="group" [attr.aria-label]="'PORTTOS.RANGO_TCL.RANGO' | translate">
    <button type="button" *ngFor="let o of opciones" [class.activo]="o.valor === valor" [disabled]="deshabilitado"
        (click)="o.valor !== valor && cambio.emit(o.valor)">{{ (o.etiqueta | translate) }}</button>
</div>
