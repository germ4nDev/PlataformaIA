<div class="tc-header-layout d-flex align-items-center justify-content-between w-100">

    <!-- Título y Subtítulo a la izquierda -->
    <div class="tc-title-section">
        <img id="main-logo" src="{{ logoEmpresa }}" alt="logo-img" class="logo" />
    </div>

    <!-- Contenedor derecho -->
    <div class="tc-controls-section d-flex align-items-start">
        <div style="display: flex; align-items: center;">

            <!-- 🟢 FILTRO DE BRAZO (Solo visible cuando la pestaña activa es GNL) -->
            <div *ngIf="esPestanaGnl" class="tc-filtro-puerto-wrapper animate__animated animate__fadeIn">
                <div class="tc-filtro-puerto">
                    <small class="titulo-filtro">Filtrar Brazo</small>
                    <select class="tc-dropdown" [(ngModel)]="brazoSeleccionado" (change)="onCambioBrazo($event)">
                        <option value="TODOS">🌐 Vista General (Consolidado)</option>
                        <option *ngFor="let brazo of listaBrazos" [value]="brazo">
                            🔧 {{ brazo }}
                        </option>
                    </select>
                </div>
            </div>

            <!-- 🔵 FILTRO DE PUERTO -->
            <div class="tc-filtro-puerto-wrapper mr-4">
                <div class="tc-filtro-puerto">
                    <small class="titulo-filtro">{{ 'TORRE_CONTROL.HEADER.FT_PUERTO' | translate }}</small>
                    <select class="tc-dropdown" [(ngModel)]="nodoSeleccionado" (change)="onCambioNodo($event)">
                        <option *ngFor="let nodo of listaCiudadesPortuarias" [value]="nodo.id_puerto">
                            {{ nodo.id_puerto }}
                        </option>
                    </select>
                </div>
            </div>

            <div class="d-flex flex-column align-items-end">

                <!-- Renglón Superior: Iconos, Idioma, Perfil y Reloj -->
                <ul class="tc-toolbar-nav d-flex align-items-center mb-0 list-unstyled gap-2">

                    <li class="nav-item">
                        <button type="button" class="btn-navbar-porttos" (click)="goBack($event)"
                            title="Menú Principal">
                            <i class="feather icon-home"></i>
                        </button>
                    </li>

                    <li class="nav-item ms-2">
                        <app-language-selector></app-language-selector>
                    </li>

                    <li class="nav-item profile-wrapper mr-3">
                        <app-profile-drp></app-profile-drp>
                    </li>

                    <li class="nav-item">
                        <div class="clock-time reloj-style">
                            {{ horaActual }}
                        </div>
                    </li>
                </ul>

                <!-- Renglón Inferior: Fecha extendida -->
                <div class="clock-date-full fecha-texto">
                    {{ fechaActual }}
                </div>

            </div>
        </div>
    </div>
</div>
