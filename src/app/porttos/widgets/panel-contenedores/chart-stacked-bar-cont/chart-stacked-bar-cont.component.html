<app-widget-shell [titulo]="data?.titulo || '📦 RETIROS DE CONTENEDORES CARGADOS · 8 DÍAS'"
    [subtitulo]="data?.subtitulo || 'Priorización por vencimiento de Free Time'"
    [icono]="data?.icono || 'feather icon-clock'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-primary text-uppercase">
            Proyecciones
        </span>
    </div>

    <!-- CUERPO ÚNICO DEL WIDGET -->
    <div class="chart-wrapper w-100 h-100 position-relative pb-2 animate__animated animate__fadeIn">

        <!-- Loader mientras responde el backend -->
        <div *ngIf="cargando" class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute"
            style="top: 0; left: 0; z-index: 10;">
            <div class="spinner-border text-info spinner-border-sm me-2" role="status"></div>
            <span class="text-muted" style="font-size: 0.8rem;">Calculando priorización de retiros...</span>
        </div>

        <!-- Estado Vacío -->
        <div *ngIf="!cargando && !tieneDatos"
            class="d-flex flex-column justify-content-center align-items-center w-100 h-100 text-muted small">
            <i class="feather icon-package fs-2 mb-2 opacity-50"></i>
            Sin proyecciones de retiro registradas para este puerto.
        </div>

        <!-- Gráfica Chart.js -->
        <canvas *ngIf="!cargando && tieneDatos" baseChart [data]="barChartData" [options]="barChartOptions"
            [type]="'bar'">
        </canvas>

    </div>

</app-widget-shell>
