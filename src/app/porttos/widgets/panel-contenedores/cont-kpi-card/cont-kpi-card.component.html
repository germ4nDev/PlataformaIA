<!-- 🟢 El Shell se encarga de mostrar el título y subtítulo en la cabecera -->
<app-widget-shell [titulo]="titulo" [subtitulo]="subtitulo"
    [icono]="widgetConfig?.data?.icono || 'feather icon-activity'" [isEnfoque]="isEnfoque"
    (clickEnfoque)="maximizarDesdeShell()">

    <!-- CUERPO ÚNICO DEL WIDGET (El número gigante en el centro) -->
    <div
        class="w-100 h-100 d-flex flex-column justify-content-center align-items-center animate__animated animate__fadeIn">

        <!-- Valor del KPI -->
        <h1 class="kpi-value text-white fw-bold mb-0 text-center">
            {{ valor }}
        </h1>

        <!-- Etiqueta extra (Solo visible en modo enfoque para aprovechar el espacio) -->
        <span *ngIf="isEnfoque" class="text-muted text-uppercase mt-2" style="font-size: 0.75rem; letter-spacing: 1px;">
            Métrica Consolidada
        </span>

    </div>

</app-widget-shell>
