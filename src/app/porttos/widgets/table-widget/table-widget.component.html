<div class="PORTTOS-widget card p-3 shadow-sm h-100">
    <h6 class="text-muted mb-3">{{ title }}</h6>
    <table class="table table-hover table-sm">
        <thead>
            <tr>
                <th *ngFor="let col of data.columnas">{{ col }}</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let row of data.filas">
                <td *ngFor="let col of data.columnas">{{ row[col] }}</td>
            </tr>
        </tbody>
    </table>
</div>
