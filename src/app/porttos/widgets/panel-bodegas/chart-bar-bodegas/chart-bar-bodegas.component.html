<app-widget-shell [titulo]="(data?.titulo | translate) || (widgetConfig?.titulo | translate) || ('PORTTOS.CHART_BAR_BODEGAS.FLUJO_DE_RECIBO_VS_DESPACHO' | translate)"
    [subtitulo]="(data?.subtitulo | translate) || (widgetConfig?.subtitulo | translate) || ('PORTTOS.CHART_BAR_BODEGAS.INGRESO_DESDE_BUQUE_FRENTE_A' | translate)"
    [icono]="data?.icono || 'feather icon-bar-chart-2'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()" [origen]="data?.origen">

    <!-- PROYECCIÓN AL HEADER: Balance Neto -->
    <div acciones-extra class="d-flex align-items-center gap-2">
        <span class="tc-badge badge-info text-uppercase" *ngIf="!cargando && !sinDatos">
            {{ 'PORTTOS.CHART_BAR_BODEGAS.IN_T_OUT_T' | translate: { p0: (totalEntradasTon | number:'1.0-0'), p1: (totalSalidasTon | number:'1.0-0') } }}
        </span>
    </div>

    <!-- CUERPO DEL WIDGET -->
    <div class="w-100 h-100 position-relative d-flex flex-column p-2 animate__animated animate__fadeIn">

        <!-- Loader -->
        <div *ngIf="cargando" class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute"
            style="top: 0; left: 0; z-index: 10;">
            <div class="spinner-border text-info spinner-border-sm me-2" role="status"></div>
            <span class="text-muted small">{{ 'PORTTOS.CHART_BAR_BODEGAS.CARGANDO_BALANCE_DE_BODEGAS' | translate }}</span>
        </div>

        <!-- Estado sin datos -->
        <div *ngIf="!cargando && sinDatos"
            class="d-flex flex-column justify-content-center align-items-center w-100 h-100 text-muted small">
            <i class="feather icon-bar-chart fs-2 mb-2 opacity-50"></i>
            {{ 'PORTTOS.CHART_BAR_BODEGAS.SIN_MOVIMIENTOS_DE_RECIBO_O' | translate }}
        </div>

        <!-- Canvas Chart.js -->
        <div class="flex-grow-1 position-relative" style="min-height: 0;" [hidden]="cargando || sinDatos">
            <canvas #barBodegasCanvas></canvas>
        </div>

    </div>

</app-widget-shell>
