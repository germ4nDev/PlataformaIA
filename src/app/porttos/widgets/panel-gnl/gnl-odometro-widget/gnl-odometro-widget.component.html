<app-widget-shell [titulo]="'Energía Transferida'" [subtitulo]="'TOTALIZADOR EN MMBTU'" [icono]="'feather icon-zap'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <div class="h-100 w-100 d-flex flex-column align-items-center justify-content-center p-4">
        <div class="odometer-box d-flex align-items-baseline gap-2">
            <!-- Usamos un pipe de Angular para que se vea como 1,425.50 -->
            <span class="odometer-valor">{{ energiaTotal | number:'1.2-2' }}</span>
            <span class="odometer-unidad">MMBTU</span>
        </div>
        <div class="mt-3 tc-badge badge-light-warning">
            <i class="feather icon-trending-up me-1"></i> Facturación en vivo
        </div>
    </div>
</app-widget-shell>
