<app-widget-shell [titulo]="widgetConfig?.titulo || 'Presión de Línea'"
    [subtitulo]="widgetConfig?.subtitulo || 'TELEMETRÍA SCADA'" [icono]="'feather icon-compass'" [isEnfoque]="isEnfoque"
    (clickEnfoque)="maximizarDesdeShell()" [origen]="origen$ | async">

    <div class="scada-widget-inner w-100 h-100 d-flex flex-column justify-content-between p-2"
        [ngClass]="{'modo-enfoque': isEnfoque}">

        <!-- Header -->
        <div class="d-flex align-items-center justify-content-end px-2">
            <span class="badge bg-dark text-uppercase small">{{ ultimoBrazo }}</span>
            <span class="status-dot ms-2" [style.background-color]="colorEstado"
                [ngClass]="{'blinking': colorEstado === '#ff4757'}"></span>
        </div>

        <!-- Cuerpo del Tacómetro -->
        <div class="gauge-body flex-grow-1 d-flex justify-content-center align-items-center position-relative">

            <!-- 🟢 Inyectamos el colorEstado como variable CSS para la aguja y activamos latido si es rojo -->
            <div class="gauge-container" [style.--color-estado]="colorEstado"
                [ngClass]="{'estado-peligro': colorEstado === '#ff4757'}">

                <svg class="gauge-svg" viewBox="0 0 100 50">
                    <path d="M 15 45 A 35 35 0 0 1 85 45" fill="none" stroke-width="7" stroke-linecap="round"
                        stroke="#2b2b40"></path>

                    <!-- 🟢 STROKE DINÁMICO: Cambia de color mágicamente según el Get colorEstado() -->
                    <path class="gauge-danger" d="M 15 45 A 35 35 0 0 1 85 45" fill="none" stroke-width="7"
                        stroke-linecap="round" [attr.stroke]="colorEstado" [attr.stroke-dasharray]="arcoDashArray"
                        style="transition: stroke-dasharray 0.4s ease-in-out, stroke 0.4s ease-in-out;">
                    </path>
                </svg>

                <div class="gauge-needle" [style.transform]="'rotate(' + anguloAguja + 'deg)'"></div>

                <!-- Caja Numérica Dinámica -->
                <div class="gauge-value"
                    [style.borderColor]="colorEstado === '#00d4ff' ? 'rgba(255,255,255,0.08)' : colorEstado"
                    [style.backgroundColor]="colorEstado === '#00d4ff' ? 'rgba(20, 20, 30, 0.85)' : colorEstado + '1A'">
                    <span class="numero" [style.color]="colorEstado">{{ presionActual | number:'1.2-2' }}</span>
                    <span class="unidad" [style.color]="colorEstado === '#00d4ff' ? '#a1a5b7' : colorEstado">PSI</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="scada-footer text-center py-1">
            <span class="temp-label text-muted">Temp. Ducto:</span>
            <span class="temp-value fw-bold text-info">{{ temperaturaActual | number:'1.2-2' }} °C</span>
        </div>

    </div>

</app-widget-shell>
