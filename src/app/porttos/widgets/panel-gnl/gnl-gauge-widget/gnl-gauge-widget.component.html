<app-widget-shell [titulo]="widgetConfig?.tituloWidget || 'Presión de Descarga'"
    [subtitulo]="widgetConfig?.descripcionWidget || 'Telemetría de Brazo de Carga'" [icono]="'feather icon-compass'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()"
    [class.alerta-roja]="alarmaActiva || presionActual >= 100">

    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge text-uppercase" [ngClass]="{
                  'badge-danger blinking': alarmaActiva || presionActual >= 100,
                  'badge-warning': !alarmaActiva && presionActual >= 85 && presionActual < 100,
                  'badge-success': !alarmaActiva && presionActual < 85
              }">
            {{ (alarmaActiva || presionActual >= 100) ? 'ALTA PRESIÓN' : (presionActual >= 85 ? 'PRECAUCIÓN' :
            'ESTABLE') }}
        </span>
    </div>

    <div class="h-100 w-100 d-flex flex-column align-items-center justify-content-center position-relative pb-2 animate__animated animate__fadeIn"
        [class.modo-enfoque]="isEnfoque" style="min-height: 200px;">

        <div *ngIf="cargando" class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute"
            style="top:0; left:0; z-index: 10;">
            <div class="spinner-border text-secondary spinner-border-sm me-2" role="status"></div>
            <span class="text-muted" style="font-size: 0.8rem;">Esperando telemetría...</span>
        </div>

        <div class="gauge-container" [style.opacity]="cargando ? '0.3' : '1'" [ngClass]="{
                 'estado-peligro': presionActual >= 100,
                 'estado-advertencia': presionActual >= 85 && presionActual < 100,
                 'estado-estable': presionActual < 85
             }">
            <svg viewBox="0 0 100 50" class="gauge-svg">
                <!-- Riel gris base (Color controlado por las variables del SCSS) -->
                <!-- ¡SIN ATRIBUTO STROKE! -->
                <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke-width="8"
                    stroke-linecap="round" />

                <!-- Riel de estado final (Calculado geométricamente) -->
                <!-- ¡SIN ATRIBUTO STROKE! -->
                <path class="gauge-danger" d="M 78.3 21.7 A 40 40 0 0 1 90 50" fill="none" stroke-width="8"
                    stroke-linecap="round" />
            </svg>

            <!-- Aguja dinámica -->
            <div class="gauge-needle" [style.transform]="'rotate(' + calcularAnguloAguja + 'deg)'"></div>

            <!-- Valor numérico en el centro -->
            <div class="gauge-value">
                <span class="numero">{{ presionActual | number:'1.1-2' }}</span>
                <span class="unidad">PSI</span>
            </div>
        </div>

        <div class="mt-4 text-center">
            <span class="text-muted fs-6 me-2">Temp. Ducto:</span>
            <span class="fw-bold fs-5" [ngClass]="{
                      'text-danger': temperaturaActual > -150,
                      'text-warning': temperaturaActual > -155 && temperaturaActual <= -150,
                      'text-info': temperaturaActual <= -155
                  }">
                {{ temperaturaActual | number:'1.2-2' }} °C
            </span>
        </div>

    </div>

</app-widget-shell>
