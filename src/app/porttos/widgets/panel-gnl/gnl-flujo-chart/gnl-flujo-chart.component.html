<app-widget-shell [titulo]="widgetConfig?.titulo || 'Histórico de Flujo (m³/h)'"
    [subtitulo]="widgetConfig?.subtitulo || 'CAUDAL DE GNL EN TIEMPO REAL (SCADA)'" [icono]="'feather icon-activity'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- 🟢 PROYECCIÓN AL HEADER: Badge de Energía y Nombre del Brazo -->
    <!-- Todo lo que pongamos aquí dentro aparecerá en la esquina superior derecha del widget -->
    <div acciones-extra class="d-flex align-items-center me-2">

        <!-- Píldora de Energía Consumida (MMBTU) -->
        <div class="energia-pill d-flex align-items-center me-3" [ngClass]="{'cargando': cargando}">
            <i class="feather icon-zap me-1"></i>
            <span class="fw-bold">{{ energiaTotal | number:'1.2-2' }} MMBTU</span>
        </div>

        <!-- 🟢 Badge Dinámico del Brazo Filtrado -->
        <span class="badge bg-dark text-uppercase small" *ngIf="!cargando">
            {{ ultimoBrazo }}
        </span>
    </div>

    <!-- CONTENEDOR PRINCIPAL DEL WIDGET -->
    <div class="scada-widget-inner w-100 h-100 d-flex flex-column position-relative"
        [ngClass]="{'modo-enfoque': isEnfoque}">

        <!-- Spinner de carga -->
        <div *ngIf="cargando" class="w-100 h-100 d-flex justify-content-center align-items-center">
            <div class="spinner-border text-info" role="status">
                <span class="visually-hidden">Conectando a SCADA...</span>
            </div>
        </div>

        <!-- Gráfica de Flujo -->
        <div class="chart-container w-100 flex-grow-1 position-relative" [class.d-none]="cargando">
            <canvas #flowCanvas></canvas>
        </div>

    </div>

</app-widget-shell>
