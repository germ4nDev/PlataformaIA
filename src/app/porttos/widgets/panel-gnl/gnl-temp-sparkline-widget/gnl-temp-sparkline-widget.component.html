<app-widget-shell [titulo]="widgetConfig?.titulo || 'Temperatura Criogénica'"
    [subtitulo]="widgetConfig?.subtitulo || 'TENDENCIA TÉRMICA EN TIEMPO REAL'" [icono]="'feather icon-thermometer'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()" [origen]="origen$ | async">

    <!-- 🟢 2. Proyección al Header (Badge del Brazo) -->
    <!-- Se proyectará automáticamente arriba gracias al atributo 'acciones-extra' -->
    <div *ngIf="!cargando" acciones-extra class="d-flex align-items-center">
        <span class="badge bg-dark text-uppercase small">{{ ultimoBrazo }}</span>
    </div>

    <!-- Contenedor general de la tarjeta -->
    <div class="w-100 h-100 d-flex flex-column position-relative overflow-hidden" [ngClass]="{'p-4': isEnfoque}">

        <!-- 1. El Número Gigante Central (pointer-events: none para el Tooltip) -->
        <div class="d-flex flex-column align-items-center justify-content-center flex-grow-1"
            style="z-index: 2; padding-bottom: 2rem; pointer-events: none;">

            <!-- Loader mientras llegan los datos del SCADA -->
            <div *ngIf="cargando" class="spinner-border text-info spinner-border-sm mb-2" role="status"></div>

            <!-- Información cuando ya hay telemetría -->
            <ng-container *ngIf="!cargando">
                <h1 class="fw-bolder text-info mb-1"
                    style="font-size: clamp(3rem, 5vw, 4.5rem); letter-spacing: -1.5px; text-shadow: 0 4px 10px rgba(0,0,0,0.4);">
                    {{ tempActual | number:'1.2-2' }} °C
                </h1>

                <span class="text-muted small fw-medium">
                    Límite operativo: {{ limiteOperativo | number:'1.1-1' }} °C
                </span>
            </ng-container>

        </div>



        <!-- 3. Gráfica Sparkline Invertida (Al fondo del widget) -->
        <!-- El z-index: 1 la pone debajo del número y permite que reciba el hover del mouse -->
        <div class="position-absolute bottom-0 start-0 w-100" style="height: 45%; z-index: 1;">
            <canvas #tempCanvas></canvas>
        </div>

    </div>

</app-widget-shell>
