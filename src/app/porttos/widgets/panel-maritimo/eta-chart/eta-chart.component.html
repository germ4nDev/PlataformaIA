<app-widget-shell [titulo]="data?.titulo || widgetConfig?.titulo || 'REPORTE ETA VS ATA'"
    [subtitulo]="data?.subtitulo || widgetConfig?.subtitulo || 'Desviación media (horas) entre arribo estimado y atraque real'"
    [icono]="data?.icono || 'feather icon-clock'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()" [origenMaritimo]="widgetConfig">

    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-info text-uppercase" title="Estimated Time of Arrival vs Actual Time of Arrival">
            Atraques
        </span>
    </div>

    <div class="chart-wrapper w-100 h-100 position-relative d-flex flex-column p-2 animate__animated animate__fadeIn">
        <!-- Loader -->
        <div *ngIf="cargando" class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute"
            style="top: 0; left: 0; z-index: 10;">
            <div class="spinner-border text-info spinner-border-sm me-2" role="status"></div>
            <span class="text-muted" style="font-size: 0.8rem;">Calculando desviación ETA vs ATA...</span>
        </div>

        <!-- Canvas Chart.js unificado -->
        <div class="flex-grow-1 position-relative" style="min-height: 0;"
            [ngClass]="{'d-none': cargando || !tieneDatos}">
            <canvas #etaChartCanvas></canvas>
        </div>

        <!-- Estado vacío -->
        <div *ngIf="!cargando && !tieneDatos"
            class="d-flex flex-column justify-content-center align-items-center w-100 h-100 text-muted">
            <i class="feather icon-clock fs-2 mb-2 opacity-50"></i>
            <span style="font-size: 0.8rem;">Sin registros de desviación ETA/ATA en este puerto.</span>
        </div>
    </div>

</app-widget-shell>
