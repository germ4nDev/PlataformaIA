<app-widget-shell [titulo]="data?.titulo || '🏆 PARTICIPACIÓN TERMINALES'"
    [subtitulo]="data?.subtitulo || 'Distribución de mercado por operador'"
    [icono]="data?.icono || 'feather icon-pie-chart'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-success text-uppercase">
            Mercado
        </span>
    </div>

    <!-- CUERPO ÚNICO DEL WIDGET (Contenedor de la Gráfica Doughnut) -->
    <div class="chart-wrapper w-100 h-100 position-relative pb-2 animate__animated animate__fadeIn flex-grow-1 min-h-0">
        <canvas #donutChart></canvas>
    </div>

</app-widget-shell>
