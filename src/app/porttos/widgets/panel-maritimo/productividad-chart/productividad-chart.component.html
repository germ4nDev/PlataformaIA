<app-widget-shell [titulo]="data?.titulo || widgetConfig?.titulo || 'PRODUCTIVIDAD POR TERMINAL (MOVS/H)'"
    [subtitulo]="data?.subtitulo || widgetConfig?.subtitulo || 'Velocidad de operación por grúa en la jornada'"
    [icono]="data?.icono || 'feather icon-activity'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()" [origenMaritimo]="widgetConfig">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-warning text-uppercase">
            Rendimiento
        </span>
    </div>

    <!-- CUERPO ÚNICO DEL WIDGET -->
    <div class="w-100 h-100 d-flex flex-column p-2 animate__animated animate__fadeIn position-relative">

        <!-- Contenedor Flex para la Gráfica (La leyenda superior la gestiona PorttosChartHelper) -->
        <div class="chart-wrapper flex-grow-1 position-relative min-h-0">

            <!-- Loader nativo estandarizado -->
            <div *ngIf="cargando" class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute"
                style="top: 0; left: 0; z-index: 10;">
                <div class="spinner-border text-info spinner-border-sm me-2" role="status"></div>
                <span class="text-muted" style="font-size: 0.8rem;">Sincronizando curva de productividad...</span>
            </div>

            <!-- Estado sin datos -->
            <div *ngIf="!cargando && !tieneDatos"
                class="d-flex flex-column justify-content-center align-items-center w-100 h-100 text-muted">
                <i class="feather icon-activity fs-2 mb-2 opacity-50"></i>
                <span style="font-size: 0.8rem;">Sin lecturas de movimientos/hora para este puerto.</span>
            </div>

            <!-- Gráfica Chart.js -->
            <canvas #productivityCanvas class="w-100 h-100" [ngClass]="{'d-none': cargando || !tieneDatos}"></canvas>

        </div>

    </div>

</app-widget-shell>
