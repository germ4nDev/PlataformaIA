<app-widget-shell [titulo]="data?.titulo || 'TIPO DE OPERACIÓN'"
    [subtitulo]="data?.subtitulo || 'Distribución por régimen aduanero'" [icono]="data?.icono || 'feather icon-shuffle'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-purple text-uppercase">
            Régimen
        </span>
    </div>

    <!-- CUERPO ÚNICO DEL WIDGET (Contenedor de la Gráfica Doughnut) -->
    <div class="chart-wrapper w-100 h-100 position-relative pb-2 animate__animated animate__fadeIn flex-grow-1 min-h-0">
        <canvas #opsChart></canvas>
    </div>

</app-widget-shell>
