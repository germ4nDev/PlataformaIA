<app-widget-shell [titulo]="data?.titulo || widgetConfig?.titulo || 'TIPO DE OPERACIÓN PORTUARIA'"
    [subtitulo]="data?.subtitulo || widgetConfig?.subtitulo || 'Importación · Exportación · Transbordo · Cabotaje'"
    [icono]="data?.icono || 'feather icon-repeat'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()" [origenMaritimo]="widgetConfig">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-info text-uppercase">
            Comercio
        </span>
    </div>

    <!-- CUERPO DEL WIDGET -->
    <div
        class="w-100 h-100 d-flex flex-column justify-content-between p-2 position-relative animate__animated animate__fadeIn">

        <!-- Estado Cargando -->
        <div *ngIf="isLoading" class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute"
            style="top: 0; left: 0; z-index: 10;">
            <div class="spinner-border text-info spinner-border-sm me-2" role="status"></div>
            <span class="text-muted small">Calculando proporción por flujo...</span>
        </div>

        <!-- Estado Vacío -->
        <div *ngIf="!isLoading && !tieneDatos"
            class="d-flex flex-column justify-content-center align-items-center w-100 h-100 text-muted small">
            <i class="feather icon-repeat fs-2 mb-2 opacity-50"></i>
            Sin registros de tipo de operación para este puerto.
        </div>

        <!-- Dona + Leyenda Lateral Estandarizada -->
        <div class="row align-items-center h-100 g-2" [hidden]="isLoading || !tieneDatos">
            <!-- Canvas con Flujo Dominante en el Centro -->
            <div class="col-6 h-100 position-relative d-flex justify-content-center align-items-center"
                style="min-height: 150px;">
                <canvas #opsChart></canvas>
                <div class="position-absolute text-center" style="pointer-events: none;" *ngIf="flujoDominante">
                    <span class="d-block fw-bolder" style="font-size: 1.05rem;">
                        {{ flujoDominante.porcentaje }}%
                    </span>
                    <small class="text-muted text-uppercase d-block text-truncate"
                        style="font-size: 0.58rem; max-width: 72px;">
                        {{ flujoDominante.label }}
                    </small>
                </div>
            </div>

            <!-- Leyenda Lateral con Porcentajes -->
            <div class="col-6 d-flex flex-column gap-2 pe-2 overflow-auto custom-scrollbar" style="max-height: 100%;">
                <div *ngFor="let item of leyendaItems" class="d-flex justify-content-between align-items-center"
                    style="font-size: 0.75rem;">
                    <div class="d-flex align-items-center gap-2 text-truncate">
                        <span class="rounded-circle flex-shrink-0" [style.background-color]="item.color"
                            style="width: 9px; height: 9px; display: inline-block;">
                        </span>
                        <span class="fw-medium text-truncate" [title]="item.label">{{ item.label }}</span>
                    </div>
                    <span class="fw-bold text-info ms-2">{{ item.porcentaje }}%</span>
                </div>
            </div>
        </div>

    </div>

</app-widget-shell>
