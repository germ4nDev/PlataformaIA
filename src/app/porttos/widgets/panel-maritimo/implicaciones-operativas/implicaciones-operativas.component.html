<app-widget-shell [titulo]="data.titulo || '🎯 IMPLICACIONES OPERATIVAS PARA LA TORRE DE CONTROL'"
    [subtitulo]="data.subtitulo || 'Impacto en el control de la operación portuaria y terrestre'"
    [icono]="data.icono || 'feather icon-alert-circle'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-danger text-uppercase">
            Directrices · {{ insights.length }}
        </span>
    </div>

    <!-- CUERPO ÚNICO DEL WIDGET (Lista con scroll integrado) -->
    <div class="w-100 h-100 overflow-auto pt-2 pe-2 animate__animated animate__fadeIn custom-scrollbar">

        <div class="insights-grid d-flex flex-column gap-2 pb-2 h-100">

            <!-- Estado Cargando -->
            <div *ngIf="isLoading" class="d-flex justify-content-center align-items-center h-100 text-muted small py-4">
                <div class="spinner-border text-info spinner-border-sm me-2" role="status"></div>
                Evaluando implicaciones operativas del puerto...
            </div>

            <!-- Estado Vacío -->
            <div *ngIf="!isLoading && insights.length === 0"
                class="d-flex justify-content-center align-items-center h-100 text-muted small py-4">
                <i class="feather icon-check-circle me-2 text-success"></i>
                No hay implicaciones u observaciones registradas para este puerto.
            </div>

            <!-- Iteración de Implicaciones / Insights -->
            <ng-container *ngIf="!isLoading && insights.length > 0">
                <div class="insight-item" *ngFor="let item of insights; trackBy: trackByInsight">
                    <h4 class="insight-title d-flex align-items-center mb-1">
                        <span class="dot me-2" [ngStyle]="{'background-color': item.color || '#ef4444'}"></span>
                        {{ item.titulo }}
                    </h4>
                    <p class="insight-text text-muted mb-0 small ps-3 border-start ms-1"
                        [ngStyle]="{'border-color': item.color || '#ef4444'}">
                        {{ item.descripcion }}
                    </p>
                </div>
            </ng-container>

        </div>

    </div>

</app-widget-shell>
