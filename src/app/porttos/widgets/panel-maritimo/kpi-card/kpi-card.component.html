<app-widget-shell [titulo]="data.titulo || 'Métrica Clave'" [subtitulo]="data.tendencia || 'Calculando tendencia...'"
    [icono]="'feather icon-activity'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- 🟢 ESTADO DE CARGA (Skeleton IA o Filtro Activo) -->
    <div *ngIf="data.cargandoIA || isLoading"
        class="w-100 h-100 d-flex flex-column justify-content-center align-items-center gap-3">
        <!-- Recreamos un skeleton centrado que simula la métrica cargando -->
        <div class="skeleton-box rounded-pill w-25" style="height: 0.75rem; opacity: 0.4;"></div>
        <div class="skeleton-box rounded w-75" style="height: 4rem; opacity: 0.7;"></div>
        <div class="skeleton-box rounded-pill w-50" style="height: 0.75rem; opacity: 0.4;"></div>
    </div>

    <!-- 🟢 ESTADO CARGADO (Valor Gigante Central) -->
    <div *ngIf="!data.cargandoIA && !isLoading"
        class="w-100 h-100 d-flex flex-column justify-content-center align-items-center animate__animated animate__fadeIn">

        <h1 class="kpi-value text-white fw-bold mb-0 text-center" [ngClass]="data.colorBorde || ''">
            {{ data.valor || '0' }}
        </h1>

        <!-- Indicador opcional para cuando está en pantalla completa -->
        <span *ngIf="isEnfoque" class="text-muted text-uppercase mt-2" style="font-size: 0.7rem; letter-spacing: 1px;">
            KPI Consolidado
        </span>

    </div>

</app-widget-shell>
