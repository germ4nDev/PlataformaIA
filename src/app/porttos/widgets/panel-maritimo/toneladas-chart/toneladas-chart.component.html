<app-widget-shell [titulo]="data?.titulo || widgetConfig?.titulo || 'TONELADAS MOVIDAS HOY · POR TIPO'"
    [subtitulo]="data?.subtitulo || widgetConfig?.subtitulo || 'Volumen diario operado por terminal y especialidad de carga'"
    [icono]="data?.icono || 'feather icon-bar-chart'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()" [origenMaritimo]="widgetConfig">

    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-success text-uppercase">
            TM / TEU Hoy
        </span>
    </div>

    <div class="chart-wrapper w-100 h-100 position-relative d-flex flex-column p-2 animate__animated animate__fadeIn">

        <!-- Loader -->
        <div *ngIf="isLoading" class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute"
            style="top: 0; left: 0; z-index: 10;">
            <div class="spinner-border text-info spinner-border-sm me-2" role="status"></div>
            <span class="text-muted small">Sincronizando volumen por terminal...</span>
        </div>

        <!-- Gráfica Chart.js Estandarizada -->
        <div class="flex-grow-1 position-relative" style="min-height: 0;"
            [ngClass]="{'d-none': isLoading || !tieneDatos}">
            <canvas #toneladasCanvas></canvas>
        </div>

        <!-- Estado vacío -->
        <div *ngIf="!isLoading && !tieneDatos"
            class="w-100 h-100 d-flex flex-column justify-content-center align-items-center text-muted small">
            <i class="feather icon-inbox fs-2 mb-2 opacity-50"></i>
            Sin datos de volumen registrados hoy.
        </div>

    </div>
</app-widget-shell>
