<!-- 🚨 Quitamos [subtitulo]="..." de aquí para que no salga en la cabecera -->
<app-kpi-shell [titulo]="data.titulo || 'Métrica Clave'" [icono]="data.icono || 'feather icon-activity'"
    [colorBorde]="data.colorBorde || data.color || 'info'" [isEnfoque]="isEnfoque"
    (clickEnfoque)="maximizarDesdeShell()">

    <!-- 🟢 ESTADO DE CARGA -->
    <div *ngIf="isLoading" class="w-100 h-100 d-flex flex-column justify-content-center align-items-center gap-2">
        <div class="skeleton-box rounded-pill w-25" style="height: 0.5rem; opacity: 0.4;"></div>
        <div class="skeleton-box rounded w-50" style="height: 3rem; opacity: 0.7;"></div>
    </div>

    <!-- 🟢 CUERPO CENTRAL (Solo el número blanco) -->
    <div *ngIf="!isLoading"
        class="w-100 h-100 d-flex justify-content-center align-items-center animate__animated animate__fadeIn">

        <div class="d-flex align-items-baseline gap-1">
            <h1 class="kpi-shell-title" style="text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                {{ (data.valor | kpiFormat) || '0' }}
            </h1>
            <span class="kpi-shell-subtitle" *ngIf="data.unidad">
                {{ data.unidad }}
            </span>
        </div>

    </div>

    <!-- 🟢 FOOTER (Aquí ubicamos el subtítulo) -->
    <div kpi-footer *ngIf="!isLoading" class="w-100 text-center pb-2 px-1">

        <!-- El texto del subtítulo con el guion de acento sutil -->
        <div *ngIf="data.subtitulo" class="kpi-shell-subtitle text-uppercase"
            style="letter-spacing: 0.5px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis;">
            <span style="opacity: 0.5; margin-right: 2px;">—</span>
            {{ data.subtitulo }}
        </div>

        <!-- Tendencia (si llega a existir en la data) -->
        <div *ngIf="data.tendencia" class="mt-1">
            <span class="badge rounded-pill bg-dark border border-secondary text-light px-2 py-1 fw-medium"
                style="font-size: 0.6rem; letter-spacing: 0.3px;">
                <i class="feather icon-trending-up me-1 text-success"></i> {{ data.tendencia }}
            </span>
        </div>
    </div>

</app-kpi-shell>
