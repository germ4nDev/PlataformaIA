<app-widget-shell [titulo]="data.titulo || 'REPORTES OPERATIVOS'"
    [subtitulo]="data.subtitulo || 'Registro de novedades y eventos'" [icono]="data.icono || 'feather icon-file-text'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()" [origenMaritimo]="widgetConfig">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-secondary text-uppercase">
            Novedades · {{ reportes.length }}
        </span>
    </div>

    <!-- CUERPO ÚNICO DEL WIDGET (Lista de reportes con scroll integrado) -->
    <div class="w-100 h-100 overflow-auto pt-2 pe-2 animate__animated animate__fadeIn custom-scrollbar">

        <div class="d-flex flex-column gap-2 pb-2 h-100">

            <!-- Estado Cargando -->
            <div *ngIf="isLoading" class="d-flex justify-content-center align-items-center h-100 text-muted small py-4">
                <div class="spinner-border text-info spinner-border-sm me-2" role="status"></div>
                Consultando boletines y reportes operativos...
            </div>

            <!-- Estado Vacío -->
            <div *ngIf="!isLoading && reportes.length === 0"
                class="d-flex justify-content-center align-items-center h-100 text-muted small py-4">
                <i class="feather icon-check-circle me-2 text-success"></i> No hay reportes operativos recientes.
            </div>

            <!-- Iteración de Reportes -->
            <ng-container *ngIf="!isLoading && reportes.length > 0">
                <div class="reporte-item d-flex justify-content-between align-items-center shadow-sm"
                    *ngFor="let reporte of reportes; trackBy: trackByReporte"
                    [ngClass]="reporte.tipo_color ? 'border-' + reporte.tipo_color : 'border-secondary'">

                    <!-- Contenido (Título y Descripción) -->
                    <div class="reporte-content pe-3">
                        <h6 class="r-titulo mb-1 text-white fw-bold" style="font-size: 0.85rem;">
                            {{ reporte.titulo }}
                        </h6>
                        <p class="r-desc text-muted mb-0" style="font-size: 0.75rem; line-height: 1.3;">
                            {{ reporte.descripcion }}
                        </p>
                    </div>

                    <!-- Fecha / Meta -->
                    <div class="reporte-meta text-end" style="min-width: 75px;">
                        <span
                            class="badge bg-secondary bg-opacity-25 text-light fw-normal border border-secondary border-opacity-50"
                            style="font-size: 0.65rem; letter-spacing: 0.3px;">
                            <i class="feather icon-calendar me-1"></i>{{ reporte.fecha_evento }}
                        </span>
                    </div>

                </div>
            </ng-container>

        </div>

    </div>

</app-widget-shell>
