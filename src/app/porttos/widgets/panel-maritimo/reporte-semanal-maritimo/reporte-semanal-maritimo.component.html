<div class="PORTTOS-widget resumen-maritimo-panel">
    <div class="panel-header">
        <div class="header-titles">
            <h3 class="panel-titulo">
                <i class="feather icon-wind"></i> {{ data.titulo || 'RESUMEN SEMANAL MARITIMO' }}
            </h3>
            <p class="subtitle">{{ data.subtitulo || 'Resumen semanal Marítmo' }}</p>
        </div>
        <div class="header-actions-container">
            <button class="btn-maximizar" (click)="maximizar()" title="Ver en pantalla completa">
                <i class="feather icon-maximize" data-feather="maximize"></i>
            </button>
        </div>
    </div>

    <div class="panel-body">
        <div class="resumen-maritimo-grid">
            <div class="resumen-maritimo-card" *ngFor="let metrica of data?.metricas">
                <span class="c-titulo">{{ metrica.label || '--' }}</span>
                <span class="c-valor">{{ metrica.valor || '--' }}</span>
                <span class="c-sub" [ngClass]="metrica.claseTendencia">{{ metrica.tendencia || '--' }}</span>
            </div>
        </div>
    </div>
</div>
