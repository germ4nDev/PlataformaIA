<app-widget-shell [titulo]="data?.titulo || 'MEZCLA POR TIPO DE CARGA'"
    [subtitulo]="data?.subtitulo || 'Distribución de toneladas movilizadas'"
    [icono]="data?.icono || 'feather icon-bar-chart-2'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-primary text-uppercase">
            Volumen
        </span>
    </div>

    <!-- CUERPO ÚNICO DEL WIDGET (Contenedor de la Gráfica) -->
    <div class="chart-wrapper w-100 h-100 position-relative pb-2 pe-2 animate__animated animate__fadeIn">
        <canvas #barChart></canvas>
    </div>

</app-widget-shell>
