<app-widget-shell [titulo]="data?.titulo || widgetConfig?.titulo || '📊 Histórico Anual'"
    [subtitulo]="data?.subtitulo || widgetConfig?.subtitulo || 'Toneladas movilizadas · Tendencia portuaria'"
    [icono]="data?.icono || 'feather icon-activity'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge text-uppercase"
            [ngClass]="badgeHeader === 'RENDIMIENTO' ? 'badge-warning' : 'badge-info'">
            {{ badgeHeader }}
        </span>
    </div>

    <div class="w-100 h-100 position-relative d-flex flex-column p-2 animate__animated animate__fadeIn">
        <div *ngIf="cargando" class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute"
            style="top: 0; left: 0; z-index: 10;">
            <div class="spinner-border text-info spinner-border-sm me-2" role="status"></div>
            <span class="text-muted small">Cargando serie histórica...</span>
        </div>

        <div *ngIf="!cargando && sinDatos"
            class="d-flex flex-column justify-content-center align-items-center w-100 h-100 text-muted small">
            <i class="feather icon-activity fs-2 mb-2 opacity-50"></i>
            Sin serie histórica anual disponible para este puerto.
        </div>

        <div class="flex-grow-1 position-relative" style="min-height: 0;" [hidden]="cargando || sinDatos">
            <canvas #lineMaritimoCanvas></canvas>
        </div>
    </div>

</app-widget-shell>
