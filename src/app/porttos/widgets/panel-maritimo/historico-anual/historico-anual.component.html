<app-widget-shell
    [titulo]="data?.titulo ? '📊 ' + data.titulo + ' ' + (data?.rango || '') : '📊 HISTÓRICO ANUAL 2018-2025'"
    [subtitulo]="data?.subtitulo || 'Toneladas movilizadas · tendencia de largo plazo'"
    [icono]="data?.icono || 'feather icon-activity'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-cyan text-uppercase">
            Tendencia
        </span>
    </div>

    <!-- CUERPO ÚNICO DEL WIDGET (Contenedor de la Gráfica) -->
    <div class="chart-wrapper w-100 h-100 position-relative pb-2 animate__animated animate__fadeIn">
        <canvas #lineChart></canvas>
    </div>

</app-widget-shell>
