<div class="plataforma-backdrop-blur" *ngIf="visible">
    <div class="plataforma-modal-lg p-4 shadow-lg rounded" (click)="$event.stopPropagation()">

        <!-- Cabecera del Modal (Idéntica al Gestor de Pestañas) -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="titulo-modal mb-1" style="font-size: 1.25rem; color: #fff;">
                    Catálogo de Widgets
                </h3>
                <p class="subtitulo-modal text-muted mb-0" style="font-size: 0.85rem;">
                    Personaliza tu tablero seleccionando las métricas que deseas mostrar en esta sección.
                </p>
            </div>

            <!-- Botones de acción estilo header -->
            <div class="d-flex align-items-center gap-2 flex-shrink-0 ms-3">
                <button type="button" class="lobby-action-btn" (click)="toggleSeleccionarTodos()"
                    [title]="todosEstanSeleccionados ? 'Desmarcar todos' : 'Seleccionar todos'">
                    <i class="feather" [ngClass]="todosEstanSeleccionados ? 'icon-square' : 'icon-check-square'"></i>
                </button>

                <button type="button" class="lobby-action-btn" (click)="cerrarModal()" title="Cerrar catálogo">
                    <i class="feather icon-x"></i>
                </button>
            </div>
        </div>

        <!-- Cuerpo del Catálogo (Ahora sí fuera del d-flex de la cabecera) -->
        <div class="widgets-grid-container overflow-auto pe-2" style="max-height: 65vh;">

            <!-- TABS DE CATEGORÍAS -->
            <div class="tabs-scroll-container d-flex gap-2 mb-4 pb-2 border-bottom border-secondary border-opacity-25">
                <button *ngFor="let cat of categorias" type="button" class="btn-categoria"
                    [class.active]="tabActiva === cat" (click)="cambiarTab(cat)">
                    <i class="feather icon-layers me-2"></i> {{ cat }}
                </button>
            </div>

            <!-- CUADRÍCULA DE WIDGETS -->
            <div class="row g-3 overflow-auto" style="max-height: 55vh; overflow-x: hidden;">
                <div class="col-12 col-md-6 col-lg-4" *ngFor="let widget of widgetsFiltrados">
                    <!-- TARJETA WIDGET -->
                    <div class="widget-catalog-card" [class.card-active]="widget.activo">
                        <div class="widget-card-header">
                            <div class="icon-wrapper">
                                <i class="feather icon-pie-chart"></i>
                            </div>
                            <span class="header-title text-truncate">{{ widget.nombreWidget }}</span>
                        </div>

                        <div class="card-bg-image"
                            [ngStyle]="{'background-image': 'url(' + (widget.imagenWidget || 'assets/images/widget-default.png') + ')'}">
                        </div>

                        <div class="widget-card-overlay">
                            <div class="widget-footer-content d-flex justify-content-between align-items-center w-100">
                                <div class="widget-info-text text-truncate pe-2">
                                    <h6 class="text-white mb-1 text-truncate fw-bold" [title]="widget.nombreWidget">
                                        {{ widget.nombreWidget }}
                                    </h6>
                                    <span class="widget-code-badge">{{ widget.codigoWidget }}</span>
                                </div>

                                <div class="checkbox-minimalista-wrapper m-0 flex-shrink-0">
                                    <input class="minimal-checkbox" type="checkbox"
                                        [id]="'check-' + widget.codigoWidget" [checked]="widget.activo"
                                        (click)="$event.stopPropagation()"
                                        (change)="onCheckboxChange(widget.codigoWidget, $event)">
                                </div>
                            </div>

                            <div class="widget-descripcion-expandible">
                                <p class="desc-texto mt-2 mb-0">
                                    {{ widget.descripcionWidget || 'Habilita este widget para visualizar sus métricas en
                                    tu tablero principal.' }}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>
