<div class="catalogo-container p-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h4 class="text-white fw-bold mb-1">Catálogo de Widgets</h4>
            <p class="text-muted small mb-0">Personaliza tu tablero seleccionando las métricas que deseas mostrar en
                esta sección.</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-icon rounded-circle"><i
                    class="feather icon-check-square"></i></button>
            <button class="btn btn-outline-secondary btn-icon rounded-circle"><i class="feather icon-x"></i></button>
        </div>
    </div>

    <!-- TABS DE CATEGORÍAS (Reemplaza el agrupador vertical) -->
    <div class="tabs-scroll-container d-flex gap-2 mb-4 pb-2 border-bottom border-secondary border-opacity-25">
        <button *ngFor="let cat of categorias" class="btn-categoria" [class.active]="tabActiva === cat"
            (click)="cambiarTab(cat)">
            <i class="feather icon-layers me-2"></i> {{ cat }}
        </button>
    </div>

    <!-- CUADRÍCULA DE WIDGETS (Solo muestra los de la tab activa) -->
    <div class="row g-3 overflow-auto" style="max-height: 55vh; overflow-x: hidden;">

        <div class="col-12 col-md-6 col-lg-4" *ngFor="let widget of widgetsFiltrados">
            <!-- TARJETA WIDGET -->
            <div class="widget-card p-3 d-flex flex-column justify-content-between h-100"
                [class.active]="widget.seleccionado" (click)="toggleWidgetCard(widget)">

                <!-- Parte superior: Icono y Subtítulo -->
                <div class="d-flex align-items-center gap-2 text-muted mb-4">
                    <div class="icon-sm-box">
                        <i [class]="widget.icono || 'feather icon-pie-chart'"></i>
                    </div>
                    <span style="font-size: 0.75rem; font-weight: 500;">{{ widget.nombreCorto || widget.nombre }}</span>
                </div>

                <!-- Parte inferior: Título principal, Código y Checkbox -->
                <div class="d-flex justify-content-between align-items-end">
                    <div class="d-flex flex-column overflow-hidden pe-2">
                        <h6 class="text-white fw-bold mb-2 text-truncate" [title]="widget.nombre">{{ widget.nombre }}
                        </h6>
                        <!-- Badge del código (Ej: WDG_PORT_GATE_ALERT) -->
                        <span class="badge-code text-truncate">{{ widget.codigo }}</span>
                    </div>

                    <!-- Checkbox personalizado -->
                    <div class="custom-checkbox" [class.checked]="widget.seleccionado">
                        <i class="feather icon-check" *ngIf="widget.seleccionado"></i>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
