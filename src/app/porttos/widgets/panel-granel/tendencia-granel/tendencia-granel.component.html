<app-widget-shell [titulo]="titulo" [origen]="origenTablero" [subtitulo]="subtitulo" [icono]="iconoDefecto" [isEnfoque]="isEnfoque"
    (clickEnfoque)="maximizarDesdeShell()">
    <div acciones-extra class="d-flex align-items-center gap-2"><span class="insignia" *ngIf="pico">Pico {{ pico.tmh |
            number: '1.0-0' }} t/h · {{ pico.hora }}</span></div>
    <div class="cuerpo">
        <app-estado-widget-tcl [cargando]="cargando" [error]="error" [vacio]="!total" [mensajeVacio]="mensajeVacio"
            [icono]="iconoDefecto"></app-estado-widget-tcl>
        <div class="contenido" *ngIf="!cargando && !error && !(!total)">
            <app-grafica-tcl tipo="linea" [labels]="labels" [series]="series" unidad="t"
                [isEnfoque]="isEnfoque"></app-grafica-tcl>
        </div>
    </div>
    <!-- Vista ampliada: toneladas por tipo de granel en 24 h, 72 h o 7 días (reemplaza la línea del tablero) -->
    <div detalle-enfoque *ngIf="isEnfoque" class="detalle h-100">
        <div class="detalle-cabecera">
            <h6 class="detalle-titulo">Toneladas por tipo de granel ({{ porTipo?.unidad || 't/h' }})</h6>
            <app-rango-tcl [valor]="horas" (cambio)="cambiarHoras($event)"></app-rango-tcl>
        </div>
        <p *ngIf="errorTipo" class="detalle-ayuda text-warning">{{ errorTipo }}</p>
        <div class="detalle-grafica flex-grow-1" style="min-height: 320px;">
            <app-grafica-tcl tipo="barras" [apilado]="true" [labels]="porTipo?.labels || []" [series]="seriesTipo" unidad="t" [isEnfoque]="true"></app-grafica-tcl>
        </div>
    </div>
</app-widget-shell>
