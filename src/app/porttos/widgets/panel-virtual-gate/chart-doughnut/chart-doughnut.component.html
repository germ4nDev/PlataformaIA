<app-widget-shell [titulo]="data?.titulo || '📍 Distribución 10 km'"
    [subtitulo]="data?.subtitulo || 'Camiones en radio de influencia'" [icono]="data?.icono || 'feather icon-pie-chart'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-primary text-uppercase">
            Tráfico Terrestre
        </span>
    </div>

    <!-- CUERPO ÚNICO DEL WIDGET (Contenedor flex para la gráfica) -->
    <div class="chart-wrapper w-100 h-100 position-relative pb-2 animate__animated animate__fadeIn flex-grow-1 min-h-0">

        <!-- Loader centralizado -->
        <div *ngIf="cargando" class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute"
            style="top:0; left:0; z-index: 10;">
            <div class="spinner-border text-secondary spinner-border-sm me-2" role="status"></div>
            <span class="text-muted" style="font-size: 0.8rem;">Calculando radios...</span>
        </div>

        <!-- Gráfica (Se renderiza solo cuando cargando es false y doughnutChartData existe) -->
        <canvas *ngIf="!cargando && doughnutChartData" baseChart [data]="doughnutChartData"
            [options]="doughnutChartOptions" [type]="'doughnut'">
        </canvas>

    </div>

</app-widget-shell>
