<app-widget-shell [titulo]="data?.titulo || '🕒 Citas Próximas 12 Horas'"
    [subtitulo]="data?.subtitulo || 'Por terminal y franja horaria'" [icono]="data?.icono || 'feather icon-bar-chart-2'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-info text-uppercase">
            Proyecciones
        </span>
    </div>

    <!-- CUERPO ÚNICO DEL WIDGET (Contenedor flex para la gráfica apilada) -->
    <div
        class="chart-wrapper w-100 h-100 position-relative pb-2 pe-2 animate__animated animate__fadeIn flex-grow-1 min-h-0">

        <!-- Loader centralizado superpuesto -->
        <div *ngIf="cargando" class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute"
            style="top:0; left:0; z-index: 10;">
            <div class="spinner-border text-secondary spinner-border-sm me-2" role="status"></div>
            <span class="text-muted" style="font-size: 0.8rem;">Cargando proyecciones...</span>
        </div>

        <!-- Gráfica (Se renderiza solo cuando cargando es false y barChartData existe) -->
        <canvas *ngIf="!cargando && barChartData" baseChart [data]="barChartData" [options]="barChartOptions"
            [type]="'bar'">
        </canvas>

    </div>

</app-widget-shell>
