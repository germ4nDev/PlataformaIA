<app-widget-shell [titulo]="data?.titulo || widgetConfig?.titulo || '🕒 Citas Próximas 12 Horas'"
    [subtitulo]="data?.subtitulo || widgetConfig?.subtitulo || 'Por terminal y franja horaria'"
    [icono]="data?.icono || 'feather icon-bar-chart-2'" [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()" [origen]="data?.origen">

    <div acciones-extra class="d-flex align-items-center">
        <!-- 🟢 CORREGIDO: Usamos data.datasets en lugar de datasets privado -->
        <span class="tc-badge badge-info text-uppercase">
            {{ tieneDatos ? (data.datasets.length + ' Terminales') : 'PROYECCIONES' }}
        </span>
    </div>

    <div class="chart-wrapper w-100 h-100 position-relative d-flex flex-column p-2 animate__animated animate__fadeIn">
        <!-- Loader -->
        <div *ngIf="cargando" class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute"
            style="top: 0; left: 0; z-index: 10;">
            <div class="spinner-border text-info spinner-border-sm me-2" role="status"></div>
            <span class="text-muted" style="font-size: 0.8rem;">Consultando programación de citas...</span>
        </div>

        <!-- Canvas Chart.js unificado con PorttosChartHelper -->
        <div class="flex-grow-1 position-relative" style="min-height: 0;"
            [ngClass]="{'d-none': cargando || !tieneDatos}">
            <canvas #stackedBarCanvas></canvas>
        </div>

        <!-- Estado vacío -->
        <div *ngIf="!cargando && !tieneDatos"
            class="d-flex flex-column justify-content-center align-items-center w-100 h-100 text-muted">
            <i class="feather icon-calendar fs-2 mb-2 opacity-50"></i>
            <span style="font-size: 0.8rem;">Sin citas programadas para las próximas 12 horas en este puerto.</span>
        </div>
    </div>

</app-widget-shell>
