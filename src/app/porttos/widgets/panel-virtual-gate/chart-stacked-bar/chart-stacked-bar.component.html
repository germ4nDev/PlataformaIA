<div class="porttos-widget widget-stackedbar">
    <div class="panel-header">

        <div class="header-titles">
            <h3 class="porttos-widget-title" style="color: #f8fafc;">
                <i class="feather icon-pie-chart mr-1" *ngIf="!data?.icono"></i>
                <i [class]="data?.icono" *ngIf="data?.icono" class="mr-1"></i>
                {{ data?.titulo || '🕒 Citas Próximas 12 Horas' }}
            </h3>
            <p class="subtitle">{{ data?.subtitulo || 'Por terminal y franja horaria' }}</p>
        </div>
        <div class="header-actions-container">
            <button class="btn-maximizar" (click)="maximizar()" title="Ver en pantalla completa">
                <i class="feather icon-maximize" data-feather="maximize"></i>
            </button>
        </div>
    </div>

    <div class="panel-body flex-grow-1" style="min-height: 250px; position: relative;">
        <div *ngIf="cargando" class="d-flex justify-content-center align-items-center w-100 h-100"
            style="position: absolute; top:0; left:0; z-index: 10;">
            <span style="color: #64748b; font-size: 0.8rem;">Cargando proyecciones...</span>
        </div>

        <canvas *ngIf="!cargando" baseChart [data]="barChartData" [options]="barChartOptions" [type]="'bar'"></canvas>
    </div>
</div>
