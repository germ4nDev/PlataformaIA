<app-widget-shell [titulo]="data?.titulo || '🛡 Pre-Gate · Validación'"
    [subtitulo]="data?.subtitulo || 'Estado actual de camiones'" [icono]="data?.icono || 'feather icon-check-square'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- PROYECCIÓN AL HEADER: Badge indicador -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-success text-uppercase">
            Flujo
        </span>
    </div>

    <!-- CUERPO ÚNICO DEL WIDGET -->
    <div
        class="gv-container w-100 h-100 d-flex flex-column align-items-center justify-content-center p-3 animate__animated animate__fadeIn">

        <!-- Valor Principal -->
        <div class="gv-main-value text-info mb-1">
            {{ resumen.validados || 0 }}
        </div>

        <div class="gv-subtitle text-muted text-uppercase mb-4 fw-bold">
            Camiones en flujo
        </div>

        <!-- Píldoras / Badges de Estados Inferiores -->
        <div class="gv-badges-container d-flex gap-2 flex-wrap justify-content-center">

            <span class="gv-badge badge-success">
                <i class="feather icon-check me-1"></i> {{ resumen.validados || 0 }} validados
            </span>

            <span class="gv-badge badge-warning">
                <i class="feather icon-clock me-1"></i> {{ resumen.enCola || 0 }} en cola
            </span>

            <span class="gv-badge badge-danger">
                <i class="feather icon-alert-triangle me-1"></i> {{ resumen.retenidos || 0 }} retenidos
            </span>

        </div>

    </div>

</app-widget-shell>
