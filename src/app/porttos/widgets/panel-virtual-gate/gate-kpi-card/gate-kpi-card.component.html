<app-kpi-shell [titulo]="data.titulo || 'Métrica Clave'" [subtitulo]="data.subtitulo || ''"
    [icono]="data.icono || 'feather icon-activity'" [colorBorde]="data.colorBorde || data.color || 'info'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- 🟢 ESTADO DE CARGA -->
    <div *ngIf="data.cargandoIA || isLoading"
        class="w-100 h-100 d-flex flex-column justify-content-center align-items-center gap-2">
        <div class="skeleton-box rounded-pill w-25" style="height: 0.5rem; opacity: 0.4;"></div>
        <div class="skeleton-box rounded w-50" style="height: 3rem; opacity: 0.7;"></div>
    </div>

    <!-- 🟢 CUERPO CENTRAL (Limpio, sin recuadros ni ngClass de bordes) -->
    <div *ngIf="!data.cargandoIA && !isLoading"
        class="w-100 h-100 d-flex justify-content-center align-items-center animate__animated animate__fadeIn">

        <div class="d-flex align-items-baseline gap-1">
            <h1 class="text-white fw-bold mb-0 lh-1"
                style="font-size: 3.5rem; color: #ffffff !important; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                {{ data.valor || '0' }}
            </h1>
            <span class="text-muted fw-bold" style="font-size: 0.85rem;" *ngIf="data.unidad">
                {{ data.unidad }}
            </span>
        </div>

    </div>

    <!-- 🟢 FOOTER -->
    <div kpi-footer *ngIf="!data.cargandoIA && !isLoading && data.tendencia"
        class="w-100 d-flex justify-content-center mt-2">

        <span class="badge rounded-pill bg-dark border border-secondary text-light px-2 py-1 fw-medium"
            style="font-size: 0.6rem; letter-spacing: 0.3px;">
            <i class="feather icon-trending-up me-1 text-success"></i> {{ data.tendencia }}
        </span>

    </div>

</app-kpi-shell>
