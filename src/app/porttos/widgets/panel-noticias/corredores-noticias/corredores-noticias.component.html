<app-widget-shell [titulo]="titulo" [origen]="origenTablero" [lienzo]="true" [subtitulo]="subtitulo" [icono]="iconoDefecto" [isEnfoque]="isEnfoque"
    (clickEnfoque)="maximizarDesdeShell()">
    <div acciones-extra class="d-flex align-items-center gap-2"></div>
    <div class="cuerpo">
        <app-estado-widget-tcl [cargando]="cargando" [error]="error" [vacio]="!items.length"
            [mensajeVacio]="mensajeVacio" [icono]="iconoDefecto"></app-estado-widget-tcl>
        <div class="contenido" *ngIf="!cargando && !error && !(!items.length)">
            <app-barras-saturacion-tcl [items]="items"></app-barras-saturacion-tcl>
        </div>
    </div>
    <!-- Vista ampliada: eventos del día de cada corredor -->
    <div detalle-enfoque *ngIf="isEnfoque" style="height: 340px;" class="pt-2">
        <app-tabla-tcl [columnas]="columnasEventos" [filas]="eventos" campoId="id" [ampliada]="true" nombreArchivo="eventos-viales-hoy"></app-tabla-tcl>
    </div>
</app-widget-shell>
