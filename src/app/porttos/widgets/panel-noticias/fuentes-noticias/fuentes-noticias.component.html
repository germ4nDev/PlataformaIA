<app-widget-shell [titulo]="titulo" [origen]="origenTablero" [subtitulo]="subtitulo" [icono]="iconoDefecto" [isEnfoque]="isEnfoque"
    (clickEnfoque)="maximizarDesdeShell()">
    <div acciones-extra class="d-flex align-items-center gap-2"></div>
    <div class="cuerpo">
        <app-estado-widget-tcl [cargando]="cargando" [error]="error" [vacio]="!fuentes.length"
            [mensajeVacio]="mensajeVacio" [icono]="iconoDefecto"></app-estado-widget-tcl>
        <div class="contenido" *ngIf="!cargando && !error && !(!fuentes.length)">
            <div class="grupos">
                <div class="grupo" *ngFor="let g of fuentes">
                    <h6>{{ g.nombre }}</h6>
                    <a *ngFor="let e of g.enlaces" [href]="e.url" target="_blank" rel="noopener noreferrer"
                        [title]="e.descripcion || e.nombre">{{ e.nombre }}</a>
                </div>
            </div>
        </div>
    </div>
</app-widget-shell>
