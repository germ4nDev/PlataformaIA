<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>{{ 'PLATAFORMA.MENU' | translate }}</button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky">
                <div class="dt-toolbar d-flex justify-content-between align-items-center mb-2">
                    <div class="d-flex align-items-center">
                        <h4 class="datatable-title" *ngIf="!modoEdicion">{{ 'TERMINALES.NEW' | translate }}</h4>
                        <h4 class="datatable-title" *ngIf="modoEdicion">{{ 'TERMINALES.UPDATE' | translate }}</h4>
                    </div>
                    <div class="d-flex">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro" (click)="btnRegresarClick()">
                            {{ 'PLATAFORMA.REGRESAR' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'TERMINALES.CREATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'TERMINALES.UPDATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'TERMINALES.CODE' | translate }}</label>
                                <input type="text" class="form-control form-input" name="id_terminal"
                                    placeholder="{{ 'TERMINALES.CODEPLACEHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !id_terminal.valid && (id_terminal.dirty || id_terminal.touched || isSubmit) }"
                                    #id_terminal="ngModel" required [(ngModel)]="FormRegistro.id_terminal" />
                                <label
                                    *ngIf="!id_terminal.valid && (id_terminal.dirty || id_terminal.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'TERMINALES.CODEHOLDERERROR' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="id_puerto"> {{ 'TERMINALES.id_puerto'
                                    | translate }}</label>
                                <select class="form-control form-input" style="cursor: pointer" name="id_puerto"
                                    id="id_puerto"
                                    [ngClass]="{ 'is-invalid': !id_puerto.valid && (id_puerto.dirty || id_puerto.touched || isSubmit) }"
                                    #id_puerto="ngModel" required [(ngModel)]="FormRegistro.id_puerto">
                                    <option value="">{{ 'TERMINALES.GESTION.PLACEHOLDERAPLICACION' | translate }}
                                    </option>
                                    <option [value]="prto.id_puerto" *ngFor="let prto of puertos"> {{
                                        prto.nombre }}</option>
                                </select>
                                <label *ngIf="!id_puerto.valid && (id_puerto.dirty || id_puerto.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'TERMINALES.GESTION.REQUERIDOAPLICACION' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombre">{{ 'TERMINALES.NAME' |
                                    translate }}</label>
                                <input class="form-control form-input" id="nombre" name="nombre" type="text"
                                    placeholder="{{ 'TERMINALES.NAME' | translate }}"
                                    [ngClass]="{ 'is-invalid': !nombre.valid && (nombre.dirty || nombre.touched || isSubmit) }"
                                    #nombre="ngModel" required [(ngModel)]="FormRegistro.nombre" />
                                <label *ngIf="!nombre.valid && (nombre.dirty || nombre.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'TERMINALES.NAMEHOLDERERROR' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="subtitulo">{{ 'TERMINALES.subtitulo' |
                                    translate }}</label>
                                <input class="form-control form-input" id="subtitulo" name="subtitulo" type="text"
                                    placeholder="{{ 'TERMINALES.SUBTITULOHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !subtitulo.valid && (subtitulo.dirty || subtitulo.touched || isSubmit) }"
                                    #subtitulo="ngModel" required [(ngModel)]="FormRegistro.subtitulo" />
                                <label *ngIf="!subtitulo.valid && (subtitulo.dirty || subtitulo.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'TERMINALES.SUBTITULOHOLDERORR' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="unidad_medida">{{ 'TERMINALES.unidad_medida' |
                                    translate }}</label>
                                <input class="form-control form-input" id="unidad_medida" name="unidad_medida"
                                    type="text" placeholder="{{ 'TERMINALES.unidad_medidaHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !unidad_medida.valid && (unidad_medida.dirty || unidad_medida.touched || isSubmit) }"
                                    #unidad_medida="ngModel" required [(ngModel)]="FormRegistro.unidad_medida" />
                                <label
                                    *ngIf="!unidad_medida.valid && (unidad_medida.dirty || unidad_medida.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'TERMINALES.SUBTITULOHOLDERORR' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="capacidad_reefer">{{
                                    'TERMINALES.capacidad_reefer'
                                    |
                                    translate }}</label>
                                <input class="form-control form-input" id="capacidad_reefer" name="capacidad_reefer"
                                    type="number" placeholder="{{ 'TERMINALES.capacidad_reeferHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !capacidad_reefer.valid && (capacidad_reefer.dirty || capacidad_reefer.touched || isSubmit) }"
                                    #capacidad_reefer="ngModel" required [(ngModel)]="FormRegistro.capacidad_reefer" />
                                <label
                                    *ngIf="!capacidad_reefer.valid && (capacidad_reefer.dirty || capacidad_reefer.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'TERMINALES.SUBTITULOHOLDERORR' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="geocerca_geo">
                                    {{ 'TERMINALES.GEOCERCA' | translate }}
                                </label>
                                <app-mapa-selector id="geocerca_geo" name="geocerca_geo" modo="poligono"
                                    [ngClass]="{ 'is-invalid': !geocerca_geo.valid && (geocerca_geo.dirty || geocerca_geo.touched || isSubmit) }"
                                    #geocerca_geo="ngModel" required [(ngModel)]="FormRegistro.geocerca_geo"
                                    [savedFeatures]="FormRegistro.geocerca_geo" (onConfirm)="actualizarGeocerca($event)"
                                    [ngClass]="{ 'is-invalid': !FormRegistro.geocerca_geo && isSubmit }">
                                </app-mapa-selector>

                                <label *ngIf="!FormRegistro.geocerca_geo && isSubmit"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'TERMINALES.GEOCERCA_REQUERIDA' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label">{{ 'PLATAFORMA.COLORS.COLORTEXT' | translate
                                    }}</label>
                                <app-color-selector [initialColor]="FormRegistro.color_ui" [id]="textoColor"
                                    (colorSelected)="OnColorSelectedClick($event)"></app-color-selector>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'TERMINALES.DESCRIPTION' | translate }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcion ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionVersion($event)" name="descripcion"
                                    [(ngModel)]="FormRegistro.descripcion" [ngClass]="{
                                        'is-invalid': !descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)
                                    }" #descripcion="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'TERMINALES.DESCRIPCIONHOLDER' | translate }}
                                </label>
                            </div>
                        </div>
                        <!-- <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'TERMINALES.UBICACION' | translate }}</label>

                                <div class="btn-group mb-3" role="group">
                                    <button type="button" class="btn" [class.btn-primary]="modoMapa === 'punto'"
                                        (click)="modoMapa = 'punto'">Punto Ubicación</button>
                                    <button type="button" class="btn" [class.btn-primary]="modoMapa === 'bbox'"
                                        (click)="modoMapa = 'bbox'">Definir BBox</button>
                                </div>

                                <div class="map-container-wrapper">
                                    <app-mapa-selector [(ngModel)]="FormRegistro.ubicacion" name="ubicacion"
                                        #ubicacion="ngModel" [readonly]="false">
                                    </app-mapa-selector>
                                </div>

                                <label *ngIf="!ubicacion.valid && (ubicacion.dirty || ubicacion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'TERMINALES.UBICACION_ERROR' | translate }}
                                </label>
                            </div>
                        </div> -->
                        <!-- <div class="col-md-12">
                            <div class="form-group">
                                <label>Ubicación Geográfica del Puerto</label>
                                <app-mapa-selector [(ngModel)]="FormRegistro.ubicacion" name="ubicacion">
                                </app-mapa-selector>
                            </div>
                        </div> -->
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'TERMINALES.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estado" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estado" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.ACTIVE' | translate }}</label>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estado" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estado" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.INACTIVE' | translate }}</label>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
