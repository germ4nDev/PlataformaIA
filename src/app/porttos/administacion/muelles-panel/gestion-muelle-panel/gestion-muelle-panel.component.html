<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>{{ 'COMMON.MENU' | translate }}</button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky">
                <div class="dt-toolbar d-flex justify-content-between align-items-center mb-2">
                    <div class="d-flex align-items-center">
                        <h4 class="datatable-title" *ngIf="!modoEdicion">{{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.NEW_BERTH' | translate }}</h4>
                        <h4 class="datatable-title" *ngIf="modoEdicion">{{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.EDIT_BERTH' | translate }}</h4>
                    </div>
                    <div class="d-flex">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro" (click)="btnRegresarClick()">
                            {{ 'COMMON.BACK' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.CREATE_BERTH' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.EDIT_BERTH' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!--

            public id_interno?: string,
        public id_terminal?: string,
        public codigo_muelle?: string,
        public db_id_origen?: string,
        public especialidad?: string,
        public calado_metros?: number,
        public capacidad_reefer?: string,
        public estado_mantenimiento?: boolean,
        public geocerca_geo?: any,
        public descripcion?: string,
        public activo?: boolean,
        public puerto?: string,
        public terminal?: string,
        public nomEstado?: string,
        public nomMantenimiento?: string,
        public usuario_cargue?: string,
        public fecha_cargue?: string,

        -->

            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="puerto"> {{ 'COMMON.PORT'
                                    | translate }}</label>
                                <select (change)="onPuertoChange($event)" class="form-control form-select">
                                    <option value="">{{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.SELECT_PORT' | translate }}</option>
                                    <option [value]="app.id_puerto" *ngFor="let app of puertos">
                                        {{ app.nombre }}
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="id_terminal"> {{ 'PORTTOS.TERMINAL'
                                    | translate }}</label>
                                <select class="form-control form-select" style="cursor: pointer" name="id_terminal"
                                    id="id_terminal"
                                    [ngClass]="{ 'is-invalid': !id_terminal.valid && (id_terminal.dirty || id_terminal.touched || isSubmit) }"
                                    #id_terminal="ngModel" required [(ngModel)]="FormRegistro.id_terminal">
                                    <option value="">{{ 'COMMON.SELECT_APPLICATION' | translate }}
                                    </option>
                                    <option [value]="trml.id_terminal" *ngFor="let trml of terminalesPuerto"> {{
                                        trml.nombre }}</option>
                                </select>
                                <label
                                    *ngIf="!id_terminal.valid && (id_terminal.dirty || id_terminal.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.SELECT_APPLICATION_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigo_muelle">{{ 'COMMON.NAME' | translate
                                    }}</label>

                                <input class="form-control form-input" id="codigo_muelle" name="codigo_muelle"
                                    type="text" placeholder="{{ 'COMMON.NAME' | translate }}"
                                    (input)="onVerificarNombre($event)"
                                    [ngClass]="{ 'is-invalid': (!codigo_muelle.valid && (codigo_muelle.dirty || codigo_muelle.touched || isSubmit)) || nombreDuplicado }"
                                    #codigo_muelle="ngModel" required [(ngModel)]="FormRegistro.codigo_muelle" />

                                <label
                                    *ngIf="!codigo_muelle.valid && (codigo_muelle.dirty || codigo_muelle.touched || isSubmit) && !nombreDuplicado"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.FIELD_REQUIRED_MUST_BE_UNIQUE' | translate }}
                                </label>

                                <label *ngIf="nombreDuplicado"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.FIELD_REQUIRED_MUST_BE_UNIQUE' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="db_id_origen">{{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.SOURCE_ID' |
                                    translate }}</label>
                                <input class="form-control form-input" id="db_id_origen" name="db_id_origen" type="text"
                                    placeholder="{{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.BERTH_ID_IN_DATA_SOURCE' | translate }}"
                                    [ngClass]="{ 'is-invalid': !db_id_origen.valid && (db_id_origen.dirty || db_id_origen.touched || isSubmit) }"
                                    #db_id_origen="ngModel" required [(ngModel)]="FormRegistro.db_id_origen" />
                                <label
                                    *ngIf="!db_id_origen.valid && (db_id_origen.dirty || db_id_origen.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.ENTER_SOURCE_ID_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="calado_metros">{{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.DRAFT_M' |
                                    translate }}</label>
                                <input class="form-control form-input" id="calado_metros" name="calado_metros"
                                    type="number" placeholder="{{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.DRAFT_IN_METERS' | translate }}"
                                    [ngClass]="{ 'is-invalid': !calado_metros.valid && (calado_metros.dirty || calado_metros.touched || isSubmit) }"
                                    #calado_metros="ngModel" required [(ngModel)]="FormRegistro.calado_metros" />
                                <label
                                    *ngIf="!calado_metros.valid && (calado_metros.dirty || calado_metros.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.ENTER_VALID_VALUE_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="especialidad">{{'PORTTOS.SPECIALTY' |
                                    translate }}</label>
                                <input class="form-control form-input" id="especialidad" name="especialidad" type="text"
                                    placeholder="{{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.CARGO_TYPE_HANDLED_BY_BERTH' | translate }}"
                                    [ngClass]="{ 'is-invalid': !especialidad.valid && (especialidad.dirty || especialidad.touched || isSubmit) }"
                                    #especialidad="ngModel" required [(ngModel)]="FormRegistro.especialidad" />
                                <label
                                    *ngIf="!especialidad.valid && (especialidad.dirty || especialidad.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.ENTER_SPECIALTY_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="geocerca_geo">
                                    {{ 'PORTTOS.GEOFENCE' | translate }}
                                </label>
                                <app-mapa-selector id="geocerca_geo" name="geocerca_geo" modo="poligono"
                                    [ngClass]="{ 'is-invalid': !geocerca_geo.valid && (geocerca_geo.dirty || geocerca_geo.touched || isSubmit) }"
                                    #geocerca_geo="ngModel" required [(ngModel)]="FormRegistro.geocerca_geo"
                                    [savedFeatures]="FormRegistro.geocerca_geo" (onConfirm)="actualizarGeocerca($event)"
                                    [ngClass]="{ 'is-invalid': !FormRegistro.geocerca_geo && isSubmit }">
                                </app-mapa-selector>

                                <label *ngIf="!FormRegistro.geocerca_geo && isSubmit"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.DRAW_BERTH_GEOFENCE_ON_MAP_FIELD' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label">{{ 'COMMON.TEXT_COLOR' | translate
                                    }}</label>
                                <app-color-selector [initialColor]="FormRegistro.color_ui" [id]="textoColor"
                                    (colorSelected)="OnColorSelectedClick($event)"></app-color-selector>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.DESCRIPTION' | translate }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcion ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionVersion($event)" name="descripcion"
                                    [(ngModel)]="FormRegistro.descripcion" [ngClass]="{
                                        'is-invalid': !descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)
                                    }" #descripcion="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.BERTH_DESCRIPTION' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estado_mantenimiento" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estado_mantenimiento" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'PORTTOS.ADMINISTACION.MUELLES_PANEL.GESTION.OPERATIONAL' | translate }}</span>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estado_mantenimiento" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estado_mantenimiento" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'PORTTOS.UNDER_MAINTENANCE' | translate }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
