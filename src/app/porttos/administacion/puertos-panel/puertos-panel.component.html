    <div class="content-area">
        <div class="card card-table content-scroll-wrapper">
            <div class="card-body">
                <ng-container *ngIf="puertosFiltradas$ | async as dataFiltrada; else loading">
                    <app-data-table [data]="dataFiltrada" [idField]="'id_puerto'"
                        [tableTitle]="'PUERTOS.TITLE' | translate" [metadataColumns]="columnasAplicaciopnes"
                        [metadataDetailColumns]="columnasDetailRegistros" [showDetail]="true" [showActions]="true"
                        [showNewButton]="true" [showViewButton]="false" [showEditButton]="true"
                        [showDeleteButton]="true" [showSearchBox]="false" [newButtonLabel]="'PUERTOS.NEW' | translate"
                        [exportLabel]="'PLATAFORMA.EXCEL' | translate" (newRecord)="OnNuevaRegistroClick()"
                        (editRecord)="OnEditarRegistroClick($event)" (deleteRecord)="OnEliminarRegistroClick($event)">
                    </app-data-table>
                </ng-container>
                <ng-template #loading>
                    <app-data-loader [isLoading]="true" message="Cargando puertos ..."> </app-data-loader>
                </ng-template>
            </div>
        </div>
    </div>
