<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>{{ 'COMMON.MENU' | translate }}</button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky pb-0 border-bottom-0">
                <div class="d-flex justify-content-between align-items-center mb-3 mt-2">

                    <!-- Bloque Izquierdo: Título Integrado y Subtítulo -->
                    <div class="d-flex flex-column pe-3">
                        <h4 class="titulo-formulario">
                            <span *ngIf="!modoEdicion">{{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.NEW_PORT' | translate }}
                            </span>
                            <span *ngIf="modoEdicion">{{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.EDIT_PORT'
                                | translate }}</span>
                            <span class="titulo-container"> -
                                {{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.PORT_MANAGEMENT' | translate
                                }}</span>
                        </h4>
                        <h6 class="subtitulo-formulario mb-0">
                            {{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.PORT_DETAILS' | translate
                            }}
                        </h6>
                    </div>

                    <!-- Bloque Derecho: Botones con Spinners -->
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro" (click)="btnRegresarClick()">
                            {{ 'COMMON.BACK' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.CREATE_PORT' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.EDIT_PORT' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
                <hr class="mb-0"><br>
            </div>

            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.CODE' | translate }}</label>
                                <input type="text" class="form-control form-input" name="id_puerto"
                                    placeholder="{{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.PORT_CODE' | translate }}"
                                    [ngClass]="{ 'is-invalid': !id_puerto.valid && (id_puerto.dirty || id_puerto.touched || isSubmit) }"
                                    #id_puerto="ngModel" required [(ngModel)]="FormRegistro.id_puerto" />
                                <label *ngIf="!id_puerto.valid && (id_puerto.dirty || id_puerto.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.ENTER_CODE_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombre">{{ 'COMMON.NAME' |
                                    translate }}</label>
                                <input class="form-control form-input" id="nombre" name="nombre" type="text"
                                    placeholder="{{ 'COMMON.NAME' | translate }}"
                                    [ngClass]="{ 'is-invalid': !nombre.valid && (nombre.dirty || nombre.touched || isSubmit) }"
                                    #nombre="ngModel" required [(ngModel)]="FormRegistro.nombre" />
                                <label *ngIf="!nombre.valid && (nombre.dirty || nombre.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.ENTER_NAME_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="region">{{
                                    'PORTTOS.ADMINISTACION.PUERTOS_PANEL.REGION' |
                                    translate }}</label>
                                <input class="form-control form-input" id="region" name="region" type="text"
                                    placeholder="{{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.PORT_REGION' | translate }}"
                                    [ngClass]="{ 'is-invalid': !region.valid && (region.dirty || region.touched || isSubmit) }"
                                    #region="ngModel" required [(ngModel)]="FormRegistro.region" />
                                <label *ngIf="!region.valid && (region.dirty || region.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.ENTER_REGION_FIELD_REQUIRED' |
                                    translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="url_fuente_scraping">{{
                                    'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.DATA_SOURCE_URL' |
                                    translate }}</label>
                                <input class="form-control form-input" id="url_fuente_scraping"
                                    name="url_fuente_scraping" type="text"
                                    placeholder="{{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.HTTPS' | translate }}"
                                    [ngClass]="{ 'is-invalid': !url_fuente_scraping.valid && (url_fuente_scraping.dirty || url_fuente_scraping.touched || isSubmit) }"
                                    #url_fuente_scraping="ngModel" required
                                    [(ngModel)]="FormRegistro.url_fuente_scraping" />
                                <label
                                    *ngIf="!url_fuente_scraping.valid && (url_fuente_scraping.dirty || url_fuente_scraping.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.ENTER_VALID_URL' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="ubicacion_geo">
                                    {{ 'PORTTOS.LOCATION' | translate }}
                                </label>

                                <!-- Aquí usamos nuestro componente interactivo -->
                                <app-mapa-selector id="ubicacion_geo" name="ubicacion_geo" modo="punto"
                                    [ngClass]="{ 'is-invalid': !ubicacion_geo.valid && (ubicacion_geo.dirty || ubicacion_geo.touched || isSubmit) }"
                                    #ubicacion_geo="ngModel" required [(ngModel)]="FormRegistro.ubicacion_geo"
                                    [savedFeatures]="FormRegistro.ubicacion_geo"
                                    (onConfirm)="actualizarUbicacion($event)"
                                    [ngClass]="{ 'is-invalid': !FormRegistro.ubicacion_geo && isSubmit }">
                                </app-mapa-selector>

                                <label *ngIf="!FormRegistro.ubicacion_geo && isSubmit"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.MARK_LOCATION_ON_MAP_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="geocerca_geo">
                                    {{ 'PORTTOS.GEOFENCE' | translate }}
                                </label>

                                <!-- Aquí usamos nuestro componente interactivo -->
                                <app-mapa-selector id="geocerca_geo" name="geocerca_geo" modo="poligono"
                                    [ngClass]="{ 'is-invalid': !geocerca_geo.valid && (geocerca_geo.dirty || geocerca_geo.touched || isSubmit) }"
                                    #geocerca_geo="ngModel" required [(ngModel)]="FormRegistro.geocerca_geo"
                                    [savedFeatures]="FormRegistro.geocerca_geo" (onConfirm)="actualizarGeocerca($event)"
                                    [ngClass]="{ 'is-invalid': !FormRegistro.geocerca_geo && isSubmit }">
                                </app-mapa-selector>

                                <label *ngIf="!FormRegistro.geocerca_geo && isSubmit"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.DRAW_PORT_GEOFENCE_ON_MAP_FIELD' |
                                    translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label">{{ 'COMMON.GEOFENCE_COLOR' | translate
                                    }}</label>
                                <app-color-selector [initialColor]="FormRegistro.color_ui" [id]="textoColor"
                                    (colorSelected)="OnColorSelectedClick($event)"></app-color-selector>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.DESCRIPTION' | translate }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcion ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionVersion($event)" name="descripcion"
                                    [(ngModel)]="FormRegistro.descripcion" [ngClass]="{
                                        'is-invalid': !descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)
                                    }" #descripcion="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PORTTOS.ADMINISTACION.PUERTOS_PANEL.GESTION.PORT_DESCRIPTION' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.IMAGE' | translate }}</label>
                                <br>
                                <img *ngIf="selectedFileUrl" [src]="selectedFileUrl" class="image-preview" />

                                <input type="file" #fileInput id="logoSuscriptor" style="display: none;"
                                    accept="image/*" (change)="onFileSelectedClick($event)">
                                <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                                    (click)="fileInput.click()">
                                    <i class="feather icon-upload me-2"></i> <!-- Opcional: un icono -->
                                    {{ 'COMMON.SELECT_IMAGE_2' | translate }}
                                </button>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estado" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estado" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.ACTIVE' | translate }}</span>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estado" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estado" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.INACTIVE' | translate }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
