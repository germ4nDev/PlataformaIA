<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>{{ 'PLATAFORMA.MENU' | translate }}</button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky">
                <div class="dt-toolbar d-flex justify-content-between align-items-center mb-2">
                    <div class="d-flex align-items-center">
                        <h4 class="datatable-title" *ngIf="!modoEdicion">{{ 'INFRAESTRUCTURA.NEW' | translate }}
                        </h4>
                        <h4 class="datatable-title" *ngIf="modoEdicion">{{ 'INFRAESTRUCTURA.UPDATE' | translate }}
                        </h4>
                    </div>
                    <div class="d-flex">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro" (click)="btnRegresarClick()">
                            {{ 'PLATAFORMA.REGRESAR' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'INFRAESTRUCTURA.CREATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'INFRAESTRUCTURA.UPDATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="id_terminal">{{ 'INFRAESTRUCTURA.TERMINAL' |
                                    translate
                                    }}</label>
                                <input class="form-control form-input" id="id_terminal" name="id_terminal" type="text"
                                    placeholder="{{ 'INFRAESTRUCTURA.TERMINAL' | translate }}"
                                    (input)="onVerificarTerminal($event)"
                                    [ngClass]="{ 'is-invalid': (!id_terminal.valid && (id_terminal.dirty || id_terminal.touched || isSubmit)) || terminalDuplicado }"
                                    #id_terminal="ngModel" required [(ngModel)]="FormRegistro.id_terminal" />
                                <label
                                    *ngIf="!id_terminal.valid && (id_terminal.dirty || id_terminal.touched || isSubmit) && !terminalDuplicado"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'INFRAESTRUCTURA.EXISTETERMINALHOLDERERROR' | translate }}
                                </label>
                                <label *ngIf="nombreDuplicado"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'INFRAESTRUCTURA.EXISTETERMINALHOLDERERROR' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="id_tipo"> {{ 'INFRAESTRUCTURA.TIPOINFRA'
                                    | translate }}</label>
                                <select class="form-control form-input" style="cursor: pointer" name="id_tipo"
                                    id="id_tipo"
                                    [ngClass]="{ 'is-invalid': !id_tipo.valid && (id_tipo.dirty || id_tipo.touched || isSubmit) }"
                                    #id_tipo="ngModel" required [(ngModel)]="FormRegistro.id_tipo">
                                    <option value="">{{ 'INFRAESTRUCTURA.GESTION.PLACEHOLDERTIPOINFRA' | translate }}
                                    </option>
                                    <option [value]="tipo.id_tipo" *ngFor="let tipo of tiposInfra"> {{
                                        tipo.nombre }}</option>
                                </select>
                                <label *ngIf="!id_tipo.valid && (id_tipo.dirty || id_tipo.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'INFRAESTRUCTURA.GESTION.REQUERIDOTIPOINFRA' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombre">{{ 'INFRAESTRUCTURA.NAME' |
                                    translate
                                    }}</label>
                                <input class="form-control form-input" id="nombre" name="nombre" type="text"
                                    placeholder="{{ 'INFRAESTRUCTURA.NAME' | translate }}"
                                    (input)="onVerificarNombre($event)"
                                    [ngClass]="{ 'is-invalid': (!nombre.valid && (nombre.dirty || nombre.touched || isSubmit)) || nombreDuplicado }"
                                    #nombre="ngModel" required [(ngModel)]="FormRegistro.nombre" />
                                <label
                                    *ngIf="!nombre.valid && (nombre.dirty || nombre.touched || isSubmit) && !nombreDuplicado"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'INFRAESTRUCTURA.EXISTENAMEHOLDERERROR' | translate }}
                                </label>
                                <label *ngIf="nombreDuplicado"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'INFRAESTRUCTURA.EXISTENAMEHOLDERERROR' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label">{{ 'PLATAFORMA.COLORS.COLORTEXT' | translate
                                    }}</label>
                                <app-color-selector [initialColor]="FormRegistro.color_ui" [id]="textoColor"
                                    (colorSelected)="OnColorSelectedClick($event)"></app-color-selector>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="ubicacion_geo">
                                    {{ 'INFRAESTRUCTURA.UBICACION' | translate }}
                                </label>

                                <!-- Aquí usamos nuestro componente interactivo -->
                                <app-mapa-selector id="ubicacion_geo" name="ubicacion_geo" modo="punto"
                                    [ngClass]="{ 'is-invalid': !ubicacion_geo.valid && (ubicacion_geo.dirty || ubicacion_geo.touched || isSubmit) }"
                                    #ubicacion_geo="ngModel" required [(ngModel)]="FormRegistro.ubicacion_geo"
                                    [savedFeatures]="FormRegistro.ubicacion_geo"
                                    (onConfirm)="actualizarUbicacion($event)"
                                    [ngClass]="{ 'is-invalid': !FormRegistro.ubicacion_geo && isSubmit }">
                                </app-mapa-selector>

                                <label *ngIf="!FormRegistro.ubicacion_geo && isSubmit"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'INFRAESTRUCTURA.UBICACION_REQUERIDA' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="geocerca_geo">
                                    {{ 'INFRAESTRUCTURA.GEOCERCA' | translate }}
                                </label>

                                <!-- Aquí usamos nuestro componente interactivo -->
                                <app-mapa-selector id="geocerca_geo" name="geocerca_geo" modo="poligono"
                                    [ngClass]="{ 'is-invalid': !geocerca_geo.valid && (geocerca_geo.dirty || geocerca_geo.touched || isSubmit) }"
                                    #geocerca_geo="ngModel" required [(ngModel)]="FormRegistro.geocerca_geo"
                                    [savedFeatures]="FormRegistro.geocerca_geo" (onConfirm)="actualizarGeocerca($event)"
                                    [ngClass]="{ 'is-invalid': !FormRegistro.geocerca_geo && isSubmit }">
                                </app-mapa-selector>

                                <label *ngIf="!FormRegistro.geocerca_geo && isSubmit"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'INFRAESTRUCTURA.GEOCERCA_REQUERIDA' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'INFRAESTRUCTURA.DESCRIPTION' | translate }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcion ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionVersion($event)" name="descripcion"
                                    [(ngModel)]="FormRegistro.descripcion" [ngClass]="{
                                        'is-invalid': !descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)
                                    }" #descripcion="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'INFRAESTRUCTURA.DESCRIPCIONHOLDER' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'INFRAESTRUCTURA.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estado" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estado" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.ACTIVO' | translate }}</label>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estado" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estado" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.INACTIVO' | translate }}</label>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
