    <div class="content-area">
        <div class="card card-table content-scroll-wrapper">
            <div class="card-body">
                <ng-container *ngIf="tiposInfraestructuraFiltradas$ | async as dataFiltrada; else loading">
                    <app-data-table [data]="dataFiltrada" [idField]="'id_tipo'"
                        [tableTitle]="'PORTTOS.ADMINISTACION.TIPOS_INFRAESTRUCTURA_PANEL.INFRASTRUCTURE_TYPE_MANAGEMENT' | translate"
                        [metadataColumns]="columnasAplicaciopnes" [metadataDetailColumns]="columnasDetailRegistros"
                        [showDetail]="true" [showActions]="true" [showNewButton]="true" [showViewButton]="false"
                        [showEditButton]="true" [showDeleteButton]="true" [showSearchBox]="false"
                        [newButtonLabel]="'PORTTOS.ADMINISTACION.TIPOS_INFRAESTRUCTURA_PANEL.NEW_INFRASTRUCTURE_TYPE' | translate"
                        [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate" (newRecord)="OnNuevaAplicaicionClick()"
                        (editRecord)="OnEditarAplicaicionClick($event)"
                        (deleteRecord)="OnEliminarAplicaicionClick($event)" permisoNew="ACT_TIPOSINFRA_CREAR" permisoEdit="ACT_TIPOSINFRA_MODIFICAR" permisoDelete="ACT_TIPOSINFRA_ELIMINAR">
                    </app-data-table>
                </ng-container>
                <ng-template #loading>
                    <app-data-loader [isLoading]="true" message="Cargando aplicaciones ..."> </app-data-loader>
                </ng-template>

                <!-- <h3>Importar Usuarios Masivos</h3>
