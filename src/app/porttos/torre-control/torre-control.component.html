<app-tc-header [titulo]="'Porttos 1.0'" [subtitulo]="'Plataforma de Logística y Gestión Portuaria'"
    [tableroBloqueado]="tableroBloqueado" (toggleBloqueo)="toggleBloqueoTablero()" (abrirCatalogo)="abrirLobbyModal()">
</app-tc-header>

<div class="tc-dashboard-container" style="position: relative;">

    <!-- 🚨 CONTENEDOR DEL HEADER INTERNO RESTAURADO -->
    <div class="d-flex justify-content-between align-items-center mb-3 w-100 gap-3">

        <!-- LADO IZQUIERDO/CENTRO: Las Pestañas (Intactas) -->
        <div class="main-tabs-wrapper d-flex align-items-center flex-grow-1 overflow-auto m-0 p-0"
            style="scrollbar-width: none;">

            <button *ngFor="let pestana of pestanasVisibles" type="button" class="btn-main-tab m-0"
                [class.active]="pestanaActiva === pestana.codigoPestana"
                (click)="cambiarPestana(pestana.codigoPestana)">
                <span class="d-flex align-items-center gap-2">
                    <i [class]="obtenerIconoPestana(pestana.codigoPestana)"></i>
                    {{ pestana.nombrePestana }}
                </span>
            </button>
        </div>

        <!-- LADO DERECHO: El Menú Flotante (Reemplazando los 3 botones antiguos) -->
        <div class="d-flex align-items-center gap-2 flex-shrink-0">
            <div class="porttos-config-menu position-relative">

                <!-- Botón Gatillo (Diseñado igual a tus botones anteriores) -->
                <button type="button" class="border-0 shadow-none btn-icon-accion"
                    style="width: 38px; height: 38px; border-radius: 8px; transition: all 0.2s;"
                    (click)="toggleMenuConfig()" [class.bg-primary]="menuConfigAbierto"
                    [class.text-white]="menuConfigAbierto" title="Configuración del Tablero">
                    <i class="feather fs-5" [ngClass]="menuConfigAbierto ? 'icon-x' : 'icon-settings'"></i>
                </button>

                <!-- El Panel Flotante Oculto -->
                <div class="config-popover shadow-lg rounded-3 p-3 bg-dark border border-secondary border-opacity-25 animate__animated animate__fadeIn"
                    *ngIf="menuConfigAbierto">

                    <div
                        class="d-flex justify-content-between align-items-center mb-3 border-bottom border-secondary border-opacity-25 pb-2">
                        <h6 class="mb-0 titulo text-center" style="font-size: 0.9rem;">Personalizar Tablero</h6>
                    </div>

                    <!-- Grid 2x2 para las opciones -->
                    <div class="config-grid">

                        <!-- Botón 1: Organizar (Candado) -->
                        <button class="tc-action-btn" (click)="toggleBloqueoTablero(); menuConfigAbierto = false"
                            title="Personalizar Tablero">
                            <i class="feather" [ngClass]="tableroBloqueado ? 'icon-unlock' : 'icon-lock'"></i>
                            <span>{{ tableroBloqueado ? 'Desbloquear' : 'Bloquear' }}</span>
                        </button>

                        <!-- Botón 2: Añadir Widgets (+) -->
                        <button class="tc-action-btn" (click)="abrirLobbyModal(); menuConfigAbierto = false"
                            title="Personalizar Tablero">
                            <i class="feather icon-plus"></i>
                            <span>Widgets</span>
                        </button>

                        <!-- Botón 3: Pestañas (Capas) -->
                        <button class="tc-action-btn" (click)="abrirLobbyPestanas(); menuConfigAbierto = false"
                            title="Personalizar Pestañas">
                            <i class="feather icon-layers"></i>
                            <span>Pestañas</span>
                        </button>

                        <!-- Botón 4: Restaurar Default -->
                        <button class="tc-action-btn" (click)="restaurarTableroDefault(); menuConfigAbierto = false"
                            title="Restaurar Tablero">
                            <i class="feather icon-refresh-cw"></i>
                            <span>Restaurar</span>
                        </button>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- FIN DEL HEADER INTERNO -->

    <!-- Cargador Flotante -->
    <div *ngIf="cargando" class="cargador-flotante">
        <div class="cargador-contenido">
            <div class="spinner-PORTTOS"></div>
            <p class="text-white mt-4">Actualizando Torre de Control...</p>
        </div>
    </div>

    <!-- Contenedor Gridster -->
    <gridster class="gridster" [options]="options">
        <gridster-item *ngFor="let widget of dashboard; trackBy: trackByWidget" [item]="widget"
            [class.PORTTOS-fantasma]="widget.type === 'WDG_FANTASMA'">

            <app-widget-selector-tcl [widgetConfig]="widget">
            </app-widget-selector-tcl>

        </gridster-item>
    </gridster>

</div>

<!-- Modales Inferiores -->
<app-widget-lobby-tcl [visible]="mostrarLobby" [widgetsMaster]="widgetsParaElLobby" [layoutActual]="lsLayout"
    [pestanaActual]="pestanaActiva" (guardar)="guardarPreferenciasWidgets($event)" (cerrar)="mostrarLobby = false"
    (toggleWidget)="actualizarWidgetDesdeLobby($event)">
</app-widget-lobby-tcl>

<app-pestana-lobby-tcl [visible]="mostrarLobbyPestanas" [catalogoPestanas]="lsPestanas"
    [pestanasActivas]="pestanasVisibles" (cerrar)="mostrarLobbyPestanas = false"
    (guardar)="guardarPreferenciasPestanas($event)">
</app-pestana-lobby-tcl>

<!-- Modal de Enfoque (Gigante) -->
<div class="PORTTOS-backdrop-blur" *ngIf="widgetEnfoque" (click)="cerrarModalEnfoque()">
    <div class="PORTTOS-modal-lg" (click)="$event.stopPropagation()">
        <app-widget-selector-tcl [widgetConfig]="widgetEnfoque" [isEnfoque]="true"></app-widget-selector-tcl>
    </div>
</div>
