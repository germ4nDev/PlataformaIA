<!--
    Author: German Valencia
    Component: Bodegas Dashboard HTML (Layout Manager Puro - Arquitectura Smart Widgets)
-->
<div class="dashboard-wrapper w-100 h-100 position-relative">

    <!-- 1. Loader mientras se construye la estructura geométrica del layout -->
    <div *ngIf="cargando" class="d-flex flex-column justify-content-center align-items-center w-100 h-100 py-5">
        <div class="spinner-border text-info mb-2" role="status"></div>
        <span class="text-muted small">Construyendo tablero de Bodegas y Silos ({{ puerto }})...</span>
    </div>

    <!-- 2. Estado vacío por si la pestaña aún no tiene widgets configurados en BD -->
    <div *ngIf="!cargando && (!dashboard || dashboard.length === 0)"
        class="d-flex flex-column justify-content-center align-items-center w-100 h-100 py-5 text-muted">
        <i class="feather icon-package fs-1 mb-2 opacity-50"></i>
        <p class="mb-0">No hay widgets configurados para la pestaña de Bodegas ({{ pestanaActiva }}).</p>
    </div>

    <!-- 3. Cuadrícula Gridster (Inmutable frente a datos: cada Smart Widget se hidrata solo) -->
    <gridster *ngIf="!cargando && options && dashboard.length > 0" [options]="options" class="bg-transparent">

        <gridster-item *ngFor="let w of dashboard; trackBy: trackByWidget" [item]="w"
            class="rounded overflow-hidden shadow-sm">

            <!-- 🟢 SOLUCIÓN: Separamos *ngIf en el padre y *ngComponentOutlet en el hijo -->
            <ng-container *ngIf="w.componenteTarget; else sinRegistrar">
                <ng-container *ngComponentOutlet="w.componenteTarget; inputs: w.componenteInputs">
                </ng-container>
            </ng-container>

            <!-- Fallback visual en caso de que el código de widget aún no esté en widget-registry.ts -->
            <ng-template #sinRegistrar>
                <div class="d-flex flex-column justify-content-center align-items-center w-100 h-100 p-3 text-muted border border-secondary border-opacity-25 rounded"
                    style="background-color: rgba(26, 28, 35, 0.6);">
                    <i class="feather icon-alert-circle text-warning fs-3 mb-2"></i>
                    <span class="fw-bold text-white small">{{ w.type }}</span>
                    <small class="text-muted text-center mt-1" style="font-size: 0.72rem;">
                        Widget pendiente de registro en <code>WIDGET_MAP</code>
                    </small>
                </div>
            </ng-template>

        </gridster-item>

    </gridster>

</div>
