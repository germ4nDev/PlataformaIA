<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>{{ 'PLATAFORMA.MENU' | translate }}</button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky">
                <div class="dt-toolbar d-flex justify-content-between align-items-center mb-2">
                    <div class="d-flex align-items-center">
                        <h4 class="datatable-title" *ngIf="!modoEdicion">{{ 'FAROS.NEW' | translate }}</h4>
                        <h4 class="datatable-title" *ngIf="modoEdicion">{{ 'FAROS.UPDATE' | translate }}</h4>
                    </div>
                    <div class="d-flex">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro" (click)="btnRegresarClick()">
                            {{ 'PLATAFORMA.REGRESAR' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'FAROS.CREATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'FAROS.UPDATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="tipo_faro"> {{ 'FAROS.tipo_faro'
                                    | translate }}</label>
                                <select class="form-control form-input" style="cursor: pointer" name="tipo_faro"
                                    id="tipo_faro"
                                    [ngClass]="{ 'is-invalid': !tipo_faro.valid && (tipo_faro.dirty || tipo_faro.touched || isSubmit) }"
                                    #tipo_faro="ngModel" required [(ngModel)]="FormRegistro.tipo_faro">
                                    <option value="">{{ 'FAROS.GESTION.PLACEHOLDERAPLICACION' | translate }}
                                    </option>
                                    <option [value]="trml.id" *ngFor="let trml of ETIPOS_FARO"> {{
                                        trml.label }}</option>
                                </select>
                                <label *ngIf="!tipo_faro.valid && (tipo_faro.dirty || tipo_faro.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'FAROS.GESTION.REQUERIDOAPLICACION' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombre_faro">{{ 'FAROS.NAME' | translate
                                    }}</label>

                                <input class="form-control form-input" id="nombre_faro" name="nombre_faro" type="text"
                                    placeholder="{{ 'FAROS.NAME' | translate }}" (input)="onVerificarNombre($event)"
                                    [ngClass]="{ 'is-invalid': (!nombre_faro.valid && (nombre_faro.dirty || nombre_faro.touched || isSubmit)) || nombreDuplicado }"
                                    #nombre_faro="ngModel" required [(ngModel)]="FormRegistro.nombre_faro" />

                                <label
                                    *ngIf="!nombre_faro.valid && (nombre_faro.dirty || nombre_faro.touched || isSubmit) && !nombreDuplicado"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'FAROS.EXISTENAMEHOLDERERROR' | translate }}
                                </label>

                                <label *ngIf="nombreDuplicado"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'FAROS.EXISTENAMEHOLDERERROR' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="radio_metros">{{ 'FAROS.radio_metros' |
                                    translate }}</label>
                                <input class="form-control form-input" id="radio_metros" name="radio_metros"
                                    type="number" placeholder="{{ 'FAROS.radio_metrosHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !radio_metros.valid && (radio_metros.dirty || radio_metros.touched || isSubmit) }"
                                    #radio_metros="ngModel" required [(ngModel)]="FormRegistro.radio_metros" />
                                <label
                                    *ngIf="!radio_metros.valid && (radio_metros.dirty || radio_metros.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'FAROS.SUBTITULOHOLDERORR' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="geocerca_geo">
                                    {{ 'FAROS.GEOCERCA' | translate }}
                                </label>
                                <app-mapa-selector id="geocerca_geo" name="geocerca_geo" modo="poligono"
                                    [ngClass]="{ 'is-invalid': !geocerca_geo.valid && (geocerca_geo.dirty || geocerca_geo.touched || isSubmit) }"
                                    #geocerca_geo="ngModel" required [(ngModel)]="FormRegistro.geocerca_geo"
                                    [savedFeatures]="FormRegistro.geocerca_geo" (onConfirm)="actualizarGeocerca($event)"
                                    [ngClass]="{ 'is-invalid': !FormRegistro.geocerca_geo && isSubmit }">
                                </app-mapa-selector>

                                <label *ngIf="!FormRegistro.geocerca_geo && isSubmit"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'FAROS.GEOCERCA_REQUERIDA' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label">{{ 'PLATAFORMA.COLORS.COLORTEXT' | translate
                                    }}</label>
                                <app-color-selector [initialColor]="FormRegistro.color_ui" [id]="textoColor"
                                    (colorSelected)="OnColorSelectedClick($event)"></app-color-selector>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'FAROS.DESCRIPTION' | translate }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcion ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionVersion($event)" name="descripcion"
                                    [(ngModel)]="FormRegistro.descripcion" [ngClass]="{
                                        'is-invalid': !descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)
                                    }" #descripcion="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'FAROS.DESCRIPCIONHOLDER' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'FAROS.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="genera_alerta_toast" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.genera_alerta_toast" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.SI' | translate }}</label>
                                    </label>
                                    <label class="radio-button">
                                        <input name="genera_alerta_toast" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.genera_alerta_toast" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.NO' | translate }}</label>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'FAROS.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estado" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estado" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.ACTIVO' | translate }}</label>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estado" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estado" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.INACTIVO' | translate }}</label>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
