<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
                    {{ 'COMMON.MENU' | translate }}
                </button>
                <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'" *ngIf="hasFiltersSlot">
                    {{ 'COMMON.FILTERS' | translate }}
                </button>
            </div>
            <ng-container *ngIf="activeTab === 'menu'">
                <app-nav-content *ngIf="menuItems$ | async as menuItems"
                    [navigationItems]="menuItems"></app-nav-content>
            </ng-container>
            <ng-container *ngIf="activeTab === 'filters'">
                <div class="p-3 filtros-scroll-wrapper">
                    <h6 class="filtros-title">{{ 'COMMON.MODULE_FILTERS' | translate }}</h6>
                    <div class="filtro">
                        <small>{{ 'COMMON.MODULE_CODE' | translate }}</small>
                        <select (change)="onFiltroCodigoAplicacionChangeClick($event)" class="form-control form-select">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option [value]="reg.codigoAplicacion" *ngFor="let reg of aplicaciones">
                                {{ reg.nombreAplicacion }}
                            </option>
                        </select>
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.SUITE_CODE' | translate }}</small>
                        <select (change)="onFiltroCodigoSuiteChangeClick($event)" class="form-control form-select">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option [value]="reg.codigoSuite" *ngFor="let reg of suites">
                                {{ reg.nombreSuite }}
                            </option>
                        </select>
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.CODE' | translate }}</small>
                        <select (change)="onFiltroCodigoModuloChangeClick($event)" class="form-control form-select">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option [value]="reg.nombreModulo" *ngFor="let reg of modulos">
                                {{ reg.nombreModulo }}
                            </option>
                        </select>
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.DESCRIPTION' | translate }}</small>
                        <input type="text" (keyup)="onFiltroDescripcionChangeClick($event)"
                            class="form-control form-input"
                            placeholder="{{ 'COMMON.MODULE_DESCRIPTION' | translate }}" />
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.STATUS' | translate }}</small>
                        <select (change)="onFiltroEstadoChangeClick($event)" class="form-control form-select">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option value="true">{{ 'COMMON.ACTIVE' | translate }}</option>
                            <option value="false">{{ 'COMMON.INACTIVE' | translate }}</option>
                        </select>
                    </div>
                </div>
            </ng-container>
        </div>
    </aside>

    <div class="content-area">
        <div class="card card-table content-scroll-wrapper">
            <div class="card-body">
                <ng-container *ngIf="modulosFiltrados$ | async as dataFiltrada; else loading">
                    <app-data-table [data]="dataFiltrada" [idField]="'codigoModulo'"
                        [tableTitle]="'COMMON.MODULE_MANAGEMENT' | translate" [metadataColumns]="columnasRegistros"
                        [metadataDetailColumns]="columnasDetailRegistros" [showDetail]="true" [showActions]="true"
                        [showNewButton]="true" [showViewButton]="false" [showEditButton]="true"
                        [showDeleteButton]="true" [showSearchBox]="false" [newButtonLabel]="'COMMON.NEW_MODULE_2' | translate"
                        [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate" (newRecord)="OnNuevoRegistroClick()"
                        (editRecord)="OnEditarRegistroClick($event)" (deleteRecord)="OnEliminarRegistroClick($event)">
                    </app-data-table>
                </ng-container>
                <ng-template #loading>
                    <app-data-loader [isLoading]="true" message="Cargando modulos ..."> </app-data-loader>
                </ng-template>
            </div>
        </div>
    </div>
</div>
