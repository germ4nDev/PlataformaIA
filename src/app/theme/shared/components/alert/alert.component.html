<div #alert class="alert alert-{{ type }}" role="alert" [ngClass]="{ 'alert-dismissible': dismiss }">
  <ng-content></ng-content>
  @if (dismiss) {
    <button (click)="dismissAlert(alert)" type="button" class="btn-close" data-dismiss="alert" [attr.aria-label]="'WEB.COMUN.CLOSE' | translate"></button>
  }
</div>
