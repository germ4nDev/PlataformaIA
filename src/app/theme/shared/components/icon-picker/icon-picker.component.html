<div class="input-group icon-picker-input">
  <!-- 🟢 Input principal con el componente universal -->
  <span class="input-group-text form-input d-flex align-items-center justify-content-center" style="width: 46px">
    <app-icon
      [name]="valorSeleccionado || 'more-horizontal'"
      [customClass]="valorSeleccionado ? 'icon-picker-title text-primary' : 'text-muted feather'"
    >
    </app-icon>
  </span>

  <input
    type="text"
    class="form-control form-input"
    [value]="valorSeleccionado || ('SHARED.ICON_PICKER.NO_ICON_SELECTED' | translate)"
    readonly
    [disabled]="isDisabled"
    (click)="abrirModal()"
    style="cursor: pointer"
    [placeholder]="'SHARED.ICON_PICKER.SELECT_ICON' | translate"
  />

  <!-- Botón de explorar estático en Feather -->
  <button
    class="btn btn-primary btn-NuevoRegistro btn-animacion form-input d-flex align-items-center"
    type="button"
    [disabled]="isDisabled"
    (click)="abrirModal()"
  >
    <i class="feather icon-search me-1"></i> {{ 'SHARED.ICON_PICKER.EXPLORE' | translate }}
  </button>
</div>

<div class="modal fade" [class.show]="mostrarModal" [style.display]="mostrarModal ? 'block' : 'none'" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content">
      <div class="modal-header pb-2 border-bottom-0 align-items-start">
        <div class="d-flex flex-column">
          <h5 class="icon-picker-title m-0 mb-1">
            <i class="feather icon-image me-2"></i>{{ 'SHARED.ICON_PICKER.ICON_CATALOG' | translate }}
          </h5>
          <small class="text-muted" style="font-size: 0.8rem">
            <i class="feather icon-info me-1"></i> {{ catalogoIconos.length }} {{ 'SHARED.ICON_PICKER.AVAILABLE_ICONS' | translate }}
          </small>
        </div>
        <button type="button" class="custom-close-btn" [attr.aria-label]="'COMMON.CLOSE' | translate" (click)="cerrarModal()">
          <i class="feather icon-x"></i>
        </button>
      </div>

      <div class="modal-body pt-1">
        <div class="icon-picker-grid p-3">
          <div class="d-flex flex-wrap gap-2 justify-content-center">
            <!-- 🟢 Renderizado del Grid Universal (Material + Tabler + Feather) -->
            @for (icono of catalogoIconos; track icono) {
              <div class="icon-choice-box" [class.selected]="valorSeleccionado === icono" (click)="seleccionarIcono(icono)">
                <!-- Nuestro componente inteligente hace el trabajo sucio -->
                <app-icon [name]="icono" customClass="icon-element"></app-icon>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

@if (mostrarModal) {
  <div class="modal-backdrop fade show"></div>
}
