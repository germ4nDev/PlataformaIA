<div class="widget-header d-flex justify-content-between align-items-center p-3 border-bottom border-secondary border-opacity-25">
  <div class="d-flex align-items-center gap-3">
    @if (icono) {
      <i [class]="icono + ' text-muted fs-5'"></i>
    }
    <div class="d-flex flex-column justify-content-center">
      <h6 class="kpi-shell-title">
        {{ titulo }}
      </h6>
      @if (subtitulo) {
        <small class="kpi-shell-subtitle">
          {{ subtitulo }}
        </small>
      }
    </div>
  </div>

  <div class="d-flex align-items-center gap-2">
    @if (variante === 'normal') {
      <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25" style="font-size: 0.65rem">
        {{ 'COMMON.LIVE' | translate }}
      </span>
    }
  </div>
</div>
