<div class="slider-container" [class.slider-container--contenido]="contenido">
  <div class="image-wrapper">
    @for (imageUrl of images; track imageUrl; let i = $index) {
      <img
        [ngSrc]="imageUrl.imageSlider ?? ''"
        [fill]="true"
        [priority]="i === 0"
        [attr.alt]="imageUrl.nombreSlider + ' ' + (i + 1)"
        [ngClass]="{ active: i === currentIndex }"
        class="slider-image"
        (error)="onImageError($event, i)"
      />
    }
  </div>

  <!-- CC-104: leyenda del slide (texto plano de la gestión; nunca HTML) -->
  @if (leyendas && images.length) {
    <div class="slider-leyenda" aria-live="polite">
      @if (leyenda.titulo) {
        <h2 class="slider-leyenda__titulo">{{ leyenda.titulo }}</h2>
      }
      @if (leyenda.texto) {
        <p class="slider-leyenda__texto">{{ leyenda.texto }}</p>
      }
    </div>
  }

  @if (images.length > 1) {
    <div class="indicators" [class.indicators--leyenda]="leyendas">
      @for (image of images; track image; let i = $index) {
        <button
          [ngClass]="{ active: i === currentIndex }"
          (click)="goToImage(i)"
          class="indicator-dot"
          [attr.aria-label]="('SHARED.GO_IMAGE' | translate) + (i + 1)"
        >
        </button>
      }
      @if (leyendas) {
        <button
          type="button"
          class="slider-pausa"
          (click)="alternarPausa()"
          [attr.aria-label]="pausado ? ('SHARED.FULLSCREEN_SLIDER.RESUME' | translate) : ('COMMON.PAUSE' | translate)"
          [attr.aria-pressed]="pausado"
        >
          @if (!pausado) {
            <span class="slider-pausa__barras" aria-hidden="true"></span>
          }
          @if (pausado) {
            <span class="slider-pausa__play" aria-hidden="true"></span>
          }
        </button>
      }
    </div>
  }
</div>
