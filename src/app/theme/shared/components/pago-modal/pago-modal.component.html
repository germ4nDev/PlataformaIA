<div class="modal-overlay" *ngIf="mostrarModal">

    <div class="modal-content">

        <div class="modal-header">
            <h3>{{ 'WEB.PAGO_MODAL.COMPLETAR_TRANSACCION' | translate }}</h3>
            <button class="close-btn" (click)="cerrar()">&times;</button>
        </div>

        <div class="modal-body">

            <div *ngIf="cargandoBrick" class="loader-container">
                <div class="spinner"></div>
                <p>{{ 'WEB.PAGO_MODAL.CARGANDO_PASARELA_SEGURA' | translate }}</p>
            </div>

            <div id="paymentBrick_container" [class.oculto]="cargandoBrick"></div>

        </div>
    </div>

</div>
