<div class="terminal-panel">
    <div class="terminal-header">
        <h3 class="terminal-name">{{ nombreTerminal }}</h3>

        <span class="status-badge" [ngClass]="estado">
            <i class="fas fa-circle status-dot"></i>
            {{ estado === 'operando' ? ('WEB.TERMINAL_PANEL.OPERACION_NORMAL' | translate) : (estado === 'congestion' ? ('WEB.TERMINAL_PANEL.ALTA_CONGESTION' | translate) :
          ('WEB.TERMINAL_PANEL.MANTENIMIENTO' | translate)o') }}
        </span>
    </div>

    <div class="terminal-body">
        <ng-content></ng-content>
    </div>
</div>
