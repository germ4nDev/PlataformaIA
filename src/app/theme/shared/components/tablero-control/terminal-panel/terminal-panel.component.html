<div class="terminal-panel">
    <div class="terminal-header">
        <h3 class="terminal-name">{{ nombreTerminal }}</h3>

        <span class="status-badge" [ngClass]="estado">
            <i class="fas fa-circle status-dot"></i>
            {{ estado === 'operando' ? ('SHARED.TABLERO_CONTROL.TERMINAL_PANEL.NORMAL_OPERATION' | translate) : (estado === 'congestion' ? ('SHARED.TABLERO_CONTROL.TERMINAL_PANEL.HIGH_CONGESTION' | translate) :
          ('SHARED.TABLERO_CONTROL.TERMINAL_PANEL.MAINTENANCE' | translate)o') }}
        </span>
    </div>

    <div class="terminal-body">
        <ng-content></ng-content>
    </div>
</div>
