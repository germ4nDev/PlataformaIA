<!-- Input visible en el formulario -->
<div class="input-group mb-4" [class.is-invalid]="invalid">
    <input type="text" class="form-control form-input" [value]="getDisplayText()" readonly
        [placeholder]="'WEB.MAPA_SELECTOR.SELECCIONAR_UBICACION_EN_EL_MAPA' | translate" (click)="openModal()" />
    <div class="input-group-append form-input">
        <button class="btn btn-primary btn-NuevoRegistro" type="button" (click)="openModal()">
            <i class="fa fa-map"></i>
        </button>
    </div>
</div>

<!-- Modal Overlay (Solo se renderiza si isModalOpen es true) -->
<div class="custom-map-modal" *ngIf="isModalOpen">
    <div class="map-modal-dialog">
        <div class="map-modal-content">
            <div class="map-wrapper" style="position: relative; width: 100%; height: 100%;">
                <div class="map-modal-body p-0">
                    <!-- Contenedor del mapa -->
                    <div #mapContainer class="map-container"></div>

                    <!-- Contenedor flotante POSICIONADO SOBRE EL MAPA -->
                    <div id="map" style="width: 100%; height: 100%;">
                        <div class="map-controls">
                            <button class="btn btn-primary btn-map-option btn-animacion-map" type="button"
                                (click)="draw.changeMode('draw_polygon')" [title]="'WEB.MAPA_SELECTOR.DIBUJAR_POLIGONO' | translate"
                                *ngIf="modo === 'poligono'">
                                <i class="icon feather icon-square"></i>
                            </button>

                            <button class="btn btn-primary btn-map-option btn-animacion-map" type="button"
                                (click)="draw.trash()" [title]="'WEB.MAPA_SELECTOR.ELIMINAR' | translate">
                                <i class="icon feather icon-trash-2"></i>
                            </button>

                            <button class="btn btn-primary btn-map-option btn-animacion-map" type="button"
                                [class.ref-apagada]="!referenciaVisible"
                                (click)="alternarReferencia()"
                                [title]="referenciaVisible ? ('WEB.MAPA_SELECTOR.OCULTAR_REFERENCIA_OPENSTREETMAP' | translate) : ('WEB.MAPA_SELECTOR.MOSTRAR_REFERENCIA_OPENSTREETMAP' | translate)">
                                <i class="icon feather icon-layers"></i>
                            </button>
                        </div>
                        <div class="ref-atribucion" *ngIf="referenciaVisible">
                            {{ 'WEB.MAPA_SELECTOR.REFERENCIA_CLIC_EN_UN_ELEMENTO' | translate: { p0: atribucionReferencia } }}
                        </div>
                    </div>
                </div>

                <div class="floating-controls">
                    <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                        (click)="closeModal()">{{ 'WEB.MAPA_SELECTOR.CANCELAR' | translate }}</button>
                    <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                        (click)="confirmSelection()">{{ 'WEB.MAPA_SELECTOR.CONFIRMAR_SELECCION' | translate }}</button>
                </div>
            </div>
        </div>
    </div>
</div>
