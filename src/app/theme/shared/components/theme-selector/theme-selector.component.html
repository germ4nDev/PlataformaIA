<div class="theme-selector-container">
  <h5>{{ 'WEB.THEME_SELECTOR.SELECTOR_DE_TEMA' | translate }}</h5>
  <div class="form-check form-switch mb-3">
    <input class="form-check-input" type="checkbox" role="switch" id="darkThemeSwitch" [(ngModel)]="isDarkTheme" (change)="toggleTheme()">
    <label class="form-check-label" for="darkThemeSwitch">{{ 'WEB.THEME_SELECTOR.MODO_OSCURO' | translate }}</label>
  </div>

  <h6>{{ 'WEB.THEME_SELECTOR.COLOR_DEL_NAVBAR' | translate }}</h6>
  <div class="color-palette">
    <div
      *ngFor="let color of colorPalette"
      class="color-box"
      [style.background-color]="color"
      [class.selected]="color === navbarColor"
      (click)="navbarColor = color; onNavbarColorChange()"
      [title]="color">
    </div>
  </div>
</div>
