<div class="col-12 col-md-10">
  <div class="shadow-sm rounded overflow-hidden">
    @if (src && src !== 'undefined') {
      <div class="video-container" style="width: 100%">
        <video #target class="video-js vjs-fluid vjs-big-play-centered"></video>
      </div>
    }

    @if (!src || src === 'undefined') {
      <div>
        <p style="color: white; padding: 20px">{{ 'SHARED.VIDEO_PLAYER.WAITING_VIDEO_URL' | translate }}</p>
      </div>
    }
  </div>
</div>
