<div class="porttos-widget-shell d-flex flex-column w-100 h-100 position-relative" [class.modo-enfoque]="isEnfoque">

    <div class="d-flex justify-content-between w-100"
        [ngClass]="isEnfoque ? 'align-items-center border-bottom border-secondary border-opacity-25 pb-3 mb-1' : 'shell-header align-items-start mb-2'">

        <div class="d-flex align-items-center gap-3 overflow-hidden pe-2">

            <div *ngIf="icono" class="d-flex justify-content-center align-items-center rounded-3 flex-shrink-0"
                [ngClass]="isEnfoque ? 'border border-secondary border-opacity-25' : 'shell-icon-box'"
                [style.width]="isEnfoque ? '48px' : 'auto'" [style.height]="isEnfoque ? '48px' : 'auto'">
                <i [class]="icono" [ngClass]="isEnfoque ? 'fs-4 text-info' : 'fs-5 text-muted'"></i>
            </div>

            <div class="d-flex flex-column text-truncate">
                <h4 class="shell-titulo mb-0 text-truncate">{{ titulo }}</h4>
                <small *ngIf="subtitulo" class="shell-subtitulo text-muted text-uppercase text-truncate"
                    [style.letter-spacing]="isEnfoque ? '0.5px' : 'normal'"
                    [style.font-size]="isEnfoque ? '0.85rem' : 'auto'" [innerHTML]="subtitulo"></small>
            </div>
        </div>

        <div class="d-flex align-items-center flex-shrink-0" [ngClass]="isEnfoque ? 'gap-3' : 'shell-actions gap-2'">

            <div class="d-flex align-items-center gap-2">

                <ng-content select="[acciones-extra]"></ng-content>

                <div [class.d-none]="!isEnfoque">
                    <ng-content select="[badges-enfoque]"></ng-content>
                </div>
            </div>

            <button class="tc-action-btn btn-maximizar" (click)="maximizarWidget()" title="Cerrar vista">
                <i [ngClass]="isEnfoque ? 'feather icon-minimize' : 'feather icon-maximize'"></i>
            </button>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- CUERPO UNIFICADO (LA MAGIA DEL FALLBACK)   -->
    <!-- ========================================== -->
    <div class="shell-body d-flex flex-column flex-grow-1 position-relative w-100"
        [ngClass]="isEnfoque ? 'overflow-auto p-2 modo-enfoque-body' : 'overflow-hidden'" style="min-height: 0;">

        <!-- Contenido 1: El por defecto (Gráficas, etc.) -->
        <div class="default-content flex-grow-1 d-flex flex-column h-100">
            <ng-content></ng-content>
        </div>

        <!-- Contenido 2: El Detalle Especial (Tablas, etc.) -->
        <div class="detail-content" [class.d-none]="!isEnfoque">
            <ng-content select="[detalle-enfoque]"></ng-content>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- FOOTER NORMAL (Se oculta al maximizar)     -->
    <!-- ========================================== -->
    <div *ngIf="!isEnfoque" class="shell-footer w-100 mt-auto text-center">
        <ng-content select="[tc-footer]"></ng-content>
    </div>

</div>
