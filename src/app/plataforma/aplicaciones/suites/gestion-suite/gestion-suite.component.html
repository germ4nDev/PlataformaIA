<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>
                    {{ 'COMMON.MENU' | translate }}
                </button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky pb-0 border-bottom-0">
                <div class="d-flex justify-content-between align-items-center mb-3 mt-2">

                    <!-- Bloque Izquierdo: Título Integrado y Subtítulo -->
                    <div class="d-flex flex-column pe-3">
                        <h4 class="titulo-formulario">
                            <span *ngIf="!modoEdicion">{{ 'APLICACIONES.SUITES.NEW_SUITE' | translate }}</span>
                            <span *ngIf="modoEdicion">{{ 'APLICACIONES.SUITES.GESTION.EDIT_SUITE' | translate }}</span>
                            <span class="titulo-container"> - {{ 'APLICACIONES.SUITES.GESTION.CREATE_OR_UPDATE_SUITE' | translate
                                }}</span>
                        </h4>
                        <h6 class="subtitulo-formulario mb-0">
                            {{ 'APLICACIONES.SUITES.GESTION.SUITE_DETAILS' | translate }}
                        </h6>
                    </div>

                    <!-- Bloque Derecho: Botones con Spinners -->
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnRegresarClick()">
                            {{ 'COMMON.BACK' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'APLICACIONES.SUITES.GESTION.CREATE_SUITE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'APLICACIONES.SUITES.GESTION.EDIT_SUITE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
                <hr class="mb-0"><br>
            </div>

            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.CODE' | translate }}</label>
                                <input type="text" class="form-control form-input" name="codigoSuite"
                                    placeholder="{{ 'COMMON.SUITE_CODE_2' | translate }}"
                                    [ngClass]="{ 'is-invalid': !codigoSuite.valid && (codigoSuite.dirty || codigoSuite.touched || isSubmit) }"
                                    #codigoSuite="ngModel" required readonly [(ngModel)]="FormRegistro.codigoSuite" />
                                <label
                                    *ngIf="!codigoSuite.valid && (codigoSuite.dirty || codigoSuite.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.SUITE_CODE_2' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoAplicacion"> {{ 'COMMON.APPLICATION'
                                    | translate }}</label>
                                <select class="form-control form-select" style="cursor: pointer" name="codigoAplicacion"
                                    id="codigoAplicacion"
                                    [ngClass]="{ 'is-invalid': !codigoAplicacion.valid && (codigoAplicacion.dirty || codigoAplicacion.touched || isSubmit) }"
                                    #codigoAplicacion="ngModel" required [(ngModel)]="FormRegistro.codigoAplicacion"
                                    (change)="onAplicacionchangeClick($event)">
                                    <option value="" disabled>{{ 'COMMON.SELECT_APPLICATION' | translate }}
                                    </option>
                                    <option [value]="app.codigoAplicacion" *ngFor="let app of aplicaciones"> {{
                                        app.nombreAplicacion }}</option>
                                </select>
                                <label
                                    *ngIf="!codigoAplicacion.valid && (codigoAplicacion.dirty || codigoAplicacion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.SELECT_APPLICATION_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombreSuite">{{ 'COMMON.NAME' | translate
                                    }}</label>
                                <input class="form-control form-input" id="nombreSuite" name="nombreSuite" type="text"
                                    placeholder="{{ 'APLICACIONES.SUITES.GESTION.SUITE_NAME' | translate }}"
                                    [ngClass]="{ 'is-invalid': !nombreSuite.valid && (nombreSuite.dirty || nombreSuite.touched || isSubmit) }"
                                    #nombreSuite="ngModel" required [(ngModel)]="FormRegistro.nombreSuite" />
                                <label
                                    *ngIf="!nombreSuite.valid && (nombreSuite.dirty || nombreSuite.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.ENTER_NAME_FIELD_REQUIRED_2' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.PATH' | translate }}</label>
                                <input type="text" class="form-control form-input" name="rutaInicio"
                                    placeholder="{{ 'APLICACIONES.NAVIGATION_PATH' | translate }}"
                                    [ngClass]="{ 'is-invalid': !rutaInicio.valid && (rutaInicio.dirty || rutaInicio.touched || isSubmit) }"
                                    #rutaInicio="ngModel" required [(ngModel)]="FormRegistro.rutaInicio" />
                                <label *ngIf="!rutaInicio.valid && (rutaInicio.dirty || rutaInicio.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.ENTER_PATH_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.TRANSLATION_KEY' | translate }}</label>
                                <input type="text" class="form-control form-input" name="translateKey"
                                    placeholder="{{ 'APLICACIONES.NAVIGATION_PATH' | translate }}"
                                    [ngClass]="{ 'is-invalid': !translateKey.valid && (translateKey.dirty || translateKey.touched || isSubmit) }"
                                    #translateKey="ngModel" required [(ngModel)]="FormRegistro.translateKey" />
                                <label
                                    *ngIf="!translateKey.valid && (translateKey.dirty || translateKey.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'APLICACIONES.SUITES.GESTION.ENTER_TRANSLATION_KEY_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.DESCRIPTION' | translate }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcionSuite ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionVersion($event)" name="descripcionSuite"
                                    [(ngModel)]="FormRegistro.descripcionSuite"
                                    [ngClass]="{ 'is-invalid': !descripcionSuite.valid && (descripcionSuite.dirty || descripcionSuite.touched || isSubmit) }"
                                    #descripcionSuite="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcionSuite.valid && (descripcionSuite.dirty || descripcionSuite.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.ENTER_DESCRIPTION_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.IMAGE' | translate }}</label>
                                <img *ngIf="selectedFileUrl" [src]="selectedFileUrl" class="image-preview" />
                                <div class="file-input-wrapper">
                                    <label for="fileUploadInput" class="btn btn-primary btn-NuevoRegistro">
                                        {{ 'Seleccionar archivo' | translate }}
                                    </label>
                                    <input type="file" (change)="onFileSelectedClick($event)" accept="image/*"
                                        id="fileUploadInput" class="form-control form-input d-none"
                                        name="fotoUsuario" />
                                </div>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estadoSuite" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estadoSuite" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.ACTIVE' | translate }}</span>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estadoSuite" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estadoSuite" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.INACTIVE' | translate }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
