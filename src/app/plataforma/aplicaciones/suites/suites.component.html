<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
                    {{ 'COMMON.MENU' | translate }}
                </button>
                <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'" *ngIf="hasFiltersSlot">
                    {{ 'COMMON.FILTERS' | translate }}
                </button>
            </div>

            <ng-container *ngIf="activeTab === 'menu'">
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
            <ng-container *ngIf="activeTab === 'filters'">
                <div class="p-3 filtros-scroll-wrapper">
                    <h6 class="filtros-title">{{ 'COMMON.SEARCH_FILTERS' | translate }}</h6>
                    <div class="filtro">
                        <small>{{ 'COMMON.MODULE_CODE' | translate }}</small>
                        <select (change)="onFiltroCodigoAplicacionChangeClick($event)" class="form-control form-select">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option [value]="reg.codigoAplicacion" *ngFor="let reg of aplicaciones">
                                {{ reg.nombreAplicacion }}
                            </option>
                        </select>
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.FILTER_BY_SUITE' | translate }}</small>
                        <select (change)="onFiltroCodigoChangeClick($event)" class="form-control form-select">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option [value]="reg.codigoSuite" *ngFor="let reg of registros">
                                {{ reg.codigoSuite }}
                            </option>
                        </select>
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.FILTER_BY_NAME' | translate }}</small>
                        <select (change)="onFiltroNombreChangeClick($event)" class="form-control form-select">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option [value]="app.nombreSuite" *ngFor="let app of registros">
                                {{ app.nombreSuite }}
                            </option>
                        </select>
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.FILTER_BY_DESCRIPTION' | translate }}</small>
                        <input type="text" (keyup)="onFiltroDescripcionChangeClick($event)"
                            class="form-control form-input"
                            placeholder="{{ 'COMMON.SEARCH_BY_DESCRIPTION' | translate }}" />
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.STATUS' | translate }}</small>
                        <select (change)="onFiltroEstadoChangeClick($event)" class="form-control form-select">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option value="true">{{ 'COMMON.ACTIVE' | translate }}</option>
                            <option value="false">{{ 'COMMON.INACTIVE' | translate }}</option>
                        </select>
                    </div>
                </div>
            </ng-container>
        </div>
    </aside>

    <div class="content-area">
        <div class="card card-table content-scroll-wrapper">
            <div class="card-body">
                <ng-container *ngIf="suitesFiltrados$ | async as dataFiltrada">
                    <app-table-data [data]="dataFiltrada" [idField]="'codigoSuite'"
                        [tableTitle]="'APLICACIONES.SUITES.SUITE_MANAGEMENT' | translate" [metadataColumns]="columnasRegistros"
                        [metadataDetailColumns]="columnasDetailRegistros" [showDetail]="true" [showActions]="true"
                        [showNewButton]="true" [showViewButton]="false" [showEditButton]="true" [showSearchBox]="false"
                        [showDeleteButton]="true" [showSearchBox]="false" [newButtonLabel]="'APLICACIONES.SUITES.NEW_SUITE' | translate"
                        [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate" (newRecord)="OnNuevoRegistroClick()"
                        (editRecord)="OnEditarRegistroClick($event)" (deleteRecord)="OnEliminarRegistroClick($event)" permisoNew="ACT_SUITES_CREAR" permisoEdit="ACT_SUITES_MODIFICAR" permisoDelete="ACT_SUITES_ELIMINAR">
                    </app-table-data>
                </ng-container>
            </div>
        </div>
    </div>
</div>
