<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>
                    {{ 'COMMON.MENU' | translate }}
                </button>
            </div>

            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky pb-0 border-bottom-0">
                <div class="d-flex justify-content-between align-items-center mb-3 mt-2">

                    <!-- Bloque Izquierdo: Título Integrado y Subtítulo -->
                    <div class="d-flex flex-column pe-3">
                        <h4 class="titulo-formulario">
                            <span *ngIf="!modoEdicion">{{ 'COMMON.NEW_VERSION' | translate }}</span>
                            <span *ngIf="modoEdicion">{{ 'APLICACIONES.VERSIONES.GESTION.EDIT_VERSION' | translate }}</span>
                            <span class="titulo-container"> - {{ 'APLICACIONES.VERSIONES.GESTION.CREATE_OR_UPDATE_VERSION' | translate
                                }}</span>
                        </h4>
                        <h6 class="subtitulo-formulario mb-0">
                            {{ 'APLICACIONES.VERSIONES.GESTION.VERSION_DETAILS' | translate }}
                        </h6>
                    </div>

                    <!-- Bloque Derecho: Botones con Spinners -->
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnRegresarClick()">
                            {{ 'COMMON.BACK' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'APLICACIONES.VERSIONES.GESTION.CREATE_VERSION' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'APLICACIONES.VERSIONES.GESTION.EDIT_VERSION' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
                <hr class="mb-0"><br>
            </div>

            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoAplicacion"> {{
                                    'COMMON.APPLICATION' | translate }}</label>
                                <select class="form-control form-select" style="cursor: pointer" name="codigoAplicacion"
                                    id="codigoAplicacion"
                                    [ngClass]="{ 'is-invalid': !codigoAplicacion.valid && (codigoAplicacion.dirty || codigoAplicacion.touched || isSubmit) }"
                                    #codigoAplicacion="ngModel" required [(ngModel)]="FormRegistro.codigoAplicacion"
                                    (change)="onAplicacionchangeClick($event)">
                                    <option value="">{{ 'COMMON.SELECT_APPLICATION' | translate }}
                                    </option>
                                    <option [value]="app.codigoAplicacion" *ngFor="let app of aplicaciones"> {{
                                        app.nombreAplicacion }}</option>
                                </select>
                                <label
                                    *ngIf="!codigoAplicacion.valid && (codigoAplicacion.dirty || codigoAplicacion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.SELECT_APPLICATION_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="fecha">
                                    {{ 'APLICACIONES.VERSIONES.GESTION.VERSION_DATE' | translate }}
                                </label>
                                <div class="input-group">
                                    <input class="form-control form-input" [placeholder]="'COMMON.YYYY_MM_DD' | translate" name="fecha"
                                        id="fecha" [(ngModel)]="FormRegistro.fecha" ngbDatepicker #d="ngbDatepicker"
                                        (dateSelect)="onDateChange()" required />
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary calendar" (click)="d.toggle()"
                                            type="button">
                                            <i class="fas fa-calendar-alt"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.CODE' | translate }}</label>
                                <input type="text" class="form-control form-input" name="codigoVersion"
                                    placeholder="{{ 'APLICACIONES.VERSIONES.GESTION.VERSION_CODE' | translate }}"
                                    [ngClass]="{ 'is-invalid': !codigoVersion.valid && (codigoVersion.dirty || codigoVersion.touched || isSubmit) }"
                                    #codigoVersion="ngModel" required [(ngModel)]="FormRegistro.codigoVersion"
                                    readonly />
                                <label
                                    *ngIf="!codigoVersion.valid && (codigoVersion.dirty || codigoVersion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'APLICACIONES.VERSIONES.GESTION.VERSION_CODE' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.VERSION' | translate }}</label>
                                <input type="text" class="form-control form-input" name="version"
                                    placeholder="{{ 'APLICACIONES.VERSIONES.GESTION.VERSION_NUMBER_E_G_1_0' | translate }}"
                                    [ngClass]="{ 'is-invalid': !version.valid && (version.dirty || version.touched || isSubmit) }"
                                    #version="ngModel" required [(ngModel)]="FormRegistro.version" />
                                <label *ngIf="!version.valid && (version.dirty || version.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'APLICACIONES.VERSIONES.GESTION.VERSION_NUMBER' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombreVersion">{{ 'COMMON.NAME' | translate
                                    }}</label>
                                <input class="form-control form-input" id="nombreVersion" name="nombreVersion"
                                    type="text" placeholder="{{ 'APLICACIONES.VERSIONES.GESTION.VERSION_NAME' | translate }}"
                                    [ngClass]="{ 'is-invalid': !nombreVersion.valid && (nombreVersion.dirty || nombreVersion.touched || isSubmit) }"
                                    #nombreVersion="ngModel" required [(ngModel)]="FormRegistro.nombreVersion" />
                                <label
                                    *ngIf="!nombreVersion.valid && (nombreVersion.dirty || nombreVersion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.ENTER_NAME_FIELD_REQUIRED_2' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.DESCRIPTION' | translate }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcionVersion ?? ''"
                                    (contentHtmlChange)="FormRegistro.descripcionVersion = $event"
                                    (contentHtmlChange)="actualizarDescripcionVersion($event)" name="descripcionVersion"
                                    [(ngModel)]="FormRegistro.descripcionVersion"
                                    [ngClass]="{'is-invalid': !descripcionVersion.valid && (descripcionVersion.dirty || descripcionVersion.touched || isSubmit)}"
                                    #descripcionVersion="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcionVersion.valid && (descripcionVersion.dirty || descripcionVersion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.ENTER_DESCRIPTION_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estadoVersion" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estadoVersion" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.ACTIVE' | translate }}</span>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estadoVersion" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estadoVersion" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.INACTIVE' | translate }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
