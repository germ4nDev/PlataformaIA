<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
  <aside class="aside-left">
    <div class="card">
      <div class="nav-tabs-custom">
        <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
          {{ 'COMMON.MENU' | translate }}
        </button>
        <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'" *ngIf="hasFiltersSlot">
          {{ 'COMMON.FILTERS' | translate }}
        </button>
      </div>

      <ng-container *ngIf="activeTab === 'menu'">
        <app-nav-content [navigationItems]="menuItems | async"></app-nav-content>
      </ng-container>
      <ng-container *ngIf="activeTab === 'filters'">
        <div class="p-3 filtros-scroll-wrapper">
          <h6 class="filtros-title">{{ 'SITES.CONTENIDOS.CONTENT_FILTERS' | translate }}</h6>
          <div class="filtro">
            <small>{{ 'COMMON.NAME' | translate }}</small>
            <input
              type="text"
              (keyup)="onFiltroNombreChangeClick($event)"
              class="form-control form-input"
              placeholder="{{ 'SITES.CONTENIDOS.CONTENT_NAME' | translate }}"
            />
          </div>
          <div class="filtro">
            <small>{{ 'COMMON.DESCRIPTION' | translate }}</small>
            <input
              type="text"
              (keyup)="onFiltroDescripcionChangeClick($event)"
              class="form-control form-input"
              placeholder="{{ 'SITES.CONTENIDOS.CONTENT_DESCRIPTION' | translate }}"
            />
          </div>
          <div class="filtro">
            <small>{{ 'COMMON.STATUS' | translate }}</small>
            <select (change)="onFiltroEstadoChangeClick($event)" class="form-control form-select" style="cursor: pointer">
              <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
              <option value="true">{{ 'COMMON.ACTIVE' | translate }}</option>
              <option value="false">{{ 'COMMON.INACTIVE' | translate }}</option>
            </select>
          </div>
        </div>
      </ng-container>
    </div>
  </aside>

  <div class="content-area">
    <div class="card card-table content-scroll-wrapper">
      <div class="card-body">
        <app-data-table
          [data]="registrosFiltrado"
          [idField]="'contenidoId'"
          [tableTitle]="'SITES.CONTENIDOS.CONTENT_MANAGEMENT' | translate"
          [metadataColumns]="columnasRegistros"
          [metadataDetailColumns]="columnasDetailRegistros"
          [showActions]="true"
          [showNewButton]="true"
          [showViewButton]="false"
          [showEditButton]="true"
          [showDeleteButton]="true"
          [showDetail]="true"
          [newButtonLabel]="'SITES.CONTENIDOS.NEW_CONTENT' | translate"
          [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate"
          (newRecord)="OnNuevoRegistroClick()"
          (editRecord)="OnEditarRegistroClick($event)"
          (deleteRecord)="OnEliminarRegistroClick($event)" permisoNew="ACT_CONTENIDOS_CREAR" permisoEdit="ACT_CONTENIDOS_MODIFICAR" permisoDelete="ACT_CONTENIDOS_ELIMINAR">
        </app-data-table>
      </div>
    </div>
  </div>
</div>
