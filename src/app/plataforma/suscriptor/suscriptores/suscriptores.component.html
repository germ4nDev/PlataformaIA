<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
                    {{ 'COMMON.MENU' | translate }}
                </button>
                <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'" *ngIf="hasFiltersSlot">
                    {{ 'COMMON.FILTERS' | translate }}
                </button>
            </div>

            <ng-container *ngIf="activeTab === 'menu'">
                <app-nav-content [navigationItems]="menuItems | async"></app-nav-content>
            </ng-container>

            <ng-container *ngIf="activeTab === 'filters'">
                <div class="p-3 filtros-scroll-wrapper">
                    <h6 class="filtros-title">{{ 'SUSCRIPTOR.SUSCRIPTORES.SUBSCRIBER_FILTERS' | translate }}</h6>
                    <div class="filtro">
                        <small>{{ 'COMMON.NAME' | translate }}</small>
                        <input type="text" (keyup)="onFiltroNombreChangeClick($event)" class="form-control form-input"
                            placeholder="{{ 'COMMON.SUBSCRIBER_NAME' | translate }}" />
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.IDENTIFICATION' | translate }}</small>
                        <input type="text" (keyup)="onFiltroIdentificacionChangeClick($event)"
                            class="form-control form-input"
                            placeholder="{{ 'SUSCRIPTOR.SUSCRIPTORES.SUBSCRIBER_IDENTIFICATION' | translate }}" />
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.STATUS' | translate }}</small>
                        <select (change)="onFiltroEstadoChangeClick($event)" class="form-control form-select"
                            style="cursor: pointer">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option value="true">{{ 'COMMON.ACTIVE' | translate }}</option>
                            <option value="false">{{ 'COMMON.INACTIVE' | translate }}</option>
                        </select>
                    </div>
                </div>
            </ng-container>
        </div>
    </aside>

    <div class="content-area">
        <div class="card card-table content-scroll-wrapper">
            <div class="card-body">
                <ng-container *ngIf="registrosFiltrados$ | async as dataFiltrada; else loading">
                    <app-table-data [data]="dataFiltrada" [idField]="'codigoSuscriptor'"
                        [tableTitle]="'SUSCRIPTOR.SUSCRIPTORES.SUBSCRIBER_MANAGEMENT' | translate"
                        [newButtonLabel]="'SUSCRIPTOR.SUSCRIPTORES.NEW_SUBSCRIBER' | translate"
                        [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate" [metadataColumns]="columnasRegistros"
                        [metadataDetailColumns]="columnasDetailRegistros" [showActions]="true" [showNewButton]="true"
                        [showViewButton]="false" [showSearchBox]="false" (newRecord)="OnNuevoRegistroClick()"
                        (accionPrincipalClick)="onAccionPrincipal($event)" permisoNew="ACT_SUSC_CREAR"
                        permisoEdit="ACT_SUSC_MODIFICAR" permisoDelete="ACT_SUSC_ELIMINAR">
                    </app-table-data>
                </ng-container>

                <ng-template #loading>
                    <app-data-loader [isLoading]="true" message="Cargando Usuarios ..."> </app-data-loader>
                </ng-template>
            </div>
        </div>
    </div>
</div>
