<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
                    {{ 'COMMON.MENU' | translate }}
                </button>
                <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'" *ngIf="hasFiltersSlot">
                    {{ 'COMMON.FILTERS' | translate }}
                </button>
            </div>

            <ng-container *ngIf="activeTab === 'menu'">
                <app-nav-content [navigationItems]="menuItems | async"></app-nav-content>
            </ng-container>
            <ng-container *ngIf="activeTab === 'filters'">
                <div class="p-3 filtros-scroll-wrapper">
                    <h6 class="filtros-title text-center">{{ 'SUSCRIPTOR.EMPRESAS.COMPANY_FILTERS' | translate }}</h6>
                    <div class="filtro">
                        <small>{{ 'COMMON.SUBSCRIBER' | translate }}</small>
                        <select class="form-control form-select" style="cursor: pointer;"
                            (change)="onFiltroSuscriptorChangeClick($event)">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option [value]="suscriptor.codigoSuscriptor" *ngFor="let suscriptor of suscriptores">
                                {{ suscriptor.nombreSuscriptor }}</option>
                        </select>
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.NAME' | translate }}</small>
                        <input type="text" (keyup)="onFiltroNombreChangeClick($event)" class="form-control form-input"
                            placeholder="{{ 'SUSCRIPTOR.EMPRESAS.COMPANY_NAME' | translate }}" />
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.DESCRIPTION' | translate }}</small>
                        <input type="text" (keyup)="onFiltroDescripcionChangeClick($event)"
                            class="form-control form-input"
                            placeholder="{{ 'SUSCRIPTOR.EMPRESAS.COMPANY_DESCRIPTION' | translate }}" />
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.STATUS' | translate }}</small>
                        <select class="form-control form-select" style="cursor: pointer;"
                            (change)="onFiltroEstadoChangeClick($event)">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option value="true">{{ 'COMMON.ACTIVE' | translate }}</option>
                            <option value="false">{{ 'COMMON.INACTIVE' | translate }}</option>
                        </select>
                    </div>
                </div>
            </ng-container>
        </div>
    </aside>

    <div class="content-area">
        <div class="card card-table content-scroll-wrapper">
            <div class="card-body">
                <ng-container *ngIf="registrosFiltrado$ | async as dataFiltrada">
                    <app-table-data [data]="dataFiltrada" [idField]="'codigoEmpresaSC'"
                        [tableTitle]="'SUSCRIPTOR.EMPRESAS.COMPANY_MANAGEMENT' | translate"
                        [newButtonLabel]="'SUSCRIPTOR.EMPRESAS.NEW_COMPANY' | translate"
                        [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate" [metadataColumns]="columnasRegistros"
                        [metadataDetailColumns]="columnasDetailRegistros" [showDetail]="true" [showActions]="true"
                        [showNewButton]="true" [showViewButton]="false" [showEditButton]="false"
                        [showDeleteButton]="false" [showBackButton]="true" [showSearchBox]="false"
                        (newRecord)="OnNuevoRegistroClick()" (backRecord)="OnRegresarClick($event)"
                        (accionPrincipalClick)="onAccionPrincipal($event)" permisoNew="ACT_SUSCEMP_CREAR">
                    </app-table-data>
                </ng-container>

                <ng-template #loading>
                    <app-data-loader [isLoading]="true" message="Cargando Usuarios ..."> </app-data-loader>
                </ng-template>
            </div>
        </div>
    </div>
</div>
