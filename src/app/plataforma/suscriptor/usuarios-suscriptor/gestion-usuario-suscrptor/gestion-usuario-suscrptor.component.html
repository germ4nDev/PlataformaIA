<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>{{ 'PLATAFORMA.MENU' | translate }}</button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>
    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky">
                <div class="dt-toolbar d-flex justify-content-between align-items-center mb-2">
                    <div class="d-flex align-items-center">
                        <h4 class="datatable-title" *ngIf="!modoEdicion">{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.NEW'
                            | translate }}</h4>
                        <h4 class="datatable-title" *ngIf="modoEdicion">{{
                            'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.UPDATE' | translate }}</h4>&nbsp;
                        <h4 class="datatable-title">{{ nomSuscriptor }}</h4>
                    </div>
                    <div class="d-flex">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnRegresarClick()">
                            {{ 'PLATAFORMA.REGRESAR' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.CREATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.UPDATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.CODE' | translate
                                    }}</label>
                                <input class="form-control form-input" name="codigoUsuarioSC" type="text"
                                    placeholder="{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.PLACEHOLDERCODE' | translate }}"
                                    [ngClass]="{'is-invalid': !codigoUsuarioSC.valid && (codigoUsuarioSC.dirty || codigoUsuarioSC.touched || isSubmit) }"
                                    #codigoUsuarioSC="ngModel" required [(ngModel)]="FormRegistro.codigoUsuario"
                                    readonly />
                                <label
                                    *ngIf="!codigoUsuarioSC.valid && (codigoUsuarioSC.dirty || codigoUsuarioSC.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.REQUERIDOCODE' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.IDENTIFICACION' |
                                    translate
                                    }}</label>
                                <input type="number" class="form-control form-input" name="identificacionUsuario"
                                    placeholder="{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.INDENTIFICACIONHOLDER' | translate }}"
                                    (input)="onIdentificacionChangeClick($event)"
                                    [ngClass]="{'is-invalid': !identificacionUsuario.valid && (identificacionUsuario.dirty || identificacionUsuario.touched || isSubmit)}"
                                    #identificacionUsuario="ngModel" required
                                    [(ngModel)]="FormRegistro.identificacionUsuario" />
                                <label
                                    *ngIf="!identificacionUsuario.valid && (identificacionUsuario.dirty || identificacionUsuario.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.REQUERIDOIDENTIFICATION' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombreUsuarioSC">{{
                                    'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.NAME' |
                                    translate }}</label>
                                <input class="form-control form-input" id="nombreUsuarioSC" name="nombreUsuarioSC"
                                    type="text"
                                    placeholder="{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.PLACEHOLDERNAME' | translate }}"
                                    [ngClass]="{ 'is-invalid': !nombreUsuarioSC.valid && (nombreUsuarioSC.dirty || nombreUsuarioSC.touched || isSubmit) }"
                                    #nombreUsuarioSC="ngModel" required [(ngModel)]="FormRegistro.nombreUsuario" />
                                <label
                                    *ngIf="!nombreUsuarioSC.valid && (nombreUsuarioSC.dirty || nombreUsuarioSC.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.REQUERIDONAME' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.CORREO' | translate
                                    }}</label>
                                <input type="email" class="form-control form-input" name="correoUsuario"
                                    placeholder="{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.CORREOHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !correoUsuario.valid && (correoUsuario.dirty || correoUsuario.touched || isSubmit) }"
                                    #correoUsuario="ngModel" required [(ngModel)]="FormRegistro.correoUsuario" />
                                <label
                                    *ngIf="!correoUsuario.valid && (correoUsuario.dirty || correoUsuario.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.REQUERIDOCORREO' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.USERNAME' |
                                    translate }}</label>
                                <input type="text" class="form-control form-input" name="userNameUsuario"
                                    placeholder="{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.USERNAMEHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !userNameUsuario.valid && (userNameUsuario.dirty || userNameUsuario.touched || isSubmit) }"
                                    #userNameUsuario="ngModel" required [(ngModel)]="FormRegistro.userNameUsuario" />
                                <label
                                    *ngIf="!userNameUsuario.valid && (userNameUsuario.dirty || userNameUsuario.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.REQUERIDOUSERNAME' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.CLAVEACTUAL' |
                                    translate
                                    }}</label>
                                <input type="text" class="form-control form-input" name="claveUsuario"
                                    (ngModelChange)="validarClaveActual($event)"
                                    placeholder="{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.CLAVEACTUALHOLDER' | translate }}"
                                    #claveUsuario="ngModel" required [(ngModel)]="FormRegistro.claveUsuario" />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.CLAVENEW' |
                                    translate }}</label>
                                <input type="text" class="form-control form-input" name="claveNew"
                                    [disabled]="isClaveActual"
                                    placeholder="{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.CLAVENEWHOLDER' | translate }}"
                                    #claveNew="ngModel" required [(ngModel)]="FormRegistro.claveNew" />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.CLAVECONFIRM' |
                                    translate
                                    }}</label>
                                <input type="text" class="form-control form-input" name="claveConfirm"
                                    [disabled]="isClaveActual"
                                    placeholder="{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.CLAVECONFIRMHOLDER' | translate }}"
                                    #claveConfirm="ngModel" required [(ngModel)]="FormRegistro.claveConfirm" />
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.DESCRIPTION' |
                                    translate
                                    }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcionUsuario ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionRegistro($event)"
                                    name="descripcionUsuario" [(ngModel)]="FormRegistro.descripcionUsuario" [ngClass]="{
                                        'is-invalid': !descripcionUsuario.valid && (descripcionUsuario.dirty || descripcionUsuario.touched || isSubmit)
                                    }" #descripcionUsuario="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcionUsuario.valid && (descripcionUsuario.dirty || descripcionUsuario.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.REQUERIDODESCRIPTION' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.FOTO' | translate
                                    }}</label>
                                <img *ngIf="selectedFileUrl" [src]="selectedFileUrl" class="avatar-preview" />
                                <div class="file-input-wrapper">
                                    <label for="fileUploadInput" class="btn btn-primary btn-NuevoRegistro">
                                        {{ 'Seleccionar archivo' | translate }}
                                    </label>
                                    <input type="file" (change)="onFileSelectedClick($event)" accept="image/*"
                                        id="fileUploadInput" class="form-control form-input d-none"
                                        name="fotoUsuario" />
                                </div>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.STATUS' | translate
                                    }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estadoModulo" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estadoUsuario" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.ACTIVE' | translate }}</label>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estadoModulo" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estadoUsuario" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.INACTIVE' | translate }}</label>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="row col-md-12">
                            <div class="col-md-6 text-center">
                                <h4>{{ 'SUSCRIPTOR.USUARIOSSUSCRIPTOR.GESTION.EMPRESASTITLE' | translate }}</h4>
                            </div>
                            <div class="col-md-12" style="max-height: 400px; overflow-y: auto;">
                                <div class="row">
                                    <div class="col-md-6 mb-2" *ngFor="let empresa of empresasSC; let i = index">
                                        <div class="form-check custom-check-form">
                                            <input class="form-check-input" type="checkbox"
                                                [(ngModel)]="empresa.checked" [name]="'empreCheck_' + i"
                                                [id]="'empre_' + i" (change)="onEmpresasSCClickChange($event, empresa)">
                                            <label class="form-check-label text-white ml-2" [for]="'dimen_' + i">
                                                {{ empresa.nombreEmpresa }}
                                            </label>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
