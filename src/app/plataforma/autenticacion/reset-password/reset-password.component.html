<div class="auth-wrapper align-items-stretch aut-bg-img">
    <app-full-screen-slider [tipoSlider]="1"></app-full-screen-slider>
    <nav class="navbar fixed-top navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"></a>
            <div class="nav-right">
                <app-language-selector></app-language-selector>
            </div>
        </div>
    </nav>
    <div class="card card-body login-overlay"><br />
        <img src="assets/images/auth/auth-logo-dark.png" [alt]="'AUTENTICACION.LOGO' | translate"
            class="img-fluid mb-4 d-block d-xl-none d-lg-none" />
        <h4 class="mb-3 f-w-400 text-center titulo-panel">{{ 'COMMON.RESET_PASSWORD' | translate }}</h4>
        <div class="input-group mb-4">
            <span class="input-group-text form-input" id="basic-addon1"><i class="feather icon-mail"></i></span>
            <input type="email" class="form-control form-input"
                placeholder="{{ 'AUTENTICACION.RESET_PASSWORD.EMAIL_REGISTERED_WHEN_ACCOUNT_WAS_CREATED' | translate }}" [attr.aria-label]="'AUTENTICACION.RESET_PASSWORD.EMAIL' | translate"
                aria-describedby="basic-addon1" />
        </div>
        <!-- <div>
      <p
        >{{ 'AUTENTICACION.RESET_PASSWORD.NEW_GENERATED_PASSWORD' | translate }} = <b>{{ nuevaClave }}</b></p
      >
    </div> -->
        <div class="d-flex justify-content-center">
            <button class="btn btn-secundary btn-NuevoRegistro" (click)="onRegresarClick()">{{
                'COMMON.BACK' | translate
                }}</button>
            <button class="btn btn-primary btn-NuevoRegistro">{{ 'AUTENTICACION.CHANGE_PASSWORD_TEXT' | translate
                }}</button>
        </div><br /><br />
        <app-social-networks></app-social-networks>
    </div>
</div>
