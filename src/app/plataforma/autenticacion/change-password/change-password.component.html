<div class="auth-wrapper align-items-stretch aut-bg-img">
    <app-full-screen-slider [tipoSlider]="1"></app-full-screen-slider>
    <nav class="navbar fixed-top navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"></a>
            <div class="nav-right">
                <app-language-selector></app-language-selector>
            </div>
        </div>
    </nav>
    <div class="card card-body login-overlay"><br />
        <img src="assets/images/auth/auth-logo-dark.png" [alt]="'AUTENTICACION.LOGO' | translate"
            class="img-fluid mb-4 d-block d-xl-none d-lg-none" />
        <h4 class="mb-4 f-w-400 text-center titulo-panel">{{ 'AUTENTICACION.CHANGE_PASSWORD_TEXT' | translate }}</h4>
        <div class="input-group mb-4">
            <span class="input-group-text form-input" id="basic-addon2"><i class="feather icon-lock"></i></span>
            <input type="password" id="actualPassword" class="form-control form-input"
                placeholder="{{ 'AUTENTICACION.CHANGE_PASSWORD.CURRENT_PASSWORD' | translate }}" />
            <span class="input-group-text form-input"><i class="feather icon-eye password-show" style="cursor: pointer"
                    id="toggleActualPassword"></i></span>
        </div>
        <div class="input-group mb-4">
            <span class="input-group-text form-input" id="basic-addon2"><i class="feather icon-lock"></i></span>
            <input type="password" id="newPassword" class="form-control form-input"
                placeholder="{{ 'AUTENTICACION.CHANGE_PASSWORD.NEW_PASSWORD' | translate }}" />
            <span class="input-group-text form-input"><i class="feather icon-eye password-show" style="cursor: pointer"
                    id="toggleNewPassword"></i></span>
        </div>
        <div class="input-group mb-4">
            <span class="input-group-text form-input" id="basic-addon2"><i class="feather icon-lock"></i></span>
            <input type="password" id="retypePassword" class="form-control form-input"
                placeholder="{{ 'AUTENTICACION.CHANGE_PASSWORD.CONFIRM_NEW_PASSWORD' | translate }}" />
            <span class="input-group-text form-input"><i class="feather icon-eye password-show" style="cursor: pointer"
                    id="toggleRetypePassword"></i></span>
        </div>
        <div class="d-flex justify-content-center">
            <button class="btn btn-secundary btn-NuevoRegistro" (click)="onRegresarClick()">{{
                'COMMON.BACK' | translate
                }}</button>
            <button class="btn btn-primary btn-NuevoRegistro">"{{ 'COMMON.CHANGE_PASSWORD' | translate
                }}</button>
        </div><br /><br />

        <app-social-networks></app-social-networks>
    </div>
</div>
