<div class="auth-wrapper">
    <div class="auth-content">
      <div class="auth-bg">
        <span class="r"></span>
        <span class="r s"></span>
        <span class="r s"></span>
        <span class="r"></span>
      </div>
      <div class="card">
        <div class="card-body text-center">
          <h5 class="mb-4">{{ 'WEB.PERFIL_CONFIGURACION.PROFILE_SETTINGS' | translate }}</h5>
          <img src="assets/images/user/avatar-3.jpg" class="img-radius mb-4" [alt]="'WEB.PERFIL_CONFIGURACION.USER_PROFILE_IMAGE' | translate" />
          <div class="input-group mb-3">
            <input type="text" class="form-control" [placeholder]="'WEB.PERFIL_CONFIGURACION.NAME' | translate" />
          </div>
          <div class="input-group mb-3">
            <input type="text" class="form-control" [placeholder]="'WEB.PERFIL_CONFIGURACION.USER_NAME' | translate" />
          </div>
          <div class="mb-4 text-start">
            <div class="form-group d-inline">
              <div class="radio radio-fill d-inline">
                <input type="radio" name="radio-in-1" id="radio-in-1" checked />
                <label for="radio-in-1" class="cr">{{ 'WEB.PERFIL_CONFIGURACION.PRIVATE_PROFILE' | translate }}</label>
              </div>
            </div>
            <div class="form-group d-inline">
              <div class="radio radio-fill d-inline">
                <input type="radio" name="radio-in-1" id="radio-in-2" />
                <label for="radio-in-2" class="cr">{{ 'WEB.PERFIL_CONFIGURACION.PUBLIC_PROFILE' | translate }}</label>
              </div>
            </div>
          </div>
          <button class="btn btn-primary mb-4">{{ 'WEB.PERFIL_CONFIGURACION.REGISTER' | translate }}</button>
          <p class="mb-0 text-muted">{{ 'WEB.PERFIL_CONFIGURACION.DON_T_HAVE_AN_ACCOUNT' | translate }} <a [routerLink]="['/auth/signup']">{{ 'WEB.PERFIL_CONFIGURACION.SIGN_UP' | translate }}</a></p>
        </div>
      </div>
    </div>
  </div>
