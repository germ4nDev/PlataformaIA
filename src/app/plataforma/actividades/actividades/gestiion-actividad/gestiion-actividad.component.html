<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>
                    {{ 'COMMON.MENU' | translate }}
                </button>
            </div>

            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky pb-0 border-bottom-0">
                <div class="d-flex justify-content-between align-items-center mb-3 mt-2">

                    <!-- Bloque Izquierdo: Título Integrado y Subtítulo -->
                    <div class="d-flex flex-column pe-3">
                        <h4 class="titulo-formulario">
                            <span *ngIf="!modoEdicion">{{ 'ACTIVIDADES.NEW_ACTIVITY' | translate }}</span>
                            <span *ngIf="modoEdicion">{{ 'ACTIVIDADES.GESTIION_ACTIVIDAD.EDIT_ACTIVITY' | translate }}</span>
                            <span class="titulo-container"> - {{ 'ACTIVIDADES.ACTIVITY_MANAGEMENT' | translate
                                }}</span>
                        </h4>
                        <h6 class="subtitulo-formulario mb-0">
                            {{ 'ACTIVIDADES.GESTIION_ACTIVIDAD.ACTIVITY_DETAILS' | translate }}
                        </h6>
                    </div>

                    <!-- Bloque Derecho: Botones con Spinners -->
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro" (click)="btnRegresarClick()">
                            {{ 'COMMON.BACK' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarActividadClick(validationForm)">
                            {{ 'ACTIVIDADES.GESTIION_ACTIVIDAD.CREATE_ACTIVITY' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarActividadClick(validationForm)">
                            {{ 'ACTIVIDADES.GESTIION_ACTIVIDAD.EDIT_ACTIVITY' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
                <hr class="mb-0"><br>
            </div>

            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.CODE' | translate }}</label>
                                <input type="text" class="form-control form-input" name="codigoActividad"
                                    placeholder="{{ 'ACTIVIDADES.GESTIION_ACTIVIDAD.ACTIVITY_CODE' | translate }}"
                                    [ngClass]="{'is-invalid': !codigoActividad.valid && (codigoActividad.dirty || codigoActividad.touched || isSubmit) }"
                                    #codigoActividad="ngModel" required [(ngModel)]="FormRegistro.codigoActividad"
                                    readonly />
                                <label
                                    *ngIf="!codigoActividad.valid && (codigoActividad.dirty || codigoActividad.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.REQUIRED_FIELD' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoAplicacion">{{
                                    'COMMON.APPLICATION' |
                                    translate }}</label>
                                <select class="form-control form-select" style="cursor: pointer;" name="codigoAplicacion"
                                    id="codigoAplicacion"
                                    [ngClass]="{ 'is-invalid': !codigoAplicacion.valid && (codigoAplicacion.dirty || codigoAplicacion.touched || isSubmit) }"
                                    #codigoAplicacion="ngModel" required [(ngModel)]="FormRegistro.codigoAplicacion"
                                    (change)="onAplicacionchangeClick($event)">
                                    <option value="" disabled>{{ 'COMMON.SELECT_APPLICATION' | translate
                                        }}
                                    </option>
                                    <option [value]="app.codigoAplicacion" *ngFor="let app of aplicaciones">{{
                                        app.nombreAplicacion }}</option>
                                </select>
                                <label
                                    *ngIf="!codigoAplicacion.valid && (codigoAplicacion.dirty || codigoAplicacion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.REQUIRED_FIELD' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoSuite">
                                    {{ 'COMMON.SUITE' | translate }}</label>
                                <select class="form-control form-select" style="cursor: pointer;" name="codigoSuite"
                                    id="codigoSuite"
                                    [ngClass]="{ 'is-invalid': !codigoSuite.valid && (codigoSuite.dirty || codigoSuite.touched || isSubmit) }"
                                    #codigoSuite="ngModel" required [(ngModel)]="FormRegistro.codigoSuite"
                                    (change)="onSuiteChangeClick($event)">
                                    <option value="">{{ 'COMMON.SELECT_SUITE' | translate }}
                                    </option>
                                    <option [value]="sui.codigoSuite" *ngFor="let sui of suitesFiltro">
                                        {{ sui.nombreSuite }}</option>
                                </select>
                                <label
                                    *ngIf="!codigoSuite.valid && (codigoSuite.dirty || codigoSuite.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.REQUIRED_FIELD' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoModulo">
                                    {{ 'COMMON.MODULE' | translate }}</label>
                                <select class="form-control form-select" style="cursor: pointer;" name="codigoModulo"
                                    id="codigoModulo"
                                    [ngClass]="{ 'is-invalid': !codigoModulo.valid && (codigoModulo.dirty || codigoModulo.touched || isSubmit) }"
                                    #codigoModulo="ngModel" required [(ngModel)]="FormRegistro.codigoModulo"
                                    (change)="onModuloChangeClick($event)">
                                    <option value="">{{ 'COMMON.SELECT_MODULE' | translate }}
                                    </option>
                                    <option [value]="mod.codigoModulo" *ngFor="let mod of modulosPadre">
                                        {{ mod.nombreModulo }}</option>
                                </select>
                                <label
                                    *ngIf="!codigoModulo.valid && (codigoModulo.dirty || codigoModulo.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.REQUIRED_FIELD' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoTipoActividad">
                                    {{ 'ACTIVIDADES.GESTIION_ACTIVIDAD.ACTIVITY_TYPE' | translate }}</label>
                                <select class="form-control form-select" style="cursor: pointer;"
                                    name="codigoTipoActividad" id="codigoTipoActividad"
                                    [ngClass]="{ 'is-invalid': !codigoTipoActividad.valid && (codigoTipoActividad.dirty || codigoTipoActividad.touched || isSubmit) }"
                                    #codigoTipoActividad="ngModel" required
                                    [(ngModel)]="FormRegistro.codigoTipoActividad"
                                    (change)="onModuloChangeClick($event)">
                                    <option value="">{{ 'ACTIVIDADES.GESTIION_ACTIVIDAD.SELECT_ACTIVITY_TYPE' | translate }}
                                    </option>
                                    <option [value]="mod.codigoTipoActividad" *ngFor="let mod of tiposActividad">
                                        {{ mod.nombreTipoActividad }}</option>
                                </select>
                                <label
                                    *ngIf="!codigoTipoActividad.valid && (codigoTipoActividad.dirty || codigoTipoActividad.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.REQUIRED_FIELD' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="actividad">{{ 'COMMON.NAME' | translate
                                    }}</label>
                                <input class="form-control form-input" id="actividad" name="actividad" type="text"
                                    placeholder="{{ 'COMMON.NAME' | translate }}"
                                    [ngClass]="{'is-invalid': !actividad.valid && (actividad.dirty || actividad.touched || isSubmit)}"
                                    #actividad="ngModel" required [(ngModel)]="FormRegistro.actividad" />
                                <label *ngIf="!actividad.valid && (actividad.dirty || actividad.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'ACTIVIDADES.GESTIION_ACTIVIDAD.ACTIVITY_NAME' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="llavePermiso">{{ 'ACTIVIDADES.PERMISSION_KEY' |
                                    translate
                                    }}</label>
                                <input class="form-control form-input" id="llavePermiso" name="llavePermiso" type="text"
                                    placeholder="{{ 'ACTIVIDADES.PERMISSION_KEY' | translate }}"
                                    [ngClass]="{'is-invalid': !llavePermiso.valid && (llavePermiso.dirty || llavePermiso.touched || isSubmit)}"
                                    #llavePermiso="ngModel" required [(ngModel)]="FormRegistro.llavePermiso" />
                                <label
                                    *ngIf="!llavePermiso.valid && (llavePermiso.dirty || llavePermiso.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'ACTIVIDADES.GESTIION_ACTIVIDAD.PERMISSION_KEY_ACT_MODULE_ACTION' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.DESCRIPTION' | translate }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcion ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionVersion($event)" name="descripcion"
                                    [(ngModel)]="FormRegistro.descripcion"
                                    [ngClass]="{'is-invalid': !descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)}"
                                    #descripcion="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcion.valid && (descripcion.dirty || descripcion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'ACTIVIDADES.GESTIION_ACTIVIDAD.ACTIVITY_DESCRIPTION' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estadoActividad" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estadoActividad">
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.ACTIVE' | translate }}</span>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estadoActividad" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estadoActividad">
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.INACTIVE' | translate }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
