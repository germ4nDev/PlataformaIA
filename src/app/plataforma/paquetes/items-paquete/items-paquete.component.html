<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
                    {{ 'COMMON.MENU' | translate }}
                </button>
                <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'" *ngIf="hasFiltersSlot">
                    {{ 'COMMON.FILTERS' | translate }}
                </button>
            </div>
            <ng-container *ngIf="activeTab === 'menu'">
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
            <ng-container *ngIf="activeTab === 'filters'">
                <div class="p-3 filtros-scroll-wrapper">
                    <h6 class="filtros-title">{{ 'COMMON.SEARCH_FILTERS' | translate }}</h6>

                    <div class="filtro">
                        <label class="form-control-label" for="tipoValorId"> {{ 'PAQUETES.ITEMS_PAQUETE.VALUE_TYPE' | translate
                            }}</label>
                        <select (change)="onTipoValorChangeClick($event)" class="form-control form-select">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option [value]="tipo.codigoTipoItem" *ngFor="let tipo of tiposValor">
                                {{ tipo.nombreTipo }}
                            </option>
                        </select>
                    </div>

                    <div class="filtro">
                        <small>{{ 'COMMON.FILTER_BY_NAME' | translate }}</small>
                        <select (change)="onFiltroValorChangeClick($event)" class="form-control form-select">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option [value]="valor.codigoItem" *ngFor="let valor of listaPrecios">
                                {{ valor.nombreItem }}
                            </option>
                        </select>
                    </div>

                    <div class="filtro">
                        <small>{{ 'COMMON.FILTER_BY_NAME' | translate }}</small>
                        <input type="text" (keyup)="onFiltroNombreChangeClick($event)" class="form-control form-input"
                            placeholder="{{ 'COMMON.SEARCH_BY_NAME' | translate }}" />
                    </div>

                    <div class="filtro">
                        <small>{{ 'COMMON.FILTER_BY_DESCRIPTION' | translate }}</small>
                        <input type="text" (keyup)="onFiltroDescripcionChangeClick($event)"
                            class="form-control form-input"
                            placeholder="{{ 'COMMON.SEARCH_BY_DESCRIPTION' | translate }}" />
                    </div>

                    <div class="filtro">
                        <small>{{ 'COMMON.STATUS' | translate }}</small>
                        <select (change)="onFiltroEstadoChangeClick($event)" class="form-control form-select">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option value="true">{{ 'COMMON.ACTIVE' | translate }}</option>
                            <option value="false">{{ 'COMMON.INACTIVE' | translate }}</option>
                        </select>
                    </div>
                </div>
            </ng-container>
        </div>
    </aside>

    <div class="content-area">
        <div class="card card-table content-scroll-wrapper">
            <div class="card-body">
                <ng-container *ngIf="itemsPaqueteFiltrados$ | async as dataFiltrada; else loading">
                    <app-table-data [data]="dataFiltrada" [idField]="'codigoItem'"
                        [tableTitle]="'PAQUETES.PACKAGE_ITEM_MANAGEMENT' | translate" [metadataColumns]="columnasPaquetes"
                        [metadataDetailColumns]="columnasDetailRegistros" [showDetail]="true" [showActions]="true"
                        [showNewButton]="true" [showBackButton]="true" [showViewButton]="false" [showEditButton]="false"
                        [showDeleteButton]="false" [showSearchBox]="false" [newButtonLabel]="'PAQUETES.NEW_ITEM' | translate"
                        [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate" (newRecord)="OnNuevoRegistroClick()"
                        (backRecord)="OnRegresarClick()" (accionPrincipalClick)="onAccionPrincipal($event)"
                        permisoNew="ACT_ITEMPQ_CREAR">
                    </app-table-data>
                </ng-container>

                <ng-template #loading>
                    <app-data-loader [isLoading]="true" message="Cargando ítems ..."></app-data-loader>
                </ng-template>
            </div>
        </div>
    </div>
</div>
