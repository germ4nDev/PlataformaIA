<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <!-- PANEL IZQUIERDO -->
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>{{ 'PLATAFORMA.MENU' | translate }}</button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <!-- ÁREA DEL FORMULARIO -->
    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky pb-0 border-bottom-0">
                <div class="d-flex justify-content-between align-items-center mb-3 mt-2">

                    <!-- Bloque Izquierdo: Título y Subtítulo -->
                    <div class="d-flex flex-column pe-3">
                        <h4 class="titulo-container text-primary mb-1">
                            <span *ngIf="!modoEdicion">Nuevo Ítem de Catálogo</span>
                            <span *ngIf="modoEdicion">Modificar Ítem</span>
                        </h4>
                        <h6 class="subtitulo-container mb-0 text-muted">
                            Configure el valor unitario, costo y detalles del recurso.
                        </h6>
                    </div>

                    <!-- Bloque Derecho: Botones -->
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-secondary btn-animacion ms-2" (click)="btnRegresarClick()"
                            [disabled]="isSaving">
                            {{ 'PLATAFORMA.REGRESAR' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>

                        <button type="button" class="btn btn-primary btn-animacion ms-2"
                            (click)="btnGestionarRegistroClick()" [disabled]="isSaving">
                            <span *ngIf="!isSaving">
                                {{ modoEdicion ? ('PLATAFORMA.UPDATE' | translate) : ('PLATAFORMA.CREATE' | translate)
                                }}
                                <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                            </span>
                            <span *ngIf="isSaving">Guardando... <span class="spinner-border spinner-border-sm ms-2"
                                    role="status"></span></span>
                        </button>
                    </div>
                </div>
                <hr class="mb-0">
            </div>

            <div class="card-body form-scroll-wrapper pt-4">
                <form [formGroup]="formularioRegistro" novalidate>
                    <div class="row">

                        <!-- CÓDIGO DEL ÍTEM (SOLO LECTURA) -->
                        <div class="col-md-6 mb-3">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoValor">Código del Ítem</label>
                                <input type="text" class="form-control bg-light" id="codigoValor"
                                    formControlName="codigoValor" readonly />
                                <small class="text-muted">ID único generado por el sistema.</small>
                            </div>
                        </div>

                        <!-- TIPO DE ÍTEM (SELECTOR) -->
                        <div class="col-md-6 mb-3">
                            <div class="form-group">
                                <label class="form-control-label" for="tipoValorId">Categoría / Tipo de Ítem</label>
                                <select class="form-control form-select" id="tipoValorId" formControlName="tipoValorId"
                                    [ngClass]="{ 'is-invalid': f['tipoValorId'].invalid && (f['tipoValorId'].dirty || f['tipoValorId'].touched || isSubmit) }">
                                    <option value="" disabled selected>Seleccione el tipo...</option>
                                    <option [value]="tipo.tipoItemId" *ngFor="let tipo of tiposItem">
                                        {{ tipo.nombreTipo }}
                                    </option>
                                </select>
                                <label
                                    *ngIf="f['tipoValorId'].invalid && (f['tipoValorId'].dirty || f['tipoValorId'].touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    Debe seleccionar una categoría.
                                </label>
                            </div>
                        </div>

                        <!-- NOMBRE DEL ÍTEM -->
                        <div class="col-md-12 mb-3">
                            <div class="form-group">
                                <label class="form-control-label" for="nombreValor">Nombre Comercial del Ítem</label>
                                <input type="text" class="form-control" id="nombreValor" formControlName="nombreValor"
                                    placeholder="Ej: 1GB Almacenamiento Adicional"
                                    [ngClass]="{ 'is-invalid': f['nombreValor'].invalid && (f['nombreValor'].dirty || f['nombreValor'].touched || isSubmit) }" />
                                <label
                                    *ngIf="f['nombreValor'].invalid && (f['nombreValor'].dirty || f['nombreValor'].touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    El nombre es obligatorio.
                                </label>
                            </div>
                        </div>

                        <!-- COSTO BASE -->
                        <div class="col-md-6 mb-3">
                            <div class="form-group">
                                <label class="form-control-label" for="costoValor">Costo Interno</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" class="form-control" id="costoValor"
                                        formControlName="costoValor" placeholder="0.00"
                                        [ngClass]="{ 'is-invalid': f['costoValor'].invalid && (f['costoValor'].dirty || f['costoValor'].touched || isSubmit) }" />
                                </div>
                            </div>
                        </div>

                        <!-- VALOR UNITARIO (PRECIO DE VENTA) -->
                        <div class="col-md-6 mb-3">
                            <div class="form-group">
                                <label class="form-control-label" for="valorUnitario">Valor Unitario (Venta)</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" class="form-control" id="valorUnitario"
                                        formControlName="valorUnitario" placeholder="0.00"
                                        [ngClass]="{ 'is-invalid': f['valorUnitario'].invalid && (f['valorUnitario'].dirty || f['valorUnitario'].touched || isSubmit) }" />
                                </div>
                            </div>
                        </div>

                        <!-- DESCRIPCIÓN (QPLUS TEXT EDITOR) -->
                        <div class="col-md-12 mb-3">
                            <div class="form-group">
                                <label class="form-control-label">Descripción Detallada</label>
                                <app-text-editor [toolbarType]="'completa'"
                                    [contentHtml]="f['descripcionValor'].value || ''"
                                    (contentHtmlChange)="actualizarDescripcionValor($event)">
                                </app-text-editor>
                                <input type="hidden" formControlName="descripcionValor">
                                <small class="text-muted mt-1 d-block">Detalle qué incluye exactamente esta
                                    unidad.</small>
                            </div>
                        </div>

                        <!-- ESTADO (RADIO BUTTONS) -->
                        <div class="col-md-6 mb-3">
                            <div class="form-group">
                                <label class="form-control-label">{{ 'PLATAFORMA.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input formControlName="estadoValor" type="radio" [value]="true" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.ACTIVE' | translate }}</label>
                                    </label>
                                    <label class="radio-button">
                                        <input formControlName="estadoValor" type="radio" [value]="false" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.INACTIVE' | translate }}</label>
                                    </label>
                                </div>
                            </div>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
