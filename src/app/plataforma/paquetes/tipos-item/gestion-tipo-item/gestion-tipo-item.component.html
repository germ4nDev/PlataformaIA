<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>{{ 'PLATAFORMA.MENU' | translate }}</button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky pb-0 border-bottom-0">
                <div class="d-flex justify-content-between align-items-center mb-3 mt-2">

                    <div class="d-flex flex-column pe-3">
                        <h4 class="titulo-formulario mb-1">
                            <span *ngIf="!modoEdicion">{{ 'TIPOSITEM.GESTION.NEW' | translate }}</span>
                            <span *ngIf="modoEdicion">{{ 'TIPOSITEM.GESTION.UPDATE' | translate }}</span>
                        </h4>
                        <h6 class="subtitulo-formulario mb-0">
                            {{ 'TIPOSITEM.GESTION.SUBTITLE' | translate }}
                            <!-- Configure el nombre y el ícono representativo de esta clasificación. -->
                        </h6>
                    </div>

                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-secondary btn-animacion ms-2" (click)="btnRegresarClick()">
                            {{ 'PLATAFORMA.REGRESAR' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>

                        <button type="button" class="btn btn-primary btn-animacion ms-2"
                            (click)="btnGestionarRegistroClick()" [disabled]="isSaving">
                            <span *ngIf="!isSaving">
                                {{ modoEdicion ? ('PLATAFORMA.UPDATE' | translate) : ('PLATAFORMA.CREATE' | translate)
                                }}
                                <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                            </span>
                            <span *ngIf="isSaving">Guardando... <span class="spinner-border spinner-border-sm ms-2"
                                    role="status"></span></span>
                        </button>
                    </div>
                </div>
                <hr class="mb-0">
            </div>

            <div class="card-body form-scroll-wrapper pt-4">
                <form [formGroup]="formularioRegistro" novalidate>
                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoTipoItem">{{ 'TIPOSITEM.GESTION.CODE' |
                                    translate }}</label>
                                <input type="text" class="form-control form-input bg-light" id="codigoTipoItem"
                                    formControlName="codigoTipoItem" readonly />
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <div class="form-group">
                                <label class="form-control-label" for="nombreTipo">{{ 'TIPOSITEM.GESTION.NAME' |
                                    translate }}</label>
                                <input type="text" class="form-control form-input" id="nombreTipo"
                                    formControlName="nombreTipo"
                                    placeholder="{{ 'TIPOSITEM.GESTION.HOLDERNAME' | translate }}"
                                    [ngClass]="{ 'is-invalid': f['nombreTipo'].invalid && (f['nombreTipo'].dirty || f['nombreTipo'].touched || isSubmit) }" />

                                <label
                                    *ngIf="f['nombreTipo'].invalid && (f['nombreTipo'].dirty || f['nombreTipo'].touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'TIPOSITEM.GESTION.ERRORNAME' | translate }}
                                </label>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <div class="form-group">
                                <label class="form-control-label">{{ 'TIPOSITEM.GESTION.ICONO' | translate }}</label>
                                <app-icon-picker formControlName="iconoTipo" containerHeight="350px">
                                </app-icon-picker>
                                <label
                                    *ngIf="f['iconoTipo'].invalid && (f['iconoTipo'].dirty || f['iconoTipo'].touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback d-block mt-1">
                                    {{ 'TIPOSITEM.GESTION.ERRORICONO' | translate }}
                                </label>
                            </div>
                        </div>

                        <div class="col-md-12 mb-3">
                            <div class="form-group">
                                <label class="form-control-label">{{ 'TIPOSITEM.GESTION.DESCRIPCION' | translate
                                    }}</label>
                                <app-text-editor [toolbarType]="'basica'"
                                    [contentHtml]="f['descripcionTipo'].value || ''"
                                    (contentHtmlChange)="actualizarDescripcionValor($event)">
                                </app-text-editor>
                                <input type="hidden" formControlName="descripcionTipo">
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <div class="form-group">
                                <label class="form-control-label">{{ 'PLATAFORMA.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input formControlName="estadoTipo" type="radio" [value]="true" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.ACTIVE' | translate }}</label>
                                    </label>
                                    <label class="radio-button">
                                        <input formControlName="estadoTipo" type="radio" [value]="false" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.INACTIVE' | translate }}</label>
                                    </label>
                                </div>
                            </div>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
