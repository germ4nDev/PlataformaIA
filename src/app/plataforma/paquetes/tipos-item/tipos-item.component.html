<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
  <!-- PANEL IZQUIERDO -->
  <aside class="aside-left">
    <div class="card">
      <div class="nav-tabs-custom">
        <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
          {{ 'COMMON.MENU' | translate }}
        </button>
        @if (hasFiltersSlot) {
          <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'">
            {{ 'COMMON.FILTERS' | translate }}
          </button>
        }
      </div>

      @if (activeTab === 'menu') {
        <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
      }

      @if (activeTab === 'filters') {
        <div class="p-3 filtros-scroll-wrapper">
          <h6 class="filtros-title">{{ 'PAQUETES.TIPOS_ITEM.TYPE_FILTERS' | translate }}</h6>
          <div class="filtro">
            <small>{{ 'PAQUETES.FILTER_BY_NAME' | translate }}</small>
            <input
              type="text"
              (keyup)="onFiltroNombreChangeClick($event)"
              class="form-control form-input"
              [placeholder]="'PAQUETES.TIPOS_ITEM.SEARCH_ITEM_TYPE' | translate"
            />
          </div>
          <div class="filtro">
            <small>{{ 'COMMON.STATUS' | translate }}</small>
            <select (change)="onFiltroEstadoChangeClick($event)" class="form-control form-select">
              <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
              <option value="true">{{ 'COMMON.ACTIVE' | translate }}</option>
              <option value="false">{{ 'COMMON.INACTIVE' | translate }}</option>
            </select>
          </div>
        </div>
      }
    </div>
  </aside>

  <!-- ZONA CENTRAL DE DATOS -->
  <div class="content-area">
    <div class="card card-table content-scroll-wrapper">
      <div class="card-body">
        @if (_tiposFiltrados$ | async; as dataFiltrada) {
          <app-table-data
            [data]="dataFiltrada"
            [idField]="'codigoTipoItem'"
            [tableTitle]="'PAQUETES.TIPOS_ITEM.CATEGORIES_ITEM_TYPES' | translate"
            [metadataColumns]="columnasTipos"
            [metadataDetailColumns]="columnasDetailRegistros"
            [showDetail]="true"
            [showActions]="true"
            [showNewButton]="true"
            [showViewButton]="false"
            [showEditButton]="false"
            [showDeleteButton]="false"
            [showSearchBox]="false"
            [newButtonLabel]="'COMMON.NEW' | translate"
            [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate"
            (newRecord)="OnNuevoRegistroClick()"
            (accionPrincipalClick)="onAccionPrincipal($event)"
            permisoNew="ACT_TIPOS_ITEM_CREAR"
          >
          </app-table-data>
        } @else {
          <app-data-loader [isLoading]="true" message="Cargando tipos de ítems ..."></app-data-loader>
        }
      </div>
    </div>
  </div>
</div>
