<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
                    {{ 'COMMON.MENU' | translate }}
                </button>
                <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'">
                    {{ 'COMMON.FILTERS' | translate }}
                </button>
            </div>

            <ng-container *ngIf="activeTab === 'menu'">
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
            <ng-container *ngIf="activeTab === 'filters'">
                <div class="p-3 filtros-scroll-wrapper">
                    <DIV class="text-center">
                        <h6 class="filtros-title">{{ 'TICKETS.CLASES_TICKET.TICKET_CLASS_FILTERS' | translate }}</h6>
                    </DIV>
                    <div class="filtro">
                        <small>{{ 'COMMON.NAME' | translate }}</small>
                        <input type="text" (keyup)="onFiltroNombreChangeClick($event)" class="form-control form-input"
                            placeholder="{{ 'TICKETS.CLASES_TICKET.CLASS_NAME' | translate }}" />
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.DESCRIPTION' | translate }}</small>
                        <input type="text" (keyup)="onFiltroDescripcionChangeClick($event)"
                            class="form-control form-input"
                            placeholder="{{ 'TICKETS.CLASES_TICKET.CLASS_DESCRIPTION' | translate }}" />
                    </div>
                    <div class="filtro">
                        <small>{{ 'COMMON.STATUS' | translate }}</small>
                        <select class="form-control form-select" style="cursor: pointer;"
                            (change)="onFiltroEstadoChangeClick($event)">
                            <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
                            <option value="true">{{ 'COMMON.ACTIVE' | translate }}</option>
                            <option value="false">{{ 'COMMON.INACTIVE' | translate }}</option>
                        </select>
                    </div>
                </div>
            </ng-container>
        </div>
    </aside>

    <div class="content-area">
        <div class="card card-table content-scroll-wrapper">
            <div class="card-body">
                <ng-container *ngIf="registrosFiltrado$ | async as dataFiltrada">
                    <app-table-data [data]="dataFiltrada" [idField]="'codigoClase'"
                        [tableTitle]="'TICKETS.CLASES_TICKET.TICKET_CLASS_MANAGEMENT' | translate"
                        [newButtonLabel]="'TICKETS.CLASES_TICKET.NEW_TICKET_CLASS' | translate"
                        [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate" [metadataColumns]="columnasRegistros"
                        [metadataDetailColumns]="columnasDetailRegistros" [showDetail]="true" [showActions]="true"
                        [showNewButton]="true" [showViewButton]="false" [showEditButton]="true"
                        [showDeleteButton]="true" [showSearchBox]="false" (viewRecord)="OnViewRegistroClick($event)"
                        (newRecord)="OnNuevoRegistroClick()" (editRecord)="OnEditarRegistroClick($event)"
                        (deleteRecord)="OnEliminarRegistroClick($event)" permisoNew="ACT_CLASESTK_CREAR" permisoEdit="ACT_CLASESTK_MODIFICAR" permisoDelete="ACT_CLASESTK_ELIMINAR">
                    </app-table-data>
                </ng-container>
            </div>
        </div>
    </div>
</div>
