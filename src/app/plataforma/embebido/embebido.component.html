<div class="embebido">
    <ng-container [ngSwitch]="estado">
        <p *ngSwitchCase="'fuera'">{{ 'EMBEBIDO.PAGE_ONLY_OPENS_INSIDE_PORTTOS_APP' | translate }}</p>
        <p *ngSwitchCase="'esperando'">{{ 'EMBEBIDO.CONNECTING_APP' | translate }}</p>
        <p *ngSwitchCase="'entrando'">{{ 'EMBEBIDO.LOADING_DASHBOARD' | translate }}</p>
        <p *ngSwitchCase="'error'">{{ mensaje }}</p>
    </ng-container>
</div>
