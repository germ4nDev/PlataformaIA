<div class="embebido">
  @switch (estado) {
    @case ('fuera') {
      <p>{{ 'EMBEBIDO.PAGE_ONLY_OPENS_INSIDE_PORTTOS_APP' | translate }}</p>
    }
    @case ('esperando') {
      <p>{{ 'EMBEBIDO.CONNECTING_APP' | translate }}</p>
    }
    @case ('entrando') {
      <p>{{ 'EMBEBIDO.LOADING_DASHBOARD' | translate }}</p>
    }
    @case ('error') {
      <p>{{ mensaje }}</p>
    }
  }
</div>
