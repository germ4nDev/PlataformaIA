<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>
                    {{ 'PLATAFORMA.MENU' | translate }}
                </button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky">
                <div class="dt-toolbar d-flex justify-content-between align-items-center mb-2">
                    <div class="d-flex align-items-center">
                        <h4 class="datatable-title" *ngIf="!modoEdicion">{{ 'PRECIOS.GESTION.NEW' | translate }}</h4>
                        <h4 class="datatable-title" *ngIf="modoEdicion">{{ 'PRECIOS.UPDATE' | translate }}</h4>
                    </div>
                    <div class="d-flex">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnRegresarClick()">
                            {{ 'PLATAFORMA.REGRESAR' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'PRECIOS.GESTION.CREATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'PRECIOS.UPDATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoModulo">
                                    {{ 'PRECIOS.GESTION.TIPOVALOR' | translate }}</label>
                                <select class="form-control form-input" style="cursor: pointer;" name="codigoTipoItem"
                                    id="codigoTipoItem"
                                    [ngClass]="{ 'is-invalid': !codigoTipoItem.valid && (codigoTipoItem.dirty || codigoTipoItem.touched || isSubmit) }"
                                    #codigoTipoItem="ngModel" required [(ngModel)]="FormRegistro.codigoTipoItem"
                                    (change)="onTipoValorChangeClick($event)">
                                    <option value="">{{ 'PRECIOS.GESTION.PLACEHOLDERTIPOBVALOR' | translate }}
                                    </option>
                                    <option [value]="reg.codigoTipoItem" *ngFor="let reg of tiposValor">
                                        {{ reg.nombreTipo }}</option>
                                </select>
                                <label
                                    *ngIf="!codigoTipoItem.valid && (codigoTipoItem.dirty || codigoTipoItem.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PRECIOS.GESTION.REQUERIDOTIPOVALOR' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'PRECIOS.GESTION.CODE' | translate }}</label>
                                <input type="text" class="form-control form-input" name="codigoItem"
                                    placeholder="{{ 'PRECIOS.GESTION.PLACEHOLDERCODE' | translate }}"
                                    [ngClass]="{'is-invalid': !codigoItem.valid && (codigoItem.dirty || codigoItem.touched || isSubmit) }"
                                    #codigoItem="ngModel" required [(ngModel)]="FormRegistro.codigoItem" readonly />
                                <label *ngIf="!codigoItem.valid && (codigoItem.dirty || codigoItem.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PRECIOS.GESTION.REQUERIDCODE' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-control-label" for="nombreItem">{{ 'PRECIOS.NAME' | translate
                                    }}</label>
                                <input class="form-control form-input" id="nombreItem" name="nombreItem" type="text"
                                    placeholder="{{ 'PRECIOS.GESTION.PLACEHOLDERNAME' | translate }}"
                                    [ngClass]="{'is-invalid': !nombreItem.valid && (nombreItem.dirty || nombreItem.touched || isSubmit)}"
                                    #nombreItem="ngModel" required [(ngModel)]="FormRegistro.nombreItem" />
                                <label *ngIf="!nombreItem.valid && (nombreItem.dirty || nombreItem.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PRECIOS.GESTION.REQUERIDONAME' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'PRECIOS.GESTION.VALORUNITARIO' | translate }}</label>
                                <input type="number" class="form-control form-input" name="valorUnitario"
                                    placeholder="{{ 'PRECIOS.GESTION.PLACEHOLDERVALORUNITARIO' | translate }}"
                                    [ngClass]="{'is-invalid': !valorUnitario.valid && (valorUnitario.dirty || valorUnitario.touched || isSubmit) }"
                                    #valorUnitario="ngModel" required [(ngModel)]="FormRegistro.valorUnitario" />
                                <label
                                    *ngIf="!valorUnitario.valid && (valorUnitario.dirty || valorUnitario.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PRECIOS.GESTION.REQUERIDVALORUNITARIO' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'PRECIOS.GESTION.COSTOVALOR' | translate }}</label>
                                <input type="number" class="form-control form-input" name="costoItem"
                                    placeholder="{{ 'PRECIOS.GESTION.PLACEHOLDERCOSTOVALOR' | translate }}"
                                    [ngClass]="{'is-invalid': !costoItem.valid && (costoItem.dirty || costoItem.touched || isSubmit) }"
                                    #costoItem="ngModel" required [(ngModel)]="FormRegistro.costoItem" />
                                <label *ngIf="!costoItem.valid && (costoItem.dirty || costoItem.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PRECIOS.GESTION.REQUERIDCOSTOVALOR' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'PRECIOS.DESCRIPTION' | translate }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcionItem ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionVersion($event)" name="descripcionItem"
                                    [(ngModel)]="FormRegistro.descripcionItem"
                                    [ngClass]="{'is-invalid': !descripcionItem.valid && (descripcionItem.dirty || descripcionItem.touched || isSubmit)}"
                                    #descripcionItem="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcionItem.valid && (descripcionItem.dirty || descripcionItem.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PRECIOS.GESTION.REQUERIDODESCRIPCION' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'PRECIOS.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estadoItem" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estadoItem">
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.ACTIVE' | translate }}</label>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estadoItem" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estadoItem">
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.INACTIVE' | translate }}</label>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
