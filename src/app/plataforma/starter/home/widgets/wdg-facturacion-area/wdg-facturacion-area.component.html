<app-widget-shell [titulo]="widgetConfig?.titulo || 'MRR: Ingresos Recurrentes'"
    [subtitulo]="widgetConfig?.subtitulo || 'Evolución de facturación'"
    [icono]="widgetConfig?.icono || 'feather icon-bar-chart-2'" [isEnfoque]="isEnfoque"
    (clickEnfoque)="maximizarDesdeShell()">

    <!-- 🟢 1. PROYECCIÓN AL HEADER DEL SHELL -->
    <div acciones-extra class="d-flex align-items-center">
        <!-- Reutilizamos la clase tc-badge para mantener consistencia visual -->
        <span class="tc-badge badge-warning text-uppercase">
            Financiero
        </span>
    </div>

    <!-- 🟢 2. CUERPO ÚNICO DEL WIDGET (Chart.js se adapta solo) -->
    <div class="chart-wrapper w-100 h-100 position-relative">
        <canvas baseChart [data]="lineChartData" [options]="lineChartOptions" [type]="lineChartType">
        </canvas>
    </div>

</app-widget-shell>
