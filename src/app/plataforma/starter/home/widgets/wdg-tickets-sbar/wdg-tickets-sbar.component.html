<app-widget-shell [titulo]="widgetConfig?.titulo || ('STARTER.HOME.WIDGETS.WDG_TICKETS_SBAR.TICKET_STATUS' | translate)"
    [subtitulo]="widgetConfig?.subtitulo || ('COMMON.OPERATIONS' | translate)" [icono]="widgetConfig?.icono || 'feather icon-bar-chart-2'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- 🟢 1. PROYECCIÓN AL HEADER: Badge de Operaciones -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-danger text-uppercase">
            {{ 'COMMON.OPERATIONS' | translate }}
        </span>
    </div>

    <!-- 🟢 2. CUERPO ÚNICO DEL WIDGET (Chart.js se adapta automáticamente) -->
    <div class="chart-wrapper w-100 h-100 position-relative pb-2">
        <canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="barChartType">
        </canvas>
    </div>

</app-widget-shell>
