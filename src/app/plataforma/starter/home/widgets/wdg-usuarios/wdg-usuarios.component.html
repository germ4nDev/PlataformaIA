<div class="card bg-transparent text-white h-100 w-100 mb-0 border-0 p-3 d-flex flex-column">

    <!-- Header Centralizado -->
    <app-widget-header titulo="Usuarios Conectados" icono="feather icon-users" [widgetId]="widgetId" [data]="data">
        <div acciones-extra class="d-flex align-items-center me-2">
            <span class="badge bg-success shadow-sm d-flex align-items-center px-2 py-1">
                <span class="spinner-grow spinner-grow-sm me-1" role="status"
                    style="width: 0.6rem; height: 0.6rem;"></span>
                En vivo
            </span>
        </div>
    </app-widget-header>

    <!-- 🔴 VISTA RESUMEN: Solo se muestra en la tarjeta pequeña -->
    <div *ngIf="!enModoEnfoque" class="flex-grow-1 d-flex justify-content-center align-items-center">
        <h1 class="display-3 fw-bold text-white m-0">
            {{ totalConectados }}
        </h1>
    </div>

    <!-- 🟢 VISTA DETALLADA: Solo se muestra al expandir el widget -->
    <div *ngIf="enModoEnfoque" class="flex-grow-1 overflow-auto mt-3">

        <p class="text-muted mb-4 small">Listado en tiempo real de los usuarios actualmente autenticados en el sistema.
        </p>

        <div class="table-responsive">
            <table class="table table-dark table-hover table-borderless align-middle">
                <thead>
                    <tr class="text-muted text-uppercase small"
                        style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                        <th class="fw-bold ps-2">Usuario</th>
                        <th class="fw-bold">Identificación / Correo</th>
                        <th class="fw-bold text-center">Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Ejemplo de maquetación: Aquí luego iterarías un *ngFor con la lista real -->
                    <tr>
                        <td class="ps-2">
                            <div class="d-flex align-items-center">
                                <div class="bg-primary text-white rounded-circle me-3 d-flex align-items-center justify-content-center fw-bold"
                                    style="width: 36px; height: 36px; font-size: 0.9rem;">
                                    GV
                                </div>
                                <div class="d-flex flex-column">
                                    <span class="fw-bold text-white">German Valencia</span>
                                    <span class="text-muted small">Administrador</span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="d-flex flex-column">
                                <span class="text-white">1110543298</span>
                                <span class="text-muted small">german.valencia&#64;qplus.com</span>
                            </div>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-success bg-opacity-25 text-success border border-success px-3 py-1">En
                                Línea</span>
                        </td>
                    </tr>

                    <tr>
                        <td class="ps-2">
                            <div class="d-flex align-items-center">
                                <div class="bg-info text-white rounded-circle me-3 d-flex align-items-center justify-content-center fw-bold"
                                    style="width: 36px; height: 36px; font-size: 0.9rem;">
                                    CO
                                </div>
                                <div class="d-flex flex-column">
                                    <span class="fw-bold text-white">Claudia Ortiz</span>
                                    <span class="text-muted small">Suscriptor</span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="d-flex flex-column">
                                <span class="text-white">25489632</span>
                                <span class="text-muted small">claudia.ortiz&#64;qplus.com</span>
                            </div>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-success bg-opacity-25 text-success border border-success px-3 py-1">En
                                Línea</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>
