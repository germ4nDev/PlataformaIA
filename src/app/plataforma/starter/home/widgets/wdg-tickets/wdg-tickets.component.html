<app-widget-shell titulo="Tickets de Soporte" icono="feather icon-life-buoy" variante="normal" colorBordeTop="#dc3545"
    [mostrarLinea]="false" [widgetId]="widgetId" [data]="data">

    <ng-template #gridTickets>
        <div class="flex-grow-1 d-flex align-items-center w-100 h-100 mt-2">
            <div class="row text-center w-100 m-0">
                <div class="col-4 border-end">
                    <h2 class="text-danger m-0 fw-bold">{{ ticketsAbiertos }}</h2>
                    <small class="text-muted text-uppercase"
                        style="font-size: 0.7rem; letter-spacing: 0.5px;">Abiertos</small>
                </div>
                <div class="col-4 border-end">
                    <h2 class="text-warning m-0 fw-bold">{{ ticketsEnProceso }}</h2>
                    <small class="text-muted text-uppercase"
                        style="font-size: 0.7rem; letter-spacing: 0.5px;">Proceso</small>
                </div>
                <div class="col-4">
                    <h2 class="text-success m-0 fw-bold">{{ ticketsResueltos }}</h2>
                    <small class="text-muted text-uppercase"
                        style="font-size: 0.7rem; letter-spacing: 0.5px;">Resueltos</small>
                </div>
            </div>
        </div>
    </ng-template>

    <ng-container *ngTemplateOutlet="gridTickets"></ng-container>

    <div modo-enfoque class="w-100 h-100 d-flex flex-column justify-content-center p-2">
        <p class="text-muted text-center mb-4 small">Resumen consolidado del estado de atención al cliente.</p>
        <ng-container *ngTemplateOutlet="gridTickets"></ng-container>
    </div>
</app-widget-shell>
