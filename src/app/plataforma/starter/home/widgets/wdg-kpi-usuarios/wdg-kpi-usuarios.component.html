    <!-- Vista Detallada al expandir -->

        <thead class="text-muted text-uppercase" style="border-bottom: 1px solid rgba(255,255,255,0.05);">
            <tr>
                <th>Nombre</th>
                <th>Rol</th>
                <th class="text-end">Registro</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>German Valencia</td>
                <td>Administrador</td>
                <td class="text-end text-muted">Hoy</td>
            </tr>
            <tr>
                <td>Claudia Ortiz</td>

                <td class="text-end text-muted">Ayer</td>

        </tbody>
