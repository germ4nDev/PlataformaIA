<app-widget-shell [titulo]="widgetConfig?.titulo || ('WEB.WDG_PAQUETES_DGT.DISTRIBUCION_DE_PAQUETES' | translate)"
    [subtitulo]="widgetConfig?.subtitulo || ('WEB.WDG_PAQUETES_DGT.MARKET_SHARE' | translate)" [icono]="widgetConfig?.icono || 'feather icon-pie-chart'"
    [isEnfoque]="isEnfoque" (clickEnfoque)="maximizarDesdeShell()">

    <!-- 🟢 1. PROYECCIÓN AL HEADER DEL SHELL (Badge Morado) -->
    <div acciones-extra class="d-flex align-items-center">
        <span class="tc-badge badge-purple text-uppercase">
            {{ 'WEB.WDG_PAQUETES_DGT.MARKET_SHARE' | translate }}
        </span>
    </div>

    <!-- 🟢 2. CUERPO ÚNICO DEL WIDGET (Chart.js se adapta solo) -->
    <div class="chart-wrapper w-100 h-100 position-relative pb-2">
        <canvas baseChart [data]="doughnutChartData" [options]="doughnutChartOptions" [type]="doughnutChartType">
        </canvas>
    </div>

</app-widget-shell>
