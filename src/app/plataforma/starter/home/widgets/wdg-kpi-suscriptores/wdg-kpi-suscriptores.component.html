<app-widget-shell titulo="TOTAL SUSCRIPTORES" icono="feather icon-briefcase" variante="kpi" colorBordeTop="#0dcaf0"
    [mostrarLinea]="false" [widgetId]="widgetId" [data]="data">

    <ng-container *ngIf="isLoading; else loadedContent">
        <div class="my-auto">
            <div class="skeleton-box skeleton-number mb-2"></div>
        </div>
        <div class="d-flex align-items-center mt-2">
            <div class="skeleton-box skeleton-badge me-2"></div>
            <div class="skeleton-box" style="width: 100px; height: 16px;"></div>
        </div>
    </ng-container>

    <ng-template #loadedContent>
        <div class="text-center">
            <h2 class="valor-kpi">{{ total | number }}</h2>
        </div>
        <div class="d-flex align-items-center text-muted mt-2 animate__animated animate__fadeIn">
            <span class="badge text-dark px-2 py-1 rounded me-2 d-flex align-items-center shadow-sm"
                style="background-color: #0dcaf0; font-size: 0.7rem;">
                <span class="spinner-grow spinner-grow-sm me-1" role="status"
                    style="width: 0.5rem; height: 0.5rem;"></span> En vivo
            </span>
            <span class="opacity-75 text-truncate" style="font-size: 0.75rem;">Sincronizado con BD</span>
        </div>
    </ng-template>

    <div modo-enfoque class="w-100 h-100 p-1">
        <p class="text-muted mb-4 small">Nuevos suscriptores en el periodo actual.</p>
        <ul class="list-unstyled">
            <li class="d-flex align-items-center mb-3">
                <div class="bg-info bg-opacity-10 text-info rounded-circle d-flex justify-content-center align-items-center me-3"
                    style="width: 32px; height: 32px;">
                    <i class="feather icon-user"></i>
                </div>
                <div class="d-flex flex-column">
                    <span class="text-dark fw-bold small">Empresa QPLUS SAS</span>
                    <span class="text-muted" style="font-size: 0.65rem;">Plan Premium</span>
                </div>
            </li>
        </ul>
    </div>
</app-widget-shell>
