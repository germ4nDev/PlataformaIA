<div class="tc-header-layout d-flex align-items-center justify-content-between w-100">

    <!-- Título y Subtítulo a la izquierda -->
    <div class="tc-title-section">
        <h1 class="tc-title">{{ titulo }}</h1>
        <p class="tc-subtitle">{{ subtitulo }}</p>
    </div>

    <!-- Contenedor derecho: Usamos align-items-start para alinear el filtro con la línea de los iconos -->
    <div class="tc-controls-section d-flex align-items-start">
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="tc-filtro-puerto-wrapper mr-4">
                <div class="tc-filtro-puerto">
                    <small class="titulo-filtro">{{ 'TORRE_CONTROL.HEADER.FT_PUERTO' | translate }}</small>
                    <select class="tc-dropdown" [(ngModel)]="nodoSeleccionado" (change)="onCambioNodo($event)">
                        <option *ngFor="let nodo of listaCiudadesPortuarias" [value]="nodo.id_puerto">
                            {{ nodo.id_puerto }}
                        </option>
                    </select>
                </div>
            </div>

            <div class="d-flex flex-column align-items-end">

                <!-- Renglón Superior: Iconos, Herramientas, Idioma, Perfil y Reloj -->
                <ul class="tc-toolbar-nav d-flex align-items-center mb-0 list-unstyled">
                    <li class="nav-item mr-2">
                        <a href="javascript:void(0)" class="toolbar-btn" [hidden]="isOptionBloqueo"
                            (click)="onBloqueoClick()" title="Bloqueo/Desbloqueo">
                            <i class="feather" [ngClass]="isBloqueado ? 'icon-lock' : 'icon-unlock'"></i>
                        </a>
                    </li>

                    <li class="nav-item mr-2">
                        <a href="javascript:void(0)" class="toolbar-btn" (click)="goBack()" title="Menú Principal">
                            <i class="feather icon-home"></i>
                        </a>
                    </li>

                    <li class="nav-item mr-2">
                        <a href="javascript:void(0)" class="toolbar-btn" (click)="abrirCatalogo.emit()"
                            title="Catalogo Widgets">
                            <i class="feather icon-layout"></i>
                        </a>
                    </li>

                    <li class="nav-item mr-2">
                        <app-language-selector></app-language-selector>
                    </li>

                    <li class="nav-item profile-wrapper mr-3">
                        <app-profile-drp></app-profile-drp>
                    </li>

                    <li class="nav-item">
                        <div class="clock-time" class="reloj-style">
                            {{ horaActual }}
                        </div>
                    </li>
                </ul>

                <!-- Renglón Inferior: La Fecha extendida debajo de los iconos y la hora -->
                <div class="clock-date-full" class="fecha-texto">
                    {{ fechaActual }}
                </div>

            </div>
        </div>
    </div>
</div>
