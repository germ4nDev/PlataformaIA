@if (componenteVisual) {
  <ng-container *ngComponentOutlet="componenteVisual; inputs: { data: data, widgetId: type }"> </ng-container>
} @else {
  <div
    class="d-flex flex-column align-items-center justify-content-center h-100 w-100 bg-light text-muted border border-dashed rounded p-3"
  >
    <i class="feather icon-alert-triangle font-24 text-warning mb-2"></i>
    <h6 class="m-0">{{ 'STARTER.HOME.WIDGET_SELECTOR.WIDGET_NOT_IMPLEMENTED' | translate }}</h6>
    <small>[{{ type }}]</small>
  </div>
}
