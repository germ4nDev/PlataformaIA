<div class="plataforma-list-screen">

    <app-full-screen-slider [tipoSlider]="2" class="plataforma-list-bg"></app-full-screen-slider>

    <nav class="navbar fixed-top navbar-expand-lg">
        <div class="container-fluid panel-overlay">
            <a class="navbar-brand" href="#"></a>
            <div class="nav-right">
                <ul class="tc-toolbar-nav d-flex align-items-center mb-0 list-unstyled gap-2">
                    <li class="nav-item">
                        <button (click)="regresar()" class="tc-action-btn"
                            title="{{ 'PLATAFORMA.REGRESARLOGIN' | translate }}">
                            <i class="feather icon-arrow-left"></i>
                        </button>
                    </li>
                    <li class="nav-item">
                        <app-language-selector></app-language-selector>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="plataforma-apps-layout">

        <div class="plataforma-apps-header text-center">
            <h2 class="apps-main-title">{{ 'PLATAFORMA.TITULO_GRID_APLICACIONES' | translate }}</h2>
            <p class="apps-subtitle">{{ 'PLATAFORMA.SUBTITULO_GRID_APLICACIONES' | translate }}</p>
        </div>

        <div class="plataforma-apps-grid">
            <div class="plataforma-app-item-card" *ngFor="let app of aplicaciones"
                [style.backgroundImage]="'url(' + app.imagenInicio + ')'">

                <div class="app-card-overlay">
                    <div class="logo-aplicacion">

                    </div>

                    <div class="app-card-info">
                        <h3 class="app-name">{{ app.nombreAplicacion }}</h3>
                        <p class="app-description" [innerHTML]="app.descripcionAplicacion"></p>
                    </div>

                    <div class="app-card-actions"><br>
                        <button (click)="ingresarPlataforma(app)" class="plataforma-enter-btn">
                            {{ 'PLATAFORMA.ENTRAR' | translate }} <i class="feather icon-arrow-right"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
