<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">{{ 'COMMON.MENU' | translate }}</button>
                <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'">{{ 'COMMON.FILTERS' | translate }}</button>
            </div>
            @if (activeTab === 'menu') {
            <app-nav-content [navigationItems]="menuItems | async"></app-nav-content>
            } @else {
            <div class="p-3 filtros-scroll-wrapper">
                <div class="text-center"><h6 class="filtros-title">{{ 'COMMON.SEARCH_FILTERS' | translate }}</h6></div>
                <div class="filtro">
                    <small>{{ 'COMMON.STATUS' | translate }}</small>
                    <select class="form-control form-select" (change)="alFiltrarEstado($event)">
                        <option value="todos">{{ 'COMMON.ALL' | translate }}</option>
                        <option value="activos">{{ 'COMMON.ACTIVE' | translate }}</option>
                        <option value="inactivos">{{ 'COMMON.INACTIVE' | translate }}</option>
                    </select>
                </div>
                <div class="filtro">
                    <small>{{ 'COMMON.SEARCH' | translate }}</small>
                    <input type="text" class="form-control form-input" (keyup)="alFiltrarTexto($event)"
                        [placeholder]="'UTILIDADES.PAISES.CODE_NAME_OR_CURRENCY' | translate" />
                </div>
            </div>
            }
        </div>
    </aside>
    <div class="content-area">
        <div class="card card-table content-scroll-wrapper">
            <div class="card-body">
                @if (!cargando) {
                <app-table-data [data]="(filtrados$ | async) || []" [idField]="'codigoPais'"
                    [tableTitle]="'UTILIDADES.PAISES.COUNTRIES' | translate"
                    [tableSubtitle]="'UTILIDADES.PAISES.ISO_CODE_CURRENCY_REGIONAL_DATA' | translate"
                    [metadataColumns]="columnas" [showActions]="true" [showNewButton]="true" [showEditButton]="true"
                    [showDeleteButton]="true" [showSearchBox]="false" [newButtonLabel]="'UTILIDADES.PAISES.NEW_COUNTRY' | translate"
                    [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate" (newRecord)="nuevo()" (editRecord)="editar($event)"
                    (deleteRecord)="eliminar($event)" permisoNew="ACT_PAIS_CREAR" permisoEdit="ACT_PAIS_MODIFICAR" permisoDelete="ACT_PAIS_ELIMINAR">
                </app-table-data>
                } @else {
                <app-data-loader [isLoading]="true" [message]="'UTILIDADES.PAISES.LOADING_COUNTRIES' | translate"></app-data-loader>
                }
            </div>
        </div>
    </div>
</div>
