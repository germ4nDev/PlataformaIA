<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
  <aside class="aside-left">
    <div class="card">
      <div class="nav-tabs-custom">
        <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
          {{ 'COMMON.MENU' | translate }}
        </button>
        <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'">
          {{ 'COMMON.FILTERS' | translate }}
        </button>
      </div>

      @if (activeTab === 'menu') {
        <app-nav-content [navigationItems]="menuItems | async"></app-nav-content>
      }
      @if (activeTab === 'filters') {
        <div class="p-3 filtros-scroll-wrapper">
          <DIV class="text-center">
            <h6 class="filtros-title">{{ 'COMMON.SEARCH_FILTERS' | translate }}</h6>
          </DIV>
          <div class="filtro">
            <small>{{ 'COMMON.NAME' | translate }}</small>
            <input
              type="text"
              (keyup)="onFiltroNombreChangeClick($event)"
              class="form-control form-input"
              placeholder="{{ 'COMMON.SEARCH_BY_NAME' | translate }}"
            />
          </div>
          <div class="filtro">
            <small>{{ 'COMMON.STATUS' | translate }}</small>
            <select (change)="onFiltroEstadoChangeClick($event)" class="form-control form-select" required>
              <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
              <option value="true">{{ 'COMMON.ACTIVE' | translate }}</option>
              <option value="false">{{ 'COMMON.INACTIVE' | translate }}</option>
            </select>
          </div>
        </div>
      }
    </div>
  </aside>

  <div class="content-area">
    <div class="card card-table content-scroll-wrapper">
      <div class="card-body">
        @if (idiomasFiltradas$ | async; as dataFiltrada) {
          <app-table-data
            [data]="dataFiltrada"
            [idField]="'codigoIdioma'"
            [tableTitle]="'UTILIDADES.IDIOMAS.LANGUAGE_MANAGEMENT' | translate"
            [tableSubtitle]="'UTILIDADES.IDIOMAS.LANGUAGES_AVAILABLE_ON_PLATFORM' | translate"
            [metadataColumns]="columnasRegistros"
            [metadataDetailColumns]="columnasDetailRegistros"
            [showDetail]="true"
            [showActions]="true"
            [showAvatar]="true"
            [showImage]="false"
            [showNewButton]="true"
            [showViewButton]="false"
            [showEditButton]="true"
            [showDeleteButton]="true"
            [showSearchBox]="false"
            [newButtonLabel]="'UTILIDADES.IDIOMAS.NEW_LANGUAGE' | translate"
            [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate"
            (newRecord)="OnNuevoRegistroClick()"
            (editRecord)="OnEditarRegistroClick($event)"
            (deleteRecord)="OnEliminarRegistroClick($event)"
            permisoNew="ACT_IDIOMAS_CREAR"
            permisoEdit="ACT_IDIOMAS_MODIFICAR"
            permisoDelete="ACT_IDIOMAS_ELIMINAR"
          >
          </app-table-data>
        } @else {
          <app-data-loader [isLoading]="true" message="Cargando Usuarios ..."> </app-data-loader>
        }
      </div>
    </div>
  </div>
</div>
