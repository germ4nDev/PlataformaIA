<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>
                    {{ 'PLATAFORMA.MENU' | translate }}
                </button>
            </div>

            <ng-container>
                <app-nav-content [navigationItems]="menuItems | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">

            <div class="card-header card-header-sticky pb-0 border-bottom-0">
                <div class="d-flex justify-content-between align-items-center mb-3 mt-2">

                    <!-- Bloque Izquierdo: Título Integrado y Subtítulo -->
                    <div class="d-flex flex-column pe-3">
                        <h4 class="titulo-formulario">
                            <span *ngIf="!modoEdicion">{{ 'PLATAFORMA.SLIDERS.NEW' | translate }}</span>
                            <span *ngIf="modoEdicion">{{ 'PLATAFORMA.SLIDERS.UPDATE' | translate }}</span>
                            <span class="titulo-container"> - {{ 'PLATAFORMA.SLIDERS.TITLE' | translate }}</span>
                        </h4>
                        <h6 class="subtitulo-formulario mb-0">
                            {{ 'PLATAFORMA.SLIDERS.TITLEDESCRIPTION' | translate }}
                        </h6>
                    </div>

                    <!-- Bloque Derecho: Botones con Spinners -->
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro" (click)="btnRegresarClick()">
                            {{ 'PLATAFORMA.REGRESAR' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'PLATAFORMA.SLIDERS.CREATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'PLATAFORMA.SLIDERS.UPDATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
                <hr class="mb-0"><br>
            </div>

            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombreAplicacion">{{ 'PLATAFORMA.SLIDERS.NAME' |
                                    translate }}</label>
                                <input class="form-control form-input" id="nombreSlider" name="nombreSlider" type="text"
                                    placeholder="{{ 'PLATAFORMA.SLIDERS.NAME' | translate }}"
                                    [ngClass]="{'is-invalid': !nombreSlider.valid && (nombreSlider.dirty || nombreSlider.touched || isSubmit)}"
                                    #nombreSlider="ngModel" required [(ngModel)]="FormRegistro.nombreSlider" />
                                <label
                                    *ngIf="!nombreSlider.valid && (nombreSlider.dirty || nombreSlider.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PLATAFORMA.SLIDERS.NAMEHOLDER' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoAplicacion"> {{
                                    'MODULOS.GESTION.APLICACION' | translate }}</label>
                                <select class="form-control form-input" style="cursor: pointer" name="codigoAplicacion"
                                    id="codigoAplicacion"
                                    [ngClass]="{ 'is-invalid': !codigoAplicacion.valid && (codigoAplicacion.dirty || codigoAplicacion.touched || isSubmit) }"
                                    #codigoAplicacion="ngModel" required [(ngModel)]="FormRegistro.codigoAplicacion"
                                    (change)="onAplicacionChangeClick($event)">
                                    <option value="">{{ 'MODULOS.GESTION.PLACEHOLDERAPLICACION' | translate }} </option>
                                    <option [value]="app.codigoAplicacion" *ngFor="let app of apps"> {{
                                        app.nombreAplicacion }}</option>
                                </select>
                                <label
                                    *ngIf="!codigoAplicacion.valid && (codigoAplicacion.dirty || codigoAplicacion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'MODULOS.GESTION.REQUERIDOAPLICACION' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'PLATAFORMA.SLIDERS.DESCRIPTION' | translate }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcionSlider ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionVersion($event)" name="descripcionSlider"
                                    [(ngModel)]="FormRegistro.descripcionSlider"
                                    [ngClass]="{'is-invalid': !descripcionSlider.valid && (descripcionSlider.dirty || descripcionSlider.touched || isSubmit)}"
                                    #descripcionSlider="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcionSlider.valid && (descripcionSlider.dirty || descripcionSlider.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PLATAFORMA.SLIDERS.DESCRIPCIONHOLDER' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'PLATAFORMA.SLIDERS.GESTION.FOTO' | translate }}</label>
                                <br>
                                <img *ngIf="selectedFileUrl" [src]="selectedFileUrl" class="avatar-preview" />
                                <input type="file" #fileInput id="fotoUsuario" style="display: none;" accept="image/*"
                                    (change)="onFileSelectedClick($event)">
                                <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                                    (click)="fileInput.click()">
                                    <i class="feather icon-upload me-2"></i> <!-- Opcional: un icono -->
                                    {{ 'PLATAFORMA.SELECTFILE' | translate }}
                                </button>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'PLATAFORMA.SLIDERS.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="option" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estadoSlider">
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'PLATAFORMA.ACTIVE' | translate }}</span>
                                    </label>

                                    <label class="radio-button">
                                        <input name="option" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estadoSlider">
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'PLATAFORMA.INACTIVE' | translate }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
