<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
  <aside class="aside-left">
    <div class="card">
      <div class="nav-tabs-custom">
        <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
          {{ 'COMMON.MENU' | translate }}
        </button>
        <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'">
          {{ 'COMMON.FILTERS' | translate }}
        </button>
      </div>

      @if (activeTab === 'menu') {
        <app-nav-content [navigationItems]="menuItems | async"></app-nav-content>
      }
      @if (activeTab === 'filters') {
        <div class="p-3 filtros-scroll-wrapper">
          <DIV class="text-center">
            <h6 class="filtros-title">{{ 'COMMON.FILTERS' | translate }}</h6>
          </DIV>
          <div class="filtro">
            <small>{{ 'UTILIDADES.COLORES_NAV.STATUS_FILTER' | translate }}</small>
            <select (change)="onFiltroEstadoChangeClick($event)" class="form-control form-select" required>
              <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
              <option value="true">{{ 'COMMON.ACTIVE' | translate }}</option>
              <option value="false">{{ 'COMMON.INACTIVE' | translate }}</option>
            </select>
          </div>
        </div>
      }
    </div>
  </aside>

  <div class="content-area">
    <div class="card card-table content-scroll-wrapper">
      <div class="card-body">
        <app-table-data
          [data]="registrosFiltrado"
          [idField]="'colorNavId'"
          [tableTitle]="'UTILIDADES.COLORES_NAV.COLOR_SETTINGS' | translate"
          [tableSubtitle]="'UTILIDADES.COLORES_NAV.NAVIGATION_BAR_COLORS_BY_APPLICATION' | translate"
          [metadataColumns]="columnasRegistros"
          [detailColumns]="[]"
          [detailTitles]="[]"
          [showDetail]="false"
          [showActions]="true"
          [showAvatar]="false"
          [showImage]="false"
          [showNewButton]="true"
          [showViewButton]="false"
          [showEditButton]="true"
          [showDeleteButton]="true"
          [showSearchBox]="false"
          [newButtonLabel]="'UTILIDADES.COLORES_NAV.NEW_COLOR_SETTINGS' | translate"
          [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate"
          (newRecord)="OnNuevoRegistroClick()"
          (editRecord)="OnEditarRegistroClick($event)"
          (deleteRecord)="OnEliminarRegistroClick($event)"
          permisoNew="ACT_COLORES_CREAR"
          permisoEdit="ACT_COLORES_MODIFICAR"
          permisoDelete="ACT_COLORES_ELIMINAR"
        >
        </app-table-data>
      </div>
    </div>
  </div>
</div>
