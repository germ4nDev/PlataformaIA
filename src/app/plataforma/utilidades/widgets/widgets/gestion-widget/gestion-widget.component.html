<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>{{ 'COMMON.MENU' | translate }}</button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>
    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky pb-0 border-bottom-0">
                <div class="d-flex justify-content-between align-items-center mb-3 mt-2">

                    <!-- Bloque Izquierdo: Título Integrado y Subtítulo -->
                    <div class="d-flex flex-column pe-3">
                        <h4 class="titulo-formulario">
                            <span *ngIf="!modoEdicion">{{ 'COMMON.NEW_WIDGET' | translate }}</span>
                            <span *ngIf="modoEdicion">{{ 'COMMON.UPDATE' | translate }}</span>
                            <span class="titulo-container"> - {{ 'UTILIDADES.WIDGETS.WIDGETS' | translate }}</span>
                        </h4>
                        <h6 class="subtitulo-formulario mb-0">
                            {{ 'UTILIDADES.WIDGETS.GESTION.WIDGET_DETAILS_CATALOG_CHANNEL_IMAGES_INITIAL' | translate }}
                        </h6>
                    </div>

                    <!-- Bloque Derecho: Botones con Spinners -->
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnRegresarClick()">
                            {{ 'COMMON.BACK' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'COMMON.CREATE_WIDGET' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'UTILIDADES.WIDGETS.GESTION.SAVE_CHANGES' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
                <hr class="mb-0"><br>
            </div>

            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.WIDGET_CODE' | translate }}</label>
                                <input type="text" class="form-control form-input" name="codigoWidget"
                                    placeholder="{{ 'UTILIDADES.WIDGETS.GESTION.E_G_PTT_MAE_RESUMEN_UNIQUE' | translate }}"
                                    [ngClass]="{ 'is-invalid': !codigoWidget.valid && (codigoWidget.dirty || codigoWidget.touched || isSubmit) }"
                                    #codigoWidget="ngModel" required [(ngModel)]="FormRegistro.codigoWidget" />
                                <label
                                    *ngIf="!codigoWidget.valid && (codigoWidget.dirty || codigoWidget.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PLATAFORMA.REQUIRED | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombreWidget">{{
                                    'COMMON.NAME' | translate }}</label>
                                <input class="form-control form-input" id="nombreWidget" name="nombreWidget" type="text"
                                    placeholder="{{ 'UTILIDADES.WIDGETS.GESTION.NAME_SHOWN_USERS' | translate }}"
                                    [ngClass]="{ 'is-invalid': !nombreWidget.valid && (nombreWidget.dirty || nombreWidget.touched || isSubmit) }"
                                    #nombreWidget="ngModel" required [(ngModel)]="FormRegistro.nombreWidget" />
                                <label
                                    *ngIf="!nombreWidget.valid && (nombreWidget.dirty || nombreWidget.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'UTILIDADES.WIDGETS.GESTION.NAME_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoTipo">{{
                                    'UTILIDADES.WIDGETS.GESTION.WIDGET_TYPE' | translate }}</label>
                                <select class="form-control form-select" style="cursor: pointer;" name="codigoTipo"
                                    id="codigoTipo"
                                    [ngClass]="{ 'is-invalid': !codigoTipo.valid && (codigoTipo.dirty || codigoTipo.touched || isSubmit) }"
                                    #codigoTipo="ngModel" required [(ngModel)]="FormRegistro.codigoTipo"
                                    (change)="onCodigoTipoClick($event)">
                                    <option value="" disabled>{{ 'UTILIDADES.WIDGETS.GESTION.SELECT_TYPE' | translate }}
                                    </option>
                                    <option [value]="tipo.codigoTipo" *ngFor="let tipo of tiposWidget">{{tipo.nombreTipo
                                        }}</option>
                                </select>
                                <label *ngIf="!codigoTipo.valid && (codigoTipo.dirty || codigoTipo.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'UTILIDADES.WIDGETS.GESTION.SELECT_WIDGET_TYPE_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="defaultCols">{{
                                    'UTILIDADES.WIDGETS.GESTION.COLUMNS_1_12' | translate }}</label>
                                <input class="form-control form-input" id="defaultCols" name="defaultCols" type="number"
                                    placeholder="{{ 'UTILIDADES.WIDGETS.GESTION.WIDTH_IN_COLUMNS' | translate }}"
                                    [ngClass]="{ 'is-invalid': !defaultCols.valid && (defaultCols.dirty || defaultCols.touched || isSubmit) }"
                                    #defaultCols="ngModel" required [(ngModel)]="FormRegistro.defaultCols" />
                                <label
                                    *ngIf="!defaultCols.valid && (defaultCols.dirty || defaultCols.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'UTILIDADES.WIDGETS.GESTION.COLUMNS_ARE_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="defaultRows">{{
                                    'UTILIDADES.WIDGETS.ROWS' | translate }}</label>
                                <input class="form-control form-input" id="defaultRows" name="defaultRows" type="number"
                                    placeholder="{{ 'UTILIDADES.WIDGETS.GESTION.HEIGHT_IN_ROWS' | translate }}"
                                    [ngClass]="{ 'is-invalid': !defaultRows.valid && (defaultRows.dirty || defaultRows.touched || isSubmit) }"
                                    #defaultRows="ngModel" required [(ngModel)]="FormRegistro.defaultRows" />
                                <label
                                    *ngIf="!defaultRows.valid && (defaultRows.dirty || defaultRows.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'UTILIDADES.WIDGETS.GESTION.ROWS_ARE_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="pos_x">{{
                                    'UTILIDADES.WIDGETS.X_POSITION' | translate }}</label>
                                <input class="form-control form-input" id="pos_x" name="pos_x" type="number"
                                    placeholder="{{ 'UTILIDADES.WIDGETS.GESTION.STARTING_COLUMN_0_11' | translate }}"
                                    [ngClass]="{ 'is-invalid': !pos_x.valid && (pos_x.dirty || pos_x.touched || isSubmit) }"
                                    #pos_x="ngModel" required [(ngModel)]="FormRegistro.pos_x" />
                                <label *ngIf="!pos_x.valid && (pos_x.dirty || pos_x.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'UTILIDADES.WIDGETS.GESTION.X_POSITION_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="pos_y">{{
                                    'UTILIDADES.WIDGETS.Y_POSITION' | translate }}</label>
                                <input class="form-control form-input" id="pos_y" name="pos_y" type="number"
                                    placeholder="{{ 'UTILIDADES.WIDGETS.GESTION.STARTING_ROW' | translate }}"
                                    [ngClass]="{ 'is-invalid': !pos_y.valid && (pos_y.dirty || pos_y.touched || isSubmit) }"
                                    #pos_y="ngModel" required [(ngModel)]="FormRegistro.pos_y" />
                                <label *ngIf="!pos_y.valid && (pos_y.dirty || pos_y.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'UTILIDADES.WIDGETS.GESTION.Y_POSITION_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="anclajeTipo">{{
                                    'UTILIDADES.WIDGETS.GESTION.ANCHORING' | translate }}</label>
                                <!-- Anclaje: solo dos valores en el catálogo (antes texto libre; OT-015, CC-114) -->
                                <select class="form-control form-select" id="anclajeTipo" name="anclajeTipo"
                                    [ngClass]="{ 'is-invalid': !anclajeTipo.valid && (anclajeTipo.dirty || anclajeTipo.touched || isSubmit) }"
                                    #anclajeTipo="ngModel" required [(ngModel)]="FormRegistro.anclajeTipo">
                                    <option value="" disabled>{{ 'UTILIDADES.WIDGETS.GESTION.SELECT_ANCHORING' | translate }}</option>
                                    <option value="ABSOLUTO">{{ 'UTILIDADES.WIDGETS.GESTION.ABSOLUTE_FIXED_POSITION_ON_GRID' | translate }}
                                    </option>
                                    <option value="RELATIVO">{{ 'UTILIDADES.WIDGETS.GESTION.RELATIVE_FLOWS_BELOW_PREVIOUS_ONES' | translate }}
                                    </option>
                                </select>
                                <label
                                    *ngIf="!anclajeTipo.valid && (anclajeTipo.dirty || anclajeTipo.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'UTILIDADES.WIDGETS.GESTION.ANCHORING_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="offsetY">{{
                                    'UTILIDADES.WIDGETS.GESTION.Y_OFFSET' | translate }}</label>
                                <input class="form-control form-input" id="offsetY" name="offsetY" type="number"
                                    placeholder="{{ 'UTILIDADES.WIDGETS.GESTION.ROWS_SEPARATION_0_12' | translate }}"
                                    [ngClass]="{ 'is-invalid': !offsetY.valid && (offsetY.dirty || offsetY.touched || isSubmit) }"
                                    #offsetY="ngModel" required [(ngModel)]="FormRegistro.offsetY" />
                                <label *ngIf="!offsetY.valid && (offsetY.dirty || offsetY.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'UTILIDADES.WIDGETS.GESTION.OFFSET_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="layoutVersion">{{
                                    'UTILIDADES.WIDGETS.GESTION.LAYOUT_VERSION' | translate }}</label>
                                <input class="form-control form-input" id="layoutVersion" name="layoutVersion"
                                    type="number" placeholder="{{ 'UTILIDADES.WIDGETS.GESTION.INCREASES_ON_SAVE' | translate }}"
                                    [ngClass]="{ 'is-invalid': !layoutVersion.valid && (layoutVersion.dirty || layoutVersion.touched || isSubmit) }"
                                    #layoutVersion="ngModel" required [(ngModel)]="FormRegistro.layoutVersion" />
                                <label
                                    *ngIf="!layoutVersion.valid && (layoutVersion.dirty || layoutVersion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'UTILIDADES.WIDGETS.GESTION.VERSION_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoPestana">{{
                                    'COMMON.TAB' | translate }}</label>
                                <select class="form-control form-select" style="cursor: pointer;" name="codigoPestana"
                                    id="codigoPestana"
                                    [ngClass]="{ 'is-invalid': !codigoPestana.valid && (codigoPestana.dirty || codigoPestana.touched || isSubmit) }"
                                    #codigoPestana="ngModel" required [(ngModel)]="FormRegistro.codigoPestana"
                                    (change)="onCodigoPestanaClick($event)">
                                    <option value="" disabled>{{ 'UTILIDADES.WIDGETS.GESTION.SELECT_TAB' | translate
                                        }}
                                    </option>
                                    <option [value]="tipo.codigoPestana" *ngFor="let tipo of pestanas">
                                        {{tipo.nombrePestana
                                        }}</option>
                                </select>
                                <label
                                    *ngIf="!codigoPestana.valid && (codigoPestana.dirty || codigoPestana.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'UTILIDADES.WIDGETS.GESTION.SELECT_TAB_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.DESCRIPTION' | translate
                                    }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcionWidget ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionRegistro($event)" name="descripcionWidget"
                                    [(ngModel)]="FormRegistro.descripcionWidget" [ngClass]="{
                                        'is-invalid': !descripcionWidget.valid && (descripcionWidget.dirty || descripcionWidget.touched || isSubmit)
                                    }" #descripcionWidget="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcionWidget.valid && (descripcionWidget.dirty || descripcionWidget.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'UTILIDADES.WIDGETS.GESTION.DESCRIPTION_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'UTILIDADES.WIDGETS.IMAGE_LIGHT_THEME' | translate
                                    }}</label>
                                <br>
                                <img *ngIf="selectedFileUrl" [src]="selectedFileUrl" class="image-preview" />
                                <input type="file" #fileInput id="imagenWidget_light" style="display: none;"
                                    accept="image/*" (change)="onFileSelectedClick($event)">
                                <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                                    (click)="fileInput.click()">
                                    <i class="feather icon-upload me-2"></i>
                                    {{ 'COMMON.SELECT_FILE' | translate }}
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'UTILIDADES.WIDGETS.IMAGE_DARK_THEME' | translate
                                    }}</label>
                                <br>
                                <img *ngIf="selectedFileUrlDark" [src]="selectedFileUrlDark" class="image-preview" />
                                <!-- Referencia propia: con #fileInput repetido, este botón abría el selector de la imagen clara -->
                                <input type="file" #fileInputDark id="imagenWidget_dark" style="display: none;"
                                    accept="image/*" (change)="onFileSelectedDarkClick($event)">
                                <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                                    (click)="fileInputDark.click()">
                                    <i class="feather icon-upload me-2"></i>
                                    {{ 'COMMON.SELECT_FILE' | translate }}
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'UTILIDADES.WIDGETS.GESTION.IN_INITIAL_LAYOUT' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="inicial" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.inicial" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.YES' | translate }}</span>
                                    </label>
                                    <label class="radio-button">
                                        <input name="inicial" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.inicial" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.NO' | translate }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estadoWidget" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estadoWidget" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.ACTIVE' | translate }}</span>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estadoWidget" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estadoWidget" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.INACTIVE' | translate }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Canal (migración 030, OT-017): web y tableta, solo teléfono o los tres equipos.
                             Los roles se asignan igual en «Widgets por rol». -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'UTILIDADES.WIDGETS.GESTION.WIDGET_CHANNEL' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="canal" type="radio" value="web"
                                            [(ngModel)]="FormRegistro.canal" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'UTILIDADES.WIDGETS.WEB_TABLET' | translate }}</span>
                                    </label>
                                    <label class="radio-button">
                                        <input name="canal" type="radio" value="telefono"
                                            [(ngModel)]="FormRegistro.canal" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.PHONE' | translate }}</span>
                                    </label>
                                    <label class="radio-button">
                                        <input name="canal" type="radio" value="ambos"
                                            [(ngModel)]="FormRegistro.canal" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'UTILIDADES.WIDGETS.ALL_WEB_TABLET_PHONE' | translate }}</span>
                                    </label>
                                </div>
                                <small class="text-muted">{{ 'UTILIDADES.WIDGETS.GESTION.WEB_TABLET_NOT_SHOWN_ON_PHONES' | translate }}</small>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
