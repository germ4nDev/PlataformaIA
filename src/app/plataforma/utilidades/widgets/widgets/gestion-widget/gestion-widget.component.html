<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>{{ 'PLATAFORMA.MENU' | translate }}</button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>
    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky">
                <div class="dt-toolbar d-flex justify-content-between align-items-center mb-2">
                    <div class="d-flex align-items-center">
                        <h4 class="datatable-title" *ngIf="!modoEdicion">{{ 'WIDGETS.NEW' | translate }}</h4>
                        <h4 class="datatable-title" *ngIf="modoEdicion">{{ 'WIDGETS.UPDATE' | translate }}
                        </h4>
                    </div>
                    <div class="d-flex">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnRegresarClick()">
                            {{ 'PLATAFORMA.REGRESAR' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'WIDGETS.GESTION.CREATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'WIDGETS.GESTION.UPDATE' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'WIDGETS.GESTION.CODE' | translate }}</label>
                                <input type="text" class="form-control form-input" name="codigoWidget"
                                    placeholder="{{ 'WIDGETS.GESTION.CODEHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !codigoWidget.valid && (codigoWidget.dirty || codigoWidget.touched || isSubmit) }"
                                    #codigoWidget="ngModel" required [(ngModel)]="FormRegistro.codigoWidget" />
                                <label
                                    *ngIf="!codigoWidget.valid && (codigoWidget.dirty || codigoWidget.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'PLATAFORMA.REQUIRED | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombreWidget">{{
                                    'WIDGETS.GESTION.NAME' | translate }}</label>
                                <input class="form-control form-input" id="nombreWidget" name="nombreWidget" type="text"
                                    placeholder="{{ 'WIDGETS.GESTION.NAMEHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !nombreWidget.valid && (nombreWidget.dirty || nombreWidget.touched || isSubmit) }"
                                    #nombreWidget="ngModel" required [(ngModel)]="FormRegistro.nombreWidget" />
                                <label
                                    *ngIf="!nombreWidget.valid && (nombreWidget.dirty || nombreWidget.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'WIDGETS.GESTION.REQUERIDONAME' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="defaultCols">{{
                                    'WIDGETS.GESTION.COLUMNAS' | translate }}</label>
                                <input class="form-control form-input" id="defaultCols" name="defaultCols" type="number"
                                    placeholder="{{ 'WIDGETS.GESTION.COLUMNASHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !defaultCols.valid && (defaultCols.dirty || defaultCols.touched || isSubmit) }"
                                    #defaultCols="ngModel" required [(ngModel)]="FormRegistro.defaultCols" />
                                <label
                                    *ngIf="!defaultCols.valid && (defaultCols.dirty || defaultCols.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'WIDGETS.GESTION.REQUERIDOCOLUMNAS' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="defaultRows">{{
                                    'WIDGETS.GESTION.FILAS' | translate }}</label>
                                <input class="form-control form-input" id="defaultRows" name="defaultRows" type="number"
                                    placeholder="{{ 'WIDGETS.GESTION.FILASHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !defaultRows.valid && (defaultRows.dirty || defaultRows.touched || isSubmit) }"
                                    #defaultRows="ngModel" required [(ngModel)]="FormRegistro.defaultRows" />
                                <label
                                    *ngIf="!defaultRows.valid && (defaultRows.dirty || defaultRows.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'WIDGETS.GESTION.REQUERIDOFILAS' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="pos_x">{{
                                    'WIDGETS.GESTION.POSX' | translate }}</label>
                                <input class="form-control form-input" id="pos_x" name="pos_x" type="number"
                                    placeholder="{{ 'WIDGETS.GESTION.POSXHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !pos_x.valid && (pos_x.dirty || pos_x.touched || isSubmit) }"
                                    #pos_x="ngModel" required [(ngModel)]="FormRegistro.pos_x" />
                                <label *ngIf="!pos_x.valid && (pos_x.dirty || pos_x.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'WIDGETS.GESTION.REQUERIDOPOSX' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="pos_y">{{
                                    'WIDGETS.GESTION.POSY' | translate }}</label>
                                <input class="form-control form-input" id="pos_y" name="pos_y" type="number"
                                    placeholder="{{ 'WIDGETS.GESTION.POSYHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !pos_y.valid && (pos_y.dirty || pos_y.touched || isSubmit) }"
                                    #pos_y="ngModel" required [(ngModel)]="FormRegistro.pos_y" />
                                <label *ngIf="!pos_y.valid && (pos_y.dirty || pos_y.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'WIDGETS.GESTION.REQUERIDOPOSY' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="tipo">{{
                                    'WIDGETS.GESTION.TIPO' | translate }}</label>
                                <input class="form-control form-input" id="tipo" name="tipo" type="text"
                                    placeholder="{{ 'WIDGETS.GESTION.TIPOHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !tipo.valid && (tipo.dirty || tipo.touched || isSubmit) }"
                                    #tipo="ngModel" required [(ngModel)]="FormRegistro.tipo" />
                                <label *ngIf="!tipo.valid && (tipo.dirty || tipo.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'WIDGETS.GESTION.REQUERIDOTIPO' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="pestana">{{
                                    'WIDGETS.GESTION.PESTANA' | translate }}</label>
                                <input class="form-control form-input" id="pestana" name="pestana" type="text"
                                    placeholder="{{ 'WIDGETS.GESTION.PESTANAHOLDER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !pestana.valid && (pestana.dirty || pestana.touched || isSubmit) }"
                                    #pestana="ngModel" required [(ngModel)]="FormRegistro.pestana" />
                                <label *ngIf="!pestana.valid && (pestana.dirty || pestana.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'WIDGETS.GESTION.REQUERIDOPESTANA' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'WIDGETS.GESTION.DESCRIPTION' | translate
                                    }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcionWidget ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionRegistro($event)" name="descripcionWidget"
                                    [(ngModel)]="FormRegistro.descripcionWidget" [ngClass]="{
                                        'is-invalid': !descripcionWidget.valid && (descripcionWidget.dirty || descripcionWidget.touched || isSubmit)
                                    }" #descripcionWidget="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcionWidget.valid && (descripcionWidget.dirty || descripcionWidget.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'WIDGETS.GESTION.REQUERIDODESCRIPTION' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'WIDGETS.GESTION.IMAGENLIGHT' | translate
                                    }}</label>
                                <br>
                                <img *ngIf="selectedFileUrl" [src]="selectedFileUrl" class="image-preview" />
                                <input type="file" #fileInput id="imagenWidget_light" style="display: none;"
                                    accept="image/*" (change)="onFileSelectedClick($event)">
                                <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                                    (click)="fileInput.click()">
                                    <i class="feather icon-upload me-2"></i> <!-- Opcional: un icono -->
                                    {{ 'PLATAFORMA.SELECTFILE' | translate }}
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'WIDGETS.GESTION.IMAGENDARK' | translate
                                    }}</label>
                                <br>
                                <img *ngIf="selectedFileUrlDark" [src]="selectedFileUrlDark" class="image-preview" />
                                <input type="file" #fileInput id="imagenWidget_dark" style="display: none;"
                                    accept="image/*" (change)="onFileSelectedDarkClick($event)">
                                <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                                    (click)="fileInput.click()">
                                    <i class="feather icon-upload me-2"></i> <!-- Opcional: un icono -->
                                    {{ 'PLATAFORMA.SELECTFILE' | translate }}
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'WIDGETS.GESTION.INICAL' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="inicial" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.inicial" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.INICIAL' | translate }}</label>
                                    </label>
                                    <label class="radio-button">
                                        <input name="inicial" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.inicial" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.NOINICIAL' | translate }}</label>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'WIDGETS.GESTION.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="estadoWidget" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estadoWidget" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.ACTIVE' | translate }}</label>
                                    </label>
                                    <label class="radio-button">
                                        <input name="estadoWidget" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estadoWidget" />
                                        <div class="radio-circle"></div>
                                        <label class="radio-label">{{ 'PLATAFORMA.INACTIVE' | translate }}</label>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
