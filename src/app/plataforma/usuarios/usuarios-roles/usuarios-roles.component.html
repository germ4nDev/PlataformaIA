<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
  <aside class="aside-left">
    <div class="card">
      <div class="nav-tabs-custom">
        <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
          {{ 'COMMON.MENU' | translate }}
        </button>
        <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'">
          {{ 'COMMON.FILTERS' | translate }}
        </button>
      </div>

      @if (activeTab === 'menu') {
        <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
      }

      @if (activeTab === 'filters') {
        <div class="p-3 filtros-scroll-wrapper">
          <div class="text-center">
            <h6 class="filtros-title">{{ 'USUARIOS.USUARIOS_ROLES.FILTER_USERS' | translate }}</h6>
          </div>
          <div class="filtro">
            <small>{{ 'COMMON.SUBSCRIBER' | translate }}</small>
            <select (change)="onFiltroSuscriptorChangeClick($event)" class="form-control form-select" style="cursor: pointer">
              <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
              @for (sus of suscriptores; track sus) {
                <option [value]="sus.codigoSuscriptor">
                  {{ sus.nombreSuscriptor }}
                </option>
              }
            </select>
          </div>
          <div class="filtro">
            <small>{{ 'COMMON.STATUS' | translate }}</small>
            <select (change)="onFiltroEstadoChangeClick($event)" class="form-control form-select" style="cursor: pointer">
              <option value="todos">{{ 'COMMON.SHOW_ALL' | translate }}</option>
              <option value="true">{{ 'COMMON.ACTIVE' | translate }}</option>
              <option value="false">{{ 'COMMON.INACTIVE' | translate }}</option>
            </select>
          </div>
        </div>
      }
    </div>
  </aside>

  <div class="content-area">
    <div class="card card-table content-scroll-wrapper">
      <div class="card-body">
        @if (registrosFiltrado$ | async; as dataFiltrada) {
          <app-table-data
            [data]="dataFiltrada"
            [idField]="'codigoUsuarioRole'"
            [tableTitle]="tituloPagina"
            [exportLabel]="'COMMON.DOWNLOAD_EXCEL' | translate"
            [metadataColumns]="columnasRegistros"
            [metadataDetailColumns]="columnasDetailRegistros"
            [showDetail]="true"
            [showActions]="true"
            [showNewButton]="true"
            [showViewButton]="false"
            [showEditButton]="false"
            [showDeleteButton]="true"
            [showSearchBox]="false"
            [showBackButton]="true"
            [newButtonLabel]="'USUARIOS.NEW_USER_ROLE' | translate"
            (newRecord)="OnNuevoRegistroClick()"
            (deleteRecord)="OnEliminarRegistroClick($event)"
            (accionPrincipalClick)="onAccionPrincipal($event)"
            (backRecord)="OnRegresarClick($event)"
            permisoNew="ACT_USUSC_ROLES"
            permisoDelete="ACT_USUSC_ROLES"
          >
          </app-table-data>
        } @else {
          <app-data-loader [isLoading]="true" message="Cargando Usuarios ..."> </app-data-loader>
        }
        <ng-template #loading>
          <app-data-loader [isLoading]="true" message="Cargando Usuarios ..."> </app-data-loader>
        </ng-template>
      </div>
    </div>
  </div>
</div>
