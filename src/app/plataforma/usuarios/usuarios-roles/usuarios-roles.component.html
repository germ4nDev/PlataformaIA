<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button [class.active]="activeTab === 'menu'" (click)="activeTab = 'menu'">
                    {{ 'PLATAFORMA.MENU' | translate }}
                </button>
                <button [class.active]="activeTab === 'filters'" (click)="activeTab = 'filters'">
                    {{ 'PLATAFORMA.FILTERS' | translate }}
                </button>
            </div>

            <ng-container *ngIf="activeTab === 'menu'">
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>

            <ng-container *ngIf="activeTab === 'filters'">
                <div class="p-3 filtros-scroll-wrapper">
                    <div class="text-center">
                        <h6 class="filtros-title">Filtrar Usuarios</h6>
                    </div>

                    <div class="filtro">
                        <small>Suscriptor</small>
                        <select (change)="onFiltroSuscriptorChangeClick($event)" class="form-control form-select"
                            style="cursor: pointer">
                            <option value="todos">{{ 'PLATAFORMA.FILTROTODOS' | translate }}</option>
                            <option [value]="sus.codigoSuscriptor" *ngFor="let sus of suscriptores">
                                {{ sus.nombreSuscriptor }}
                            </option>
                        </select>
                    </div>

                    <div class="filtro">
                        <small>{{ 'USUARIOS.USUARIOSROLES.FILTROS.ESTADO' | translate }}</small>
                        <select (change)="onFiltroEstadoChangeClick($event)" class="form-control form-select"
                            style="cursor: pointer">
                            <option value="todos">{{ 'PLATAFORMA.FILTROTODOS' | translate }}</option>
                            <option value="true">{{ 'PLATAFORMA.ACTIVE' | translate }}</option>
                            <option value="false">{{ 'PLATAFORMA.INACTIVE' | translate }}</option>
                        </select>
                    </div>
                </div>
            </ng-container>
        </div>
    </aside>

    <div class="content-area">
        <div class="card card-table content-scroll-wrapper">
            <div class="card-body">
                <ng-container *ngIf="registrosFiltrado$ | async as dataFiltrada; else loading">
                    <app-table-data [data]="dataFiltrada" [idField]="'codigoUsuarioRole'" [tableTitle]="tituloPagina"
                        [exportLabel]="'PLATAFORMA.EXCEL' | translate" [metadataColumns]="columnasRegistros"
                        [metadataDetailColumns]="columnasDetailRegistros" [showDetail]="true" [showActions]="true"
                        [showNewButton]="true" [showViewButton]="false" [showEditButton]="false"
                        [showDeleteButton]="true" [showSearchBox]="false" [showBackButton]="true"
                        [newButtonLabel]="'USUARIOS.USUARIOSROLES.NEW' | translate" (newRecord)="OnNuevoRegistroClick()"
                        (deleteRecord)="OnEliminarRegistroClick($event)"
                        (accionPrincipalClick)="onAccionPrincipal($event)" (backRecord)="OnRegresarClick($event)">
                    </app-table-data>
                </ng-container>
                <ng-template #loading>
                    <app-data-loader [isLoading]="true" message="Cargando Usuarios ..."> </app-data-loader>
                </ng-template>
            </div>
        </div>
    </div>
</div>
