<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button class="active">{{ 'PLATAFORMA.MENU' | translate }}</button>
            </div>
            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky pb-0 border-bottom-0">
                <div class="d-flex justify-content-between align-items-center mb-3 mt-2">

                    <!-- Bloque Izquierdo: Título Integrado y Subtítulo -->
                    <div class="d-flex flex-column pe-3">
                        <h4 class="titulo-formulario">
                            <span *ngIf="!esNuevo">{{ 'TIPOSCRIPTS.NEW' | translate }}</span>
                            <span *ngIf="esNuevo">{{ 'TIPOSCRIPTS.UPDATE' | translate }}</span>
                            <span class="titulo-container"> - {{ 'TIPOSCRIPTS.TITLE' | translate
                                }}</span>
                        </h4>
                        <h6 class="subtitulo-formulario mb-0">
                            {{ 'TIPOSCRIPTS.TITLEDESCRIPTION' | translate }}
                        </h6>
                    </div>

                    <!-- Bloque Derecho: Botones con Spinners -->
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro" (click)="volver()">
                            {{ 'PLATAFORMA.REGRESAR' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="esNuevo" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="guardar()">
                            {{ 'TIPOSCRIPTS.CREATE' | translate }}
                            <i class="feather ms-2 icon-plus"></i>
                        </button>
                        <button *ngIf="!esNuevo" type="button" class="btn btn-primary btn-NuevoRegistro"
                            (click)="guardar()">
                            {{ 'TIPOSCRIPTS.UPDATE' | translate }}
                            <i class="feather ms-2 icon-edit"></i>
                        </button>
                    </div>
                </div>
                <hr class="mb-0"><br>
            </div>

            <div class="card-body form-scroll-wrapper">
                <form [formGroup]="tipoForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'TIPOSCRIPTS.CODIGO' | translate }} <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control form-input" formControlName="codigoTipo"
                                    [placeholder]="'WEB.GESTION_TIPO.EJ_TIPO_SQL' | translate"
                                    [ngClass]="{ 'is-invalid': campoNoValido('codigoTipo') }" />
                                <label *ngIf="campoNoValido('codigoTipo')"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'WEB.GESTION_TIPO.EL_CODIGO_ES_OBLIGATORIO' | translate }}
                                </label>
                                <small class="text-muted mt-1 d-block" *ngIf="!esNuevo">{{ 'WEB.GESTION_TIPO.EL_CODIGO_NO_SE_PUEDE' | translate }}</small>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label">{{ 'TIPOSCRIPTS.NOMBRE' | translate }} <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control form-input" formControlName="nombreTipo"
                                    [placeholder]="'WEB.GESTION_TIPO.EJ_SCRIPT_DE_BASE_DE' | translate"
                                    [ngClass]="{ 'is-invalid': campoNoValido('nombreTipo') }" />
                                <label *ngIf="campoNoValido('nombreTipo')"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'WEB.COMUN.EL_NOMBRE_ES_OBLIGATORIO' | translate }}
                                </label>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'TIPOSCRIPTS.DESCRIPCION' | translate }}</label>
                                <textarea class="form-control form-input" formControlName="descripcionTipo" rows="3"
                                    [placeholder]="'WEB.GESTION_TIPO.ESCRIBE_UNA_BREVE_DESCRIPCION' | translate"></textarea>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'PLATAFORMA.STATUS' | translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input formControlName="estadoTipo" type="radio" [value]="true" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'PLATAFORMA.ACTIVE' | translate }}</span>
                                    </label>
                                    <label class="radio-button">
                                        <input formControlName="estadoTipo" type="radio" [value]="false" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'PLATAFORMA.INACTIVE' | translate }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
