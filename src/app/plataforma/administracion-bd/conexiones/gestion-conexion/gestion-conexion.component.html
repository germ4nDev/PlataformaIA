<app-nav-bar (toggleSidebar)="toggleNav()"></app-nav-bar>
<div class="layout-wrapper">
    <aside class="aside-left">
        <div class="card">
            <div class="nav-tabs-custom">
                <button>
                    {{ 'COMMON.MENU' | translate }}
                </button>
            </div>

            <ng-container>
                <app-nav-content [navigationItems]="menuItems$ | async"></app-nav-content>
            </ng-container>
        </div>
    </aside>

    <div class="form-area">
        <div class="card">
            <div class="card-header card-header-sticky pb-0 border-bottom-0">
                <div class="d-flex justify-content-between align-items-center mb-3 mt-2">

                    <!-- Bloque Izquierdo: Título Integrado y Subtítulo -->
                    <div class="d-flex flex-column pe-3">
                        <h4 class="titulo-formulario">
                            <span *ngIf="!modoEdicion">{{ 'ADMINISTRACION_BD.CONEXIONES.NEW_CONNECTION' | translate
                                }}</span>
                            <span *ngIf="modoEdicion">{{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.UPDATE_CONNECTION' |
                                translate }}</span>
                            <span class="titulo-container"> - {{
                                'ADMINISTRACION_BD.CONEXIONES.GESTION.CREATE_UPDATE_CONNECTION' | translate
                                }}</span>
                        </h4>
                        <h6 class="subtitulo-formulario mb-0">
                            {{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.CONNECTION_DETAILS' | translate }}
                        </h6>
                    </div>

                    <!-- Bloque Derecho: Botones con Spinners -->
                    <div class="d-flex align-items-center">
                        <button type="button" class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnRegresarClick()">
                            {{ 'COMMON.BACK' | translate }}
                            <i class="feather icon-arrow-left ms-2"></i>
                        </button>
                        <button *ngIf="!modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.CREATE_CONNECTION' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                        <button *ngIf="modoEdicion" type="button"
                            class="btn btn-primary btn-NuevoRegistro btn-animacion"
                            (click)="btnGestionarRegistroClick(validationForm)">
                            {{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.UPDATE_CONNECTION' | translate }}
                            <i class="feather ms-2" [ngClass]="modoEdicion ? 'icon-edit' : 'icon-plus'"></i>
                        </button>
                    </div>
                </div>
                <hr class="mb-0"><br>
            </div>

            <div class="card-body form-scroll-wrapper">
                <form #validationForm="ngForm" class="editForm" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="suscriptorId">{{ 'COMMON.SUBSCRIBER'
                                    | translate }}</label>
                                <select class="form-control form-select" style="cursor: pointer" name="codigoSuscriptor"
                                    id="codigoSuscriptor"
                                    [ngClass]="{ 'is-invalid': !codigoSuscriptor.valid && (codigoSuscriptor.dirty || codigoSuscriptor.touched || isSubmit) }"
                                    #codigoSuscriptor="ngModel" required [(ngModel)]="FormRegistro.codigoSuscriptor"
                                    (change)="onSuscriptorChangeClick($event)">
                                    <option value="" disabled>{{ 'COMMON.SELECT_SUBSCRIBER' | translate
                                        }}</option>
                                    <option [value]="suscriptor.codigoSuscriptor"
                                        *ngFor="let suscriptor of suscriptores">{{ suscriptor.nombreSuscriptor }}
                                    </option>
                                </select>
                                <label
                                    *ngIf="!codigoSuscriptor.valid && (codigoSuscriptor.dirty || codigoSuscriptor.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.SELECT_SUBSCRIBER_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="codigoPaquete">{{ 'COMMON.PACKAGE' |
                                    translate }}</label>
                                <select class="form-control form-select" style="cursor: pointer" name="codigoPaquete"
                                    id="codigoPaquete"
                                    [ngClass]="{ 'is-invalid': !codigoPaquete.valid && (codigoPaquete.dirty || codigoPaquete.touched || isSubmit) }"
                                    #codigoPaquete="ngModel" required [(ngModel)]="FormRegistro.codigoPaquete"
                                    (change)="onPaqueteChangeClick($event)">
                                    <option value="" disabled>{{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.SELECT_PACKAGE' |
                                        translate }}
                                    </option>
                                    <option [value]="paquete.codigoPaquete" *ngFor="let paquete of paquetes">{{
                                        paquete.nomPaquete }}</option>
                                </select>
                                <label
                                    *ngIf="!codigoPaquete.valid && (codigoPaquete.dirty || codigoPaquete.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.SELECT_PACKAGE_FIELD_REQUIRED' | translate
                                    }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombreConexion"> {{
                                    'ADMINISTRACION_BD.CONEXIONES.CONNECTION_NAME' | translate }}</label>
                                <input class="form-control form-input" id="nombreConexion" name="nombreConexion"
                                    type="text"
                                    placeholder="{{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_CONNECTION_NAME' | translate }}"
                                    [ngClass]="{ 'is-invalid': !nombreConexion.valid && (nombreConexion.dirty || nombreConexion.touched || isSubmit) }"
                                    #nombreConexion="ngModel" required [(ngModel)]="FormRegistro.nombreConexion" />
                                <label
                                    *ngIf="!nombreConexion.valid && (nombreConexion.dirty || nombreConexion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_SERVER_CONNECTION_FIELD_REQUIRED' |
                                    translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">{{ 'COMMON.CODE' | translate }}</label>
                                <input type="text" class="form-control form-input" name="codigoConexion"
                                    [placeholder]="'ADMINISTRACION_BD.CONEXIONES.GESTION.CONNECTION_CODE_2' | translate"
                                    [ngClass]="{ 'is-invalid': !codigoConexion.valid && (codigoConexion.dirty || codigoConexion.touched || isSubmit) }"
                                    #codigoConexion="ngModel" required [(ngModel)]="FormRegistro.codigoConexion"
                                    readonly />
                                <label
                                    *ngIf="!codigoConexion.valid && (codigoConexion.dirty || codigoConexion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.CONNECTION_CODE' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="nombreServidor"> {{
                                    'ADMINISTRACION_BD.CONEXIONES.GESTION.SERVER_NAME' | translate }}</label>
                                <input class="form-control form-input" id="nombreServidor" name="nombreServidor"
                                    type="text"
                                    placeholder="{{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_SERVER_NAME' | translate }}"
                                    [ngClass]="{ 'is-invalid': !nombreServidor.valid && (nombreServidor.dirty || nombreServidor.touched || isSubmit) }"
                                    #nombreServidor="ngModel" required [(ngModel)]="FormRegistro.nombreServidor" />
                                <label
                                    *ngIf="!nombreServidor.valid && (nombreServidor.dirty || nombreServidor.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_SERVER_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="BDNombre"> {{
                                    'ADMINISTRACION_BD.CONEXIONES.DATABASE_NAME' |
                                    translate }}</label>
                                <input class="form-control form-input" id="BDNombre" name="BDNombre" type="text"
                                    placeholder="{{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_DATABASE_NAME' | translate }}"
                                    [ngClass]="{ 'is-invalid': !BDNombre.valid && (BDNombre.dirty || BDNombre.touched || isSubmit) }"
                                    #BDNombre="ngModel" required [(ngModel)]="FormRegistro.BDNombre" />
                                <label *ngIf="!BDNombre.valid && (BDNombre.dirty || BDNombre.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_DATABASE_FIELD_REQUIRED' | translate
                                    }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="BDUser"> {{
                                    'ADMINISTRACION_BD.CONEXIONES.GESTION.DATABASE_USER' |
                                    translate }}</label>
                                <input class="form-control form-input" id="BDUser" name="BDUser" type="text"
                                    placeholder="{{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_USER' | translate }}"
                                    [ngClass]="{ 'is-invalid': !BDUser.valid && (BDUser.dirty || BDUser.touched || isSubmit) }"
                                    #BDUser="ngModel" required [(ngModel)]="FormRegistro.BDUser" />
                                <label *ngIf="!BDUser.valid && (BDUser.dirty || BDUser.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_USER_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="BDPassword"> {{
                                    'ADMINISTRACION_BD.CONEXIONES.GESTION.DATABASE_PASSWORD' |
                                    translate }}</label>
                                <input class="form-control form-input" id="BDPassword" name="BDPassword" type="text"
                                    placeholder="{{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_PASSWORD' | translate }}"
                                    [ngClass]="{ 'is-invalid': !BDPassword.valid && (BDPassword.dirty || BDPassword.touched || isSubmit) }"
                                    #BDPassword="ngModel" required [(ngModel)]="FormRegistro.BDPassword" />
                                <label *ngIf="!BDPassword.valid && (BDPassword.dirty || BDPassword.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_PASSWORD_FIELD_REQUIRED' | translate
                                    }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-control-label" for="BDPort"> {{
                                    'ADMINISTRACION_BD.CONEXIONES.GESTION.DATABASE_PORT' |
                                    translate }}</label>
                                <input class="form-control form-input" id="BDPort" name="BDPort" type="text"
                                    placeholder="{{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_DATABASE_PORT' | translate }}"
                                    [ngClass]="{ 'is-invalid': !BDPort.valid && (BDPort.dirty || BDPort.touched || isSubmit) }"
                                    #BDPort="ngModel" required [(ngModel)]="FormRegistro.BDPort" />
                                <label *ngIf="!BDPort.valid && (BDPort.dirty || BDPort.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'ADMINISTRACION_BD.CONEXIONES.GESTION.ENTER_PORT_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label"> {{ 'COMMON.DESCRIPTION' | translate }}</label>
                                <app-text-editor [toolbarType]="tipoEditorTexto"
                                    [contentHtml]="FormRegistro.descripcionConexion ?? ''"
                                    (contentHtmlChange)="actualizarDescripcionVersion($event)"
                                    name="descripcionConexion" [(ngModel)]="FormRegistro.descripcionConexion" [ngClass]="{
                    'is-invalid': !descripcionConexion.valid && (descripcionConexion.dirty || descripcionConexion.touched || isSubmit)
                  }" #descripcionConexion="ngModel" required rows="5">
                                </app-text-editor>
                                <label
                                    *ngIf="!descripcionConexion.valid && (descripcionConexion.dirty || descripcionConexion.touched || isSubmit)"
                                    class="error jquery-validation-error small form-text invalid-feedback">
                                    {{ 'COMMON.ENTER_DESCRIPTION_FIELD_REQUIRED' | translate }}
                                </label>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="form-label">{{ 'ADMINISTRACION_BD.CONEXIONES.CONNECTION_STATUS' |
                                    translate }}</label>
                                <div class="radio-buttons">
                                    <label class="radio-button">
                                        <input name="option" type="radio" [value]="true"
                                            [(ngModel)]="FormRegistro.estadoConexion" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.ACTIVE' | translate }}</span>
                                    </label><br />
                                    <label class="radio-button">
                                        <input name="option" type="radio" [value]="false"
                                            [(ngModel)]="FormRegistro.estadoConexion" />
                                        <div class="radio-circle"></div>
                                        <span class="radio-label">{{ 'COMMON.INACTIVE' | translate }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
